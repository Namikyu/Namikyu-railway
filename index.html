
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>波急電鉄 ホームページ</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="波急電鉄・波急サーバー公式ホームページ">

  <link rel="icon" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">

  <meta property="og:title" content="波急電鉄 ホームページ">
  <meta property="og:description" content="波急サーバー公式ホームページ">
  <meta property="og:url" content="https://namikyu.github.io/Namikyu-railway/">
  <meta property="og:image" content="https://namikyu.github.io/Namikyu-railway/home.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden !important;
      overscroll-behavior: none;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
      background: #075d9b;
    }

    body {
      position: fixed;
      inset: 0;
    }

    .page {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 青いヘッダー：約2倍の高さ */
    .header {
      width: 100%;
      height: 120px;
      min-height: 120px;
      max-height: 120px;
      flex: 0 0 120px;
      padding: 8px 3%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      overflow: hidden;
      color: white;
      background: linear-gradient(
        110deg,
        #075d9b 0%,
        #087fc4 55%,
        #129bd2 100%
      );
    }

    /* 左側：ロゴとタイトル */
    .header-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex: 0 1 42%;
      min-width: 0;
      margin: 0;
    }

    .logo {
      display: block;
      width: 80px;
      height: 80px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      color: white;
      font-size: clamp(30px, 3.5vw, 44px);
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1.15;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 5px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2em;
      white-space: nowrap;
    }

    /* 右側：大きくしたページボタン */
    .navigation {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1 1 58%;
      min-width: 0;
      gap: 9px;
      margin: 0;
    }

    .navigation a {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1 1 0;
      min-width: 0;
      height: 52px;
      padding: 8px 7px;
      color: white;
      text-decoration: none;
      font-size: clamp(11px, 1.1vw, 15px);
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.12);
      transition: background 0.2s;
    }

    .navigation a:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* 画像部分：ヘッダーと重ねない */
    .hero {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      line-height: 0;
      background: #075d9b;
    }

    /* 画像は縮小せず、上側を見切らせる */
    .hero img {
      display: block;
      width: 100%;
      height: auto;
      max-width: none;
      margin: 0;
      padding: 0;
      border: 0;
      transform: translateY(-8%);
    }

    /* スマートフォン */
    @media (max-width: 650px) {
      .header {
        height: 150px;
        min-height: 150px;
        max-height: 150px;
        flex-basis: 150px;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        padding: 6px 2%;
      }

      .header-top {
        flex: 0 0 auto;
        gap: 8px;
      }

      .logo {
        width: 48px;
        height: 48px;
      }

      .brand-title {
        font-size: 25px;
      }

      .brand-subtitle {
        font-size: 9px;
      }

      .navigation {
        width: 100%;
        flex: 0 0 auto;
        gap: 5px;
      }

      .navigation a {
        height: 42px;
        padding: 5px 3px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="header">

      <div class="header-top">
        <img
          class="logo"
          src="./icon.png"
          alt="波急電鉄ロゴ"
        >

        <div class="brand-text">
          <h1 class="brand-title">波急サーバー</h1>
          <div class="brand-subtitle">NAMIKYU RAILWAY</div>
        </div>
      </div>

      <nav class="navigation">
        <a href="./index.html">ホーム</a>
        <a href="./news.html">お知らせ</a>
        <a href="./join.html">サーバー参加</a>
        <a href="./status.html">在線位置</a>
        <a href="./staff.html">運営メンバー</a>
      </nav>

    </header>

    <main class="hero">
      <img src="./home.png" alt="波急電鉄 メインビジュアル">
    </main>

  </div>
</body>
</html>
