
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>波急サーバー | NAMIKYU RAILWAY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
      background: #eef2f7;
      color: #24364b;
    }

    /* =========================
       ヘッダー
    ========================= */

    .header {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 120px;
      padding: 12px 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: linear-gradient(110deg, #075d9b, #087fc4, #129bd2);
      color: white;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .brand img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 30px;
      font-weight: bold;
      line-height: 1.3;
    }

    .brand-subtitle {
      font-size: 12px;
      letter-spacing: 3px;
      opacity: 0.9;
    }

    /* =========================
       ナビゲーション
    ========================= */

    .navigation {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 9px;
    }

    .navigation a {
      min-height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 9px;
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .navigation a:hover,
    .navigation a.active {
      background: rgba(255,255,255,0.2);
    }

    /* =========================
       メイン画像エリア
    ========================= */

    .hero {
      position: relative;
      z-index: 1;
      width: 100%;
      height: calc(100vh - 120px);
      height: calc(100dvh - 120px);
      overflow: hidden;
      background: #dce8f2;
    }

    /* 背景画像を一番後ろに配置 */
    .hero-image {
      position: absolute;
      z-index: 0;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    /* =========================
       説明ボックス
    ========================= */

    .description-box {
      position: absolute;
      z-index: 5;

      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%);

      display: block;
      visibility: visible;
      opacity: 1;

      width: min(760px, calc(100% - 60px));
      padding: 30px 36px;

      background: rgba(255, 255, 255, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 16px;

      box-shadow: 0 8px 30px rgba(20, 43, 73, 0.20);

      color: #24364b;
    }

    .description-title {
      display: block;
      margin: 0 0 16px;
      padding: 0 0 12px;

      border-bottom: 2px solid #d4e5f2;

      color: #142b49;
      font-size: 25px;
      font-weight: bold;
      line-height: 1.5;
    }

    .description-text {
      display: block;
      margin: 0;

      color: #24364b;
      font-size: 16px;
      font-weight: normal;
      line-height: 2;

      overflow-wrap: anywhere;
    }

    .description-text p {
      margin: 0 0 12px;
    }

    .description-text p:last-child {
      margin-bottom: 0;
    }

    /* =========================
       タブレット・スマートフォン
    ========================= */

    @media (max-width: 900px) {
      .header {
        height: 150px;
        padding: 10px 12px;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
      }

      .brand {
        gap: 10px;
      }

      .brand img {
        width: 48px;
        height: 48px;
      }

      .brand-name {
        font-size: 22px;
      }

      .brand-subtitle {
        font-size: 10px;
      }

      .navigation {
        width: 100%;
        justify-content: center;
        gap: 6px;
      }

      .navigation a {
        min-height: 42px;
        padding: 0 11px;
        font-size: 12px;
      }

      .hero {
        height: calc(100vh - 150px);
        height: calc(100dvh - 150px);
      }

      .description-box {
        top: 58%;
        width: calc(100% - 36px);
        padding: 22px 24px;
      }

      .description-title {
        font-size: 21px;
      }

      .description-text {
        font-size: 14px;
        line-height: 1.9;
      }
    }

    /* 小型スマートフォン */
    @media (max-width: 480px) {
      .navigation {
        gap: 4px;
      }

      .navigation a {
        padding: 0 7px;
        font-size: 10px;
      }

      .description-box {
        top: 58%;
        width: calc(100% - 24px);
        padding: 17px 18px;
        border-radius: 12px;
      }

      .description-title {
        margin-bottom: 10px;
        padding-bottom: 8px;
        font-size: 18px;
      }

      .description-text {
        font-size: 12px;
        line-height: 1.8;
      }
    }

    /* 画面の高さが低い場合 */
    @media (max-height: 650px) and (min-width: 901px) {
      .description-box {
        top: 52%;
        padding: 19px 26px;
      }

      .description-title {
        margin-bottom: 9px;
        padding-bottom: 7px;
        font-size: 21px;
      }

      .description-text {
        font-size: 14px;
        line-height: 1.7;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header class="header">

    <div class="brand">
      <img src="./icon.png" alt="波急サーバーロゴ">

      <div>
        <div class="brand-name">波急サーバー</div>
        <div class="brand-subtitle">NAMIKYU RAILWAY</div>
      </div>
    </div>

    <nav class="navigation">
      <a href="./index.html" class="active">ホーム</a>
      <a href="./news.html">お知らせ</a>
      <a href="./join.html">サーバー参加</a>
      <a href="./status.html">在線位置</a>
      <a href="./staff.html">運営メンバー</a>
    </nav>

  </header>

  <!-- メイン画像 -->
  <main class="hero">

    <!-- 背景画像 -->
    <img
      src="./home.png"
      alt="波急サーバーのメイン画像"
      class="hero-image"
    >

    <!-- 説明ボックス -->
    <section class="description-box">

      <h1 class="description-title">
        波急サーバー公式サイトへようこそ
      </h1>

      <div class="description-text">

        <p>
          当サイトは、Minecraft Bedrock Edition（統合版）向けの鉄道アドオンを使用した、自動運転サーバー「波急サーバー」の公式サイトです。
        </p>

        <p>
          本サイトでは、サーバーへの参加方法をはじめ、アップデートや変更に関するお知らせ、サーバーに関する各種情報を順次掲載してまいります。
        </p>

        <p>
          波急サーバーについて知りたい方や、参加をご検討中の方は、ぜひ各ページをご覧ください。
        </p>

      </div>

    </section>

  </main>

</body>
</html>
