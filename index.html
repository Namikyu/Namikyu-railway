
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ホーム | 波急サーバー</title>

  <link rel="icon" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
      color: #24364b;
      background: #eef2f7;
    }

    /* =========================
       ヘッダー：news.htmlと完全共通
    ========================= */

    .header {
      width: 100%;
      height: 120px;
      min-height: 120px;
      max-height: 120px;
      padding: 8px 3%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      overflow: hidden;
      background: linear-gradient(
        110deg,
        #075d9b 0%,
        #087fc4 55%,
        #129bd2 100%
      );
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex: 0 1 42%;
      min-width: 0;
      margin: 0;
    }

    .logo {
      display: block;
      width: 80px;
      height: 80px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      color: white;
      font-size: clamp(30px, 3.5vw, 44px);
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1.15;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 5px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2em;
      white-space: nowrap;
    }

    .navigation {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1 1 58%;
      min-width: 0;
      gap: 9px;
      margin: 0;
    }

    .navigation a {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1 1 0;
      min-width: 0;
      height: 52px;
      padding: 8px 7px;
      color: white;
      text-decoration: none;
      font-size: clamp(11px, 1.1vw, 15px);
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.12);
      transition: background 0.2s;
    }

    .navigation a:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* =========================
       ホーム画面
    ========================= */

    .hero {
      position: relative;
      width: 100%;
      height: calc(100vh - 120px);
      height: calc(100dvh - 120px);
      overflow: hidden;
      background: #dce8f2;
    }

    .hero-image {
      position: absolute;
      z-index: 0;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    /* =========================
       説明ボックス
    ========================= */

    .description-box {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 2%;
      transform: translateX(-50%);
      width: min(760px, calc(100% - 60px));
      padding: 28px 34px;

      /* 白背景の透明度20%・ぼかしなし */
      background: rgba(255, 255, 255, 0.20);

      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(20, 43, 73, 0.08);

      color: #142b49;
    }

    .description-title {
      margin: 0 0 15px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(8, 127, 196, 0.25);
      color: #142b49;
      font-size: 25px;
      font-weight: bold;
      line-height: 1.5;
    }

    .description-text {
      margin: 0;
      color: #24364b;
      font-size: 16px;
      font-weight: 600;
      line-height: 2;
      overflow-wrap: break-word;
    }

    .description-text p {
      margin: 0 0 10px;
    }

    .description-text p:last-child {
      margin-bottom: 0;
    }

    /* =========================
       タブレット
    ========================= */

    @media (max-width: 900px) {
      .description-box {
        width: calc(100% - 36px);
        padding: 20px 22px;
      }

      .description-title {
        font-size: 21px;
      }

      .description-text {
        font-size: 14px;
        line-height: 1.85;
      }
    }

    /* =========================
       スマートフォン
       ヘッダーはnews.htmlと完全共通
    ========================= */

    @media (max-width: 650px) {
      .header {
        height: 150px;
        min-height: 150px;
        max-height: 150px;
        flex-basis: 150px;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        padding: 6px 2%;
      }

      .header-top {
        flex: 0 0 auto;
        gap: 8px;
      }

      .logo {
        width: 48px;
        height: 48px;
      }

      .brand-title {
        font-size: 25px;
      }

      .brand-subtitle {
        font-size: 9px;
      }

      .navigation {
        width: 100%;
        flex: 0 0 auto;
        gap: 5px;
      }

      .navigation a {
        height: 42px;
        padding: 5px 3px;
        font-size: 10px;
      }

      .hero {
        height: calc(100vh - 150px);
        height: calc(100dvh - 150px);
      }

      .description-box {
        bottom: 2%;
        width: calc(100% - 24px);
        padding: 15px 17px;
        border-radius: 12px;
      }

      .description-title {
        margin-bottom: 10px;
        padding-bottom: 8px;
        font-size: 18px;
      }

      .description-text {
        font-size: 12px;
        line-height: 1.75;
      }

      .description-text p {
        margin-bottom: 7px;
      }
    }

    /* =========================
       画面の高さが低い場合
    ========================= */

    @media (max-height: 650px) and (min-width: 651px) {
      .description-box {
        bottom: 1%;
        padding: 18px 26px;
      }

      .description-title {
        margin-bottom: 8px;
        padding-bottom: 7px;
        font-size: 21px;
      }

      .description-text {
        font-size: 14px;
        line-height: 1.7;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー：news.htmlと同じHTML構造 -->
  <header class="header">

    <div class="header-top">
      <img
        class="logo"
        src="./icon.png"
        alt="波急電鉄ロゴ"
      >

      <div class="brand-text">
        <h1 class="brand-title">波急サーバー</h1>
        <div class="brand-subtitle">NAMIKYU RAILWAY</div>
      </div>
    </div>

    <nav class="navigation">
      <a href="./index.html">ホーム</a>
      <a href="./news.html">お知らせ</a>
      <a href="./join.html">サーバー参加</a>
      <a href="./status.html">在線位置</a>
      <a href="./staff.html">運営メンバー</a>
    </nav>

  </header>

  <!-- メイン画像 -->
  <main class="hero">

    <img
      src="./home.png"
      alt="波急サーバーのメイン画像"
      class="hero-image"
    >

    <!-- 説明ボックス -->
    <section class="description-box">

      <h2 class="description-title">
        波急サーバー公式サイトへようこそ
      </h2>

      <div class="description-text">

        <p>
          当サイトは、Minecraft Bedrock Edition（統合版）向けの鉄道アドオンを使用した、自動運転サーバー「波急サーバー」の公式サイトです。
        </p>

        <p>
          本サイトでは、サーバーへの参加方法をはじめ、アップデートや変更に関するお知らせ、サーバーに関する各種情報を順次掲載してまいります。
        </p>

        <p>
          波急サーバーについて知りたい方や、参加をご検討中の方は、ぜひ各ページをご覧ください。
        </p>

      </div>

    </section>

  </main>

</body>
</html>
