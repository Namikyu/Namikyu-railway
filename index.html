
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>波急電鉄 ホームページ</title>

  <meta name="description" content="波急電鉄の公式ホームページです。">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" href="./icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon.png">

  <meta property="og:title" content="波急電鉄 ホームページ">
  <meta property="og:description" content="波急電鉄の公式ホームページです。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://namikyu.github.io/Namikyu-railway/">
  <meta property="og:image" content="https://namikyu.github.io/Namikyu-railway/home.png">
  <meta property="og:site_name" content="波急電鉄">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --main-blue: #087fc4;
      --deep-blue: #075d9b;
      --navy: #12395c;
      --text: #263f59;
      --muted: #718ba3;
      --background: #edf5fa;
      --border: #d8e8f3;
    }

    body {
      margin: 0;
      font-family:
        "Yu Gothic UI",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.8;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================
       青いヘッダー
    ========================= */

    .header {
      width: 100%;
      background: linear-gradient(
        110deg,
        #075d9b,
        #087fc4,
        #129bd2
      );
      padding: 20px 6% 0;
      color: white;
      box-shadow: 0 4px 15px rgba(0, 60, 110, 0.15);
    }

    .header-top {
      display: flex;
      align-items: center;
      min-height: 105px;
      padding-bottom: 17px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-icon {
      width: 90px;
      height: 90px;
      object-fit: contain;
      display: block;
    }

    .header-title {
      color: #ffffff;
      font-size: 35px;
      font-weight: 900;
      letter-spacing: 0.08em;
      margin: 0;
      text-shadow: 0 2px 6px rgba(0, 30, 70, 0.2);
    }

    .header-subtitle {
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      letter-spacing: 0.18em;
      margin-top: 3px;
      font-weight: 600;
    }

    /* =========================
       ページ選択ボタン
    ========================= */

    .navigation {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 0 17px;
    }

    .nav-link {
      display: inline-block;
      color: #ffffff;
      padding: 9px 19px;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 800;
      transition: 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .nav-link.active {
      background: #ffffff;
      color: var(--main-blue);
      border-color: #ffffff;
    }

    /* =========================
       メイン画像
    ========================= */

    .hero {
      width: 100%;
      background: #dceefa;
      overflow: hidden;
    }

    .hero-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 680px;
      object-fit: cover;
      display: block;
    }

    /* =========================
       フッター
    ========================= */

    footer {
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 30px 20px;
      text-align: center;
    }

    .footer-name {
      font-size: 16px;
      color: var(--navy);
      font-weight: 900;
    }

    .footer-copy {
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    /* =========================
       スマートフォン対応
    ========================= */

    @media (max-width: 650px) {
      .header {
        padding: 12px 15px 0;
      }

      .header-top {
        min-height: 75px;
        padding-bottom: 12px;
      }

      .header-brand {
        gap: 12px;
      }

      .header-icon {
        width: 62px;
        height: 62px;
      }

      .header-title {
        font-size: 23px;
        letter-spacing: 0.03em;
      }

      .header-subtitle {
        font-size: 10px;
      }

      .navigation {
        gap: 6px;
        padding-bottom: 13px;
      }

      .nav-link {
        padding: 7px 11px;
        font-size: 11px;
      }

      .hero-image {
        aspect-ratio: 16 / 9;
        min-height: 220px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       青いヘッダー
  ========================= -->

  <header class="header">

    <div class="header-top">

      <a href="./index.html" class="header-brand">

        <img
          src="./icon.png"
          alt="波急ロゴ"
          class="header-icon"
        >

        <div>
          <h1 class="header-title">
            波急サーバー
          </h1>

          <div class="header-subtitle">
            NAMIKYU RAILWAY
          </div>
        </div>

      </a>

    </div>

    <!-- 青い部分にページ選択ボタンを集約 -->

    <nav class="navigation">

      <a href="./index.html" class="nav-link active">
        ホーム
      </a>

      <a href="./news.html" class="nav-link">
        お知らせ
      </a>

      <a href="./join.html" class="nav-link">
        サーバー参加
      </a>

      <a href="./status.html" class="nav-link">
        在線位置
      </a>

      <a href="./staff.html" class="nav-link">
        運営メンバー
      </a>

    </nav>

  </header>


  <!-- =========================
       メイン画像
  ========================= -->

  <section class="hero">

    <img
      src="./home.png"
      alt="波急電鉄 メインビジュアル"
      class="hero-image"
    >

  </section>


  <!-- =========================
       フッター
  ========================= -->

  <footer>

    <div class="footer-name">
      波急電鉄
    </div>

    <div class="footer-copy">
      © 2026 Namikyu Railway. All Rights Reserved.
    </div>

  </footer>

</body>
</html>
