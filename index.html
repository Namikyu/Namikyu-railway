<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>〇〇鉄道サーバー 公式サイト</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f4f6f9; color: #333; }
    header { background: #1e3a8a; color: white; padding: 20px; text-align: center; }
    .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
    .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { border-left: 5px solid #1e3a8a; padding-left: 10px; }
    .train-box { background: #eef2ff; padding: 15px; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>

<header>
  <h1>〇〇鉄道サーバー 公式サイト</h1>
  <p>本格鉄道運転・街づくりMinecraftサーバー</p>
</header>

<div class="container">
  <div class="card">
    <h2>🚆 リアルタイム在線位置</h2>
    <div id="train-status" class="train-box">
      現在、列車データを読み込み中...（ここにプログラムを組み込みます）
    </div>
  </div>

  <div class="card">
    <h2>📖 サーバー概要</h2>
    <p>当サーバーは、リアルな運行ダイヤと自動信号システムを備えた鉄道サーバーです。</p>
  </div>

  <div class="card">
    <h2>🎮 参加方法</h2>
    <ul>
      <li><strong>バージョン：</strong> Java版 1.20.4</li>
      <li><strong>サーバーIP：</strong> ://example.com</li>
      <li><strong>必須Mod：</strong> なし（バニラで参加可能）</li>
    </ul>
  </div>
</div>

</body>
</html>
