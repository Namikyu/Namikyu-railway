
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>波急電鉄 ホームページ</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="波急電鉄・波急サーバー公式ホームページ">

  <link rel="icon" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">

  <meta property="og:title" content="波急電鉄 ホームページ">
  <meta property="og:description" content="波急サーバー公式ホームページ">
  <meta property="og:url" content="https://namikyu.github.io/Namikyu-railway/">
  <meta property="og:image" content="https://namikyu.github.io/Namikyu-railway/home.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #075d9b;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #075d9b;
    }

    .header {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 35px 6% 30px;
      color: white;
      background: linear-gradient(
        135deg,
        #075d9b 0%,
        #087fc4 55%,
        #129bd2 100%
      );
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 24px;
      margin: 0 auto 35px;
      width: 100%;
      max-width: 1400px;
    }

    .logo {
      width: 115px;
      height: 115px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(42px, 6vw, 76px);
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.2;
    }

    .brand-subtitle {
      margin-top: 8px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.28em;
      opacity: 0.9;
    }

    .navigation {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .navigation a {
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 145px;
      padding: 15px 24px;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      transition: background 0.2s, transform 0.2s;
    }

    .navigation a:hover {
      background: rgba(255, 255, 255, 0.27);
      transform: translateY(-2px);
    }

    .hero {
      width: 100%;
      margin: 0;
      padding: 0;
      line-height: 0;
      background: #075d9b;
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      border: 0;
    }

    @media (max-width: 650px) {
      .header {
        padding: 30px 5% 25px;
      }

      .header-top {
        gap: 14px;
        margin-bottom: 28px;
      }

      .logo {
        width: 75px;
        height: 75px;
      }

      .brand-title {
        font-size: 36px;
      }

      .brand-subtitle {
        font-size: 11px;
      }

      .navigation {
        gap: 9px;
      }

      .navigation a {
        min-width: 42%;
        padding: 12px 10px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="header">
      <div class="header-top">
        <img class="logo" src="./icon.png" alt="波急電鉄ロゴ">

        <div class="brand-text">
          <h1 class="brand-title">波急サーバー</h1>
          <div class="brand-subtitle">NAMIKYU RAILWAY</div>
        </div>
      </div>

      <nav class="navigation">
        <a href="./index.html">ホーム</a>
        <a href="./news.html">お知らせ</a>
        <a href="./join.html">サーバー参加</a>
        <a href="./status.html">在線位置</a>
        <a href="./staff.html">運営メンバー</a>
      </nav>
    </header>

    <main class="hero">
      <img src="./home.png" alt="波急電鉄 メインビジュアル">
    </main>

  </div>
</body>
</html>
