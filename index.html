
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>波急サーバー | NAMIKYU RAILWAY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
      color: #24364b;
      background: #eef2f7;
    }

    /* ヘッダー */
    .header {
      width: 100%;
      height: 120px;
      padding: 12px 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: linear-gradient(110deg, #075d9b, #087fc4, #129bd2);
      color: white;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .brand img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 30px;
      font-weight: bold;
      line-height: 1.3;
    }

    .brand-subtitle {
      font-size: 12px;
      letter-spacing: 3px;
      opacity: 0.9;
    }

    /* ナビゲーション */
    .navigation {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 9px;
    }

    .navigation a {
      min-height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 9px;
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .navigation a:hover,
    .navigation a.active {
      background: rgba(255,255,255,0.2);
    }

    /* メイン画像 */
    .hero {
      position: relative;
      width: 100%;
      height: calc(100vh - 120px);
      overflow: hidden;
      background: #dce8f2;
    }

    .hero-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    /* 説明ボックス */
    .description-box {
      position: absolute;
      left: 50%;
      bottom: 9%;
      transform: translateX(-50%);
      width: min(760px, calc(100% - 60px));
      padding: 28px 34px;
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: 16px;
      background: rgba(255,255,255,0.84);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(20,43,73,0.16);
    }

    .description-title {
      margin: 0 0 15px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(8,127,196,0.25);
      color: #142b49;
      font-size: 25px;
      font-weight: bold;
    }

    .description-text {
      margin: 0;
      color: #24364b;
      font-size: 16px;
      line-height: 2;
      overflow-wrap: break-word;
    }

    /* タブレット・スマートフォン */
    @media (max-width: 900px) {
      .header {
        height: 150px;
        padding: 10px 12px;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
      }

      .brand {
        gap: 10px;
      }

      .brand img {
        width: 48px;
        height: 48px;
      }

      .brand-name {
        font-size: 22px;
      }

      .brand-subtitle {
        font-size: 10px;
      }

      .navigation {
        width: 100%;
        justify-content: center;
        gap: 6px;
      }

      .navigation a {
        min-height: 42px;
        padding: 0 11px;
        font-size: 12px;
      }

      .hero {
        height: calc(100vh - 150px);
      }

      .description-box {
        bottom: 7%;
        width: calc(100% - 36px);
        padding: 20px 22px;
      }

      .description-title {
        font-size: 21px;
      }

      .description-text {
        font-size: 14px;
        line-height: 1.85;
      }
    }

    @media (max-width: 480px) {
      .navigation {
        gap: 4px;
      }

      .navigation a {
        padding: 0 7px;
        font-size: 10px;
      }

      .description-box {
        bottom: 5%;
        width: calc(100% - 24px);
        padding: 15px 17px;
        border-radius: 12px;
      }

      .description-title {
        margin-bottom: 10px;
        padding-bottom: 8px;
        font-size: 18px;
      }

      .description-text {
        font-size: 12px;
        line-height: 1.75;
      }
    }

    @media (max-height: 650px) and (min-width: 901px) {
      .description-box {
        bottom: 4%;
        padding: 18px 26px;
      }

      .description-title {
        margin-bottom: 8px;
        padding-bottom: 7px;
        font-size: 21px;
      }

      .description-text {
        font-size: 14px;
        line-height: 1.7;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <div class="brand">
      <img src="./icon.png" alt="波急サーバーロゴ">

      <div>
        <div class="brand-name">波急サーバー</div>
        <div class="brand-subtitle">NAMIKYU RAILWAY</div>
      </div>
    </div>

    <nav class="navigation">
      <a href="./index.html" class="active">ホーム</a>
      <a href="./news.html">お知らせ</a>
      <a href="./join.html">サーバー参加</a>
      <a href="./status.html">在線位置</a>
      <a href="./staff.html">運営メンバー</a>
    </nav>

  </header>

  <main class="hero">

    <img
      src="./home.png"
      alt="波急サーバーのメイン画像"
      class="hero-image"
    >

    <section class="description-box">

      <h1 class="description-title">
        波急サーバー公式サイトへようこそ
      </h1>

      <p class="description-text">
        当サイトは、Minecraft Bedrock Edition（統合版）向けの鉄道アドオンを使用した、自動運転サーバー「波急サーバー」の公式サイトです。
        <br>
        本サイトでは、サーバーへの参加方法をはじめ、アップデートや変更に関するお知らせ、サーバーに関する各種情報を順次掲載してまいります。
        <br>
        波急サーバーについて知りたい方や、参加をご検討中の方は、ぜひ各ページをご覧ください。
      </p>

    </section>

  </main>

</body>
</html>
