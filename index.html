
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>波急電鉄 ホームページ</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="波急電鉄・波急サーバー公式ホームページ">

  <link rel="icon" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">

  <meta property="og:title" content="波急電鉄 ホームページ">
  <meta property="og:description" content="波急サーバー公式ホームページ">
  <meta property="og:url" content="https://namikyu.github.io/Namikyu-railway/">
  <meta property="og:image" content="https://namikyu.github.io/Namikyu-railway/home.png">

  <style>
    * {
      box-sizing: border-box;
    }

    /* ホーム画面だけスクロール禁止 */
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden !important;
      overscroll-behavior: none;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
      background: #075d9b;
    }

    body {
      position: fixed;
      top: 0;
      left: 0;
    }

    /* ページ全体 */
    .page {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 青いヘッダー：高さ60px */
    .header {
      width: 100%;
      height: 60px;
      min-height: 60px;
      max-height: 60px;
      flex: 0 0 60px;
      padding: 2px 2%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      overflow: hidden;
      background: linear-gradient(
        110deg,
        #075d9b 0%,
        #087fc4 55%,
        #129bd2 100%
      );
    }

    /* 左側：ロゴとタイトル */
    .header-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex: 0 1 40%;
      min-width: 0;
      margin: 0;
    }

    .logo {
      display: block;
      width: 40px;
      height: 40px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      color: white;
      font-size: clamp(19px, 2.5vw, 29px);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.1;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: white;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.15em;
      line-height: 1;
      white-space: nowrap;
    }

    /* 右側：ページボタン */
    .navigation {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1 1 60%;
      min-width: 0;
      gap: 5px;
      margin: 0;
    }

    .navigation a {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1 1 0;
      min-width: 0;
      height: 30px;
      padding: 2px 4px;
      color: white;
      text-decoration: none;
      font-size: clamp(9px, 0.85vw, 12px);
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.12);
    }

    .navigation a:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* 画像：縮小せず、画面下で見切る */
    .hero {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      line-height: 0;
      background: #075d9b;
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
      max-width: none;
      margin: 0;
      padding: 0;
      border: 0;
    }

    /* 狭い画面 */
    @media (max-width: 650px) {
      .header {
        height: 88px;
        min-height: 88px;
        max-height: 88px;
        flex-basis: 88px;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
        padding: 3px 2%;
      }

      .header-top {
        flex: 0 0 auto;
        gap: 5px;
      }

      .logo {
        width: 32px;
        height: 32px;
      }

      .brand-title {
        font-size: 19px;
      }

      .brand-subtitle {
        font-size: 7px;
      }

      .navigation {
        flex: 0 0 auto;
        width: 100%;
        gap: 4px;
      }

      .navigation a {
        height: 28px;
        font-size: 9px;
        padding: 2px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="header">

      <div class="header-top">
        <img
          class="logo"
          src="./icon.png"
          alt="波急電鉄ロゴ"
        >

        <div class="brand-text">
          <h1 class="brand-title">波急サーバー</h1>
          <div class="brand-subtitle">NAMIKYU RAILWAY</div>
        </div>
      </div>

      <nav class="navigation">
        <a href="./index.html">ホーム</a>
        <a href="./news.html">お知らせ</a>
        <a href="./join.html">サーバー参加</a>
        <a href="./status.html">在線位置</a>
        <a href="./staff.html">運営メンバー</a>
      </nav>

    </header>

    <main class="hero">
      <img src="./home.png" alt="波急電鉄 メインビジュアル">
    </main>

  </div>
</body>
</html>
