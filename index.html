
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="波急サーバー 公式サイト">
  <meta property="og:description" content="波急サーバーの公式サイトです。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://namikyu.github.io/Namikyu-railway/">
  <meta property="og:image" content="https://namikyu.github.io/Namikyu-railway/icon.png">

  <title>波急サーバー | 公式サイト</title>

  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #142b49;
      --blue: #2878c8;
      --text: #26374a;
      --muted: #718096;
      --border: #e5eaf0;
      --background: #f4f6f9;
    }

    body {
      margin: 0;
      font-family: "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.8;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* 上部タイトルエリア */

    .header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 55px 24px 35px;
    }

    .header-inner {
      max-width: 1050px;
      margin: auto;
    }

    .site-title {
      color: var(--navy);
      font-size: 36px;
      font-weight: 800;
      margin: 0;
      letter-spacing: 0.06em;
    }

    .site-description {
      color: var(--muted);
      font-size: 14px;
      margin: 8px 0 0;
    }

    /* お知らせ・トピック */

    .information {
      background: #ffffff;
      padding: 0 24px 35px;
    }

    .information-inner {
      max-width: 1050px;
      margin: auto;
    }

    .info-section {
      padding: 20px 0;
      border-top: 1px solid var(--border);
    }

    .info-title {
      color: var(--navy);
      font-size: 17px;
      font-weight: 800;
      margin: 0 0 12px;
    }

    .news-item {
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: 13px;
      padding: 7px 0;
    }

    .news-date {
      color: var(--muted);
      white-space: nowrap;
    }

    .news-text {
      color: var(--text);
    }

    .topic-text {
      color: var(--muted);
      font-size: 13px;
      margin: 0;
    }

    /* ホーム画像 */

    .home {
      max-width: 1050px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .home-image {
      width: 100%;
      height: 330px;
      object-fit: cover;
      display: block;
      border-radius: 6px;
      background: #dce5ef;
    }

    /* メニューボタン */

    .menu-title {
      color: var(--navy);
      font-size: 21px;
      margin: 30px 0 18px;
      font-weight: 800;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .menu-button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 23px 20px;
      display: block;
      transition: 0.2s;
    }

    .menu-button:hover {
      border-color: var(--blue);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(20,43,73,0.07);
    }

    .menu-name {
      display: block;
      color: var(--navy);
      font-size: 16px;
      font-weight: 800;
    }

    .menu-description {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .menu-arrow {
      display: block;
      color: var(--blue);
      font-size: 19px;
      text-align: right;
      margin-top: 8px;
    }

    /* フッター */

    footer {
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 22px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 700px) {
      .header {
        padding: 40px 20px 28px;
      }

      .site-title {
        font-size: 29px;
      }

      .information {
        padding: 0 20px 25px;
      }

      .news-item {
        gap: 10px;
        align-items: flex-start;
      }

      .home {
        margin: 25px auto;
        padding: 0 16px;
      }

      .home-image {
        height: 210px;
      }

      .menu-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .menu-button {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- タイトル・説明 -->
  <header class="header">
    <div class="header-inner">
      <h1 class="site-title">波急サーバー</h1>
      <p class="site-description">
        鉄道と街がつながる、Minecraftの世界。
      </p>
    </div>
  </header>

  <!-- お知らせ・トピック -->
  <section class="information">
    <div class="information-inner">

      <div class="info-section">
        <h2 class="info-title">お知らせ</h2>

        <div class="news-item">
          <span class="news-date">2026.11.20</span>
          <span class="news-text">
            公式サイトを公開しました。
          </span>
        </div>
      </div>

      <div class="info-section">
        <h2 class="info-title">Topics</h2>

        <p class="topic-text">
          波急サーバーの最新情報や注目トピックを掲載します。
        </p>
      </div>

    </div>
  </section>

  <!-- ホーム画像・メニュー -->
  <main class="home">

    <!-- ホーム画像を変更する場合は src を変更 -->
    <img
      class="home-image"
      src="home.png"
      alt="波急サーバーのホーム画像"
    >

    <h2 class="menu-title">MENU</h2>

    <div class="menu-grid">

      <a href="join.html" class="menu-button">
        <span class="menu-name">サーバーへの参加</span>
        <span class="menu-description">
          接続方法・参加案内はこちら
        </span>
        <span class="menu-arrow">→</span>
      </a>

      <a href="status.html" class="menu-button">
        <span class="menu-name">在線位置</span>
        <span class="menu-description">
          列車の現在位置を確認
        </span>
        <span class="menu-arrow">→</span>
      </a>

      <a href="staff.html" class="menu-button">
        <span class="menu-name">運営メンバー</span>
        <span class="menu-description">
          波急サーバーの運営スタッフ紹介
        </span>
        <span class="menu-arrow">→</span>
      </a>

    </div>

  </main>

  <!-- フッター -->
  <footer>
    &copy; 2026 Namikyu Server. All Rights Reserved.
  </footer>

</body>
</html>
