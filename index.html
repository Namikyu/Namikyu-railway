
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>波急電鉄 ホームページ</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="波急電鉄・波急サーバー公式ホームページ">

  <link rel="icon" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">

  <meta property="og:title" content="波急電鉄 ホームページ">
  <meta property="og:description" content="波急サーバー公式ホームページ">
  <meta property="og:url" content="https://namikyu.github.io/Namikyu-railway/">
  <meta property="og:image" content="https://namikyu.github.io/Namikyu-railway/home.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
      background: #075d9b;
    }

    .page {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 青いヘッダー */
    .header {
      flex: 0 0 auto;
      width: 100%;
      padding: clamp(12px, 3vh, 28px) 5% clamp(12px, 2vh, 20px);
      color: white;
      background: linear-gradient(
        135deg,
        #075d9b 0%,
        #087fc4 55%,
        #129bd2 100%
      );
    }

    /* ロゴとタイトル */
    .header-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2vw, 22px);
      margin: 0 auto clamp(12px, 2.5vh, 25px);
    }

    .logo {
      width: clamp(55px, 10vh, 95px);
      height: clamp(55px, 10vh, 95px);
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(30px, 5.5vh, 58px);
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.15;
    }

    .brand-subtitle {
      margin-top: 5px;
      font-size: clamp(10px, 1.5vh, 15px);
      font-weight: 600;
      letter-spacing: 0.25em;
    }

    /* ページ選択ボタン */
    .navigation {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: clamp(6px, 1vw, 12px);
      width: 100%;
    }

    .navigation a {
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: clamp(105px, 12vw, 145px);
      padding: clamp(9px, 1.5vh, 13px) clamp(12px, 1.8vw, 22px);
      color: white;
      text-decoration: none;
      font-size: clamp(12px, 1.7vh, 16px);
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.12);
      white-space: nowrap;
      transition: background 0.2s;
    }

    .navigation a:hover {
      background: rgba(255, 255, 255, 0.27);
    }

    /* 画像部分：残った高さに合わせて表示 */
    .hero {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #075d9b;
      line-height: 0;
    }

    .hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    /* 横幅が狭い画面 */
    @media (max-width: 650px) {
      .header {
        padding: 12px 3% 12px;
      }

      .header-top {
        margin-bottom: 12px;
      }

      .logo {
        width: 52px;
        height: 52px;
      }

      .brand-title {
        font-size: clamp(25px, 6vw, 34px);
      }

      .brand-subtitle {
        font-size: 9px;
      }

      .navigation {
        gap: 6px;
      }

      .navigation a {
        min-width: 0;
        flex: 1 1 28%;
        padding: 9px 5px;
        font-size: 11px;
      }
    }

    /* 高さが低い画面 */
    @media (max-height: 600px) {
      .header {
        padding-top: 8px;
        padding-bottom: 8px;
      }

      .header-top {
        margin-bottom: 8px;
      }

      .logo {
        width: 48px;
        height: 48px;
      }

      .brand-title {
        font-size: 30px;
      }

      .navigation a {
        padding: 7px 12px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="header">
      <div class="header-top">
        <img class="logo" src="./icon.png" alt="波急電鉄ロゴ">

        <div class="brand-text">
          <h1 class="brand-title">波急サーバー</h1>
          <div class="brand-subtitle">NAMIKYU RAILWAY</div>
        </div>
      </div>

      <nav class="navigation">
        <a href="./index.html">ホーム</a>
        <a href="./news.html">お知らせ</a>
        <a href="./join.html">サーバー参加</a>
        <a href="./status.html">在線位置</a>
        <a href="./staff.html">運営メンバー</a>
      </nav>
    </header>

    <main class="hero">
      <img src="./home.png" alt="波急電鉄 メインビジュアル">
    </main>

  </div>
</body>
</html>
