
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>波急電鉄 ホームページ</title>

  <!-- サイト情報 -->
  <meta name="description" content="波急電鉄の公式ホームページです。">
  <meta name="robots" content="noindex, nofollow">

  <!-- サイトアイコン -->
  <link rel="icon" href="./icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon.png">

  <!-- OGP：SNS共有時の表示設定 -->
  <meta property="og:title" content="波急電鉄 ホームページ">
  <meta property="og:description" content="波急電鉄の公式ホームページです。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://namikyu.github.io/Namikyu-railway/">
  <meta property="og:image" content="https://namikyu.github.io/Namikyu-railway/home.png">
  <meta property="og:site_name" content="波急電鉄">

  <meta name="twitter:card" content="summary_large_image">

  <style>
    /* =========================
       基本設定
    ========================= */

    * {
      box-sizing: border-box;
    }

    :root {
      --main-blue: #168fc5;
      --dark-blue: #126f9e;
      --navy: #173653;
      --text: #283b50;
      --muted: #77899b;
      --background: #f3f6f9;
      --border: #e3eaf0;
      --white: #ffffff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        "Yu Gothic UI",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.8;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================
       ヘッダー
    ========================= */

    .header {
      width: 100%;
      height: 72px;
      background-color: #168fc5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      position: relative;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 43px;
      height: 43px;
      object-fit: contain;
      display: block;
    }

    .header-title {
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.04em;
      margin: 0;
    }

    /* お知らせボタン */

    .header-news {
      display: inline-block;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.85);
      padding: 7px 20px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      transition: 0.2s;
    }

    .header-news:hover {
      background: #ffffff;
      color: var(--main-blue);
    }

    /* =========================
       メイン画像
    ========================= */

    .hero {
      width: 100%;
      background: #dceaf3;
      overflow: hidden;
    }

    .hero-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 650px;
      object-fit: cover;
      display: block;
    }

    /* =========================
       メインコンテンツ
    ========================= */

    .main-container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 45px 25px 70px;
    }

    .section {
      margin-bottom: 48px;
    }

    .section-heading {
      margin-bottom: 20px;
    }

    .section-heading h2 {
      font-size: 23px;
      font-weight: 800;
      color: var(--navy);
      margin: 0;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 13px;
      margin: 3px 0 0;
    }

    .heading-line {
      width: 42px;
      height: 3px;
      background: var(--main-blue);
      margin-top: 9px;
    }

    /* =========================
       メニューカード
    ========================= */

    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .category-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      min-height: 145px;
      transition: 0.2s;
    }

    .category-card:hover {
      border-color: var(--main-blue);
      transform: translateY(-3px);
      box-shadow: 0 5px 16px rgba(20, 60, 90, 0.07);
    }

    .category-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--main-blue);
      letter-spacing: 0.12em;
    }

    .category-title {
      color: var(--navy);
      font-size: 17px;
      font-weight: 800;
      margin-top: 5px;
    }

    .category-description {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .category-arrow {
      color: var(--main-blue);
      font-size: 19px;
      text-align: right;
      margin-top: auto;
    }

    /* =========================
       フッター
    ========================= */

    footer {
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 28px 20px;
      text-align: center;
    }

    .footer-name {
      font-size: 15px;
      color: var(--navy);
      font-weight: 800;
    }

    .footer-copy {
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    /* =========================
       スマートフォン対応
    ========================= */

    @media (max-width: 650px) {
      .header {
        height: 62px;
        padding: 0 12px;
      }

      .header-icon {
        width: 36px;
        height: 36px;
      }

      .header-title {
        font-size: 15px;
      }

      .header-brand {
        gap: 8px;
      }

      .header-news {
        padding: 6px 11px;
        font-size: 12px;
      }

      .main-container {
        padding: 32px 16px 50px;
      }

      .section {
        margin-bottom: 38px;
      }

      .section-heading h2 {
        font-size: 20px;
      }

      .category-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .category-card {
        min-height: 125px;
        padding: 19px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       ヘッダー
  ========================= -->

  <header class="header">

    <a href="./index.html" class="header-brand">

      <img
        src="./icon.png"
        alt="波急アイコン"
        class="header-icon"
      >

      <h1 class="header-title">
        波急電鉄 ホームページ
      </h1>

    </a>

    <a href="./news.html" class="header-news">
      お知らせ
    </a>

  </header>


  <!-- =========================
       メイン画像
  ========================= -->

  <section class="hero">

    <img
      src="./home.png"
      alt="波急電鉄 メインビジュアル"
      class="hero-image"
    >

  </section>


  <!-- =========================
       メインメニュー
  ========================= -->

  <main class="main-container">

    <section class="section" id="menu">

      <div class="section-heading">

        <h2>各種メニュー</h2>

        <div class="heading-line"></div>

        <p>
          ご利用目的に合わせて各ページをご覧ください。
        </p>

      </div>


      <div class="category-grid">

        <!-- サーバー参加 -->

        <a href="./join.html" class="category-card">

          <span class="category-label">
            JOIN THE SERVER
          </span>

          <span class="category-title">
            サーバーへの参加
          </span>

          <span class="category-description">
            波急サーバーへの参加方法をご案内します。
          </span>

          <span class="category-arrow">→</span>

        </a>


        <!-- 在線位置 -->

        <a href="./status.html" class="category-card">

          <span class="category-label">
            LIVE STATUS
          </span>

          <span class="category-title">
            在線位置
          </span>

          <span class="category-description">
            サーバーの在線位置を確認できます。
          </span>

          <span class="category-arrow">→</span>

        </a>


        <!-- 運営メンバー -->

        <a href="./staff.html" class="category-card">

          <span class="category-label">
            STAFF
          </span>

          <span class="category-title">
            運営メンバー
          </span>

          <span class="category-description">
            波急サーバーの運営メンバーをご紹介します。
          </span>

          <span class="category-arrow">→</span>

        </a>

      </div>

    </section>

  </main>


  <!-- =========================
       フッター
  ========================= -->

  <footer>

    <div class="footer-name">
      波急電鉄
    </div>

    <div class="footer-copy">
      © Namikyu Railway. All Rights Reserved.
    </div>

  </footer>

</body>
</html>
