const stableId=t=>{const v=t?.id??t?.uuid??t?.uniqueId??t?.unique_id??t?.entityId??t?.entity_id;return v==null||v===""?null:String(v)};
const tags=e=>{const v=e?.tags??e?.tag??[];return Array.isArray(v)?v.map(x=>String(x).toLowerCase()):typeof v==="string"?v.toLowerCase().split(/[,\s]+/).filter(Boolean):[]};
const getRole=p=>staffMap.get(getName(p).toLowerCase())||{label:"参加者",className:"role-participant"};
function trainType(g,z,water){
 if(g.includes("ltd"))return{key:"ltd",name:"特急",label:"特",color:"#f97316"};
 if(g.includes("exp"))return{key:"exp",name:"急行",label:"急",color:"#dc2626"};
 if(g.includes("sexp"))return z<-18||z>6131
  ?{key:"sexp-local",name:"各駅停車",label:"各",color:"#2878c8"}
  :{key:"sexp",name:"準急",label:"準",color:"#16a34a"};
 if(g.includes("local2"))return{key:"local2",name:"各駅停車",label:"各",color:"#60a5fa"};
 if(g.includes("local"))return{key:"local",name:"各駅停車",label:"各",color:"#2878c8"};
 if(water)return{key:"waterline",name:"普通",label:"普",color:"#888"};
 return{key:"unknown",name:"その他",label:"不",color:"#222"};
}
function trainInfo(t){
 if(cache.has(t))return cache.get(t);
 const g=tags(t),p=coords(t);
 const water=p.x>=-608&&p.x<=692&&p.z>=3957&&p.z<=5257&&!g.some(x=>TYPE_TAGS.includes(x));
 const d=g.includes("z-")?"z-":g.includes("z+")||g.includes("z")?"z+":g.includes("x-")?"x-":"x+";
 const a=(ANGLES[d]||0)*Math.PI/180;
 const match=KTS.exec(t?.car_type_id)||KTS.exec(t?.car_name);
 const type=trainType(g,p.z,water);
 const c={
  ...p,id:stableId(t),d,c:Math.cos(a),s:Math.sin(a),type,
  model:MODELS[match?.[1]]||"不明",
  route:water?"水鉄水山線":(p.x>=50&&p.z>=4000&&p.z<=5000)?"川鉄依丘線":p.z>6131?"雨急雨波線":p.z<-18?"矢野電鉄":"波急波川線",
  destination:water?"草市～水山 往復":DEST[type.key]?DEST[type.key][d==="z+"||d==="x+"?0:1]:"不明"
 };
 cache.set(t,c);return c;
}
function speedOf(t){
 const s=Number(t?.sokudo??(t?.speed!=null?t.speed/2:NaN));
 if(s===59)return 120;
 if(Number.isFinite(s)&&s<0)return 0;
 const p=Number(t?.speed);
 return!Number.isFinite(p)||p<0?0:p;
}
async function loadStaff(){
 try{
  const r=await fetch("./staff.html",{cache:"no-store"});
  if(!r.ok)throw Error(r.status);
  const doc=new DOMParser().parseFromString(await r.text(),"text/html");
  const m=new Map();
  doc.querySelectorAll(".staff-card").forEach(c=>{
   const name=c.querySelector(".staff-name")?.textContent.trim();
   const badge=c.querySelector(".role-badge");
   if(!name||!badge)return;
   const label=badge.textContent.trim();
   const role=badge.classList.contains("role-owner")? "role-owner":
    badge.classList.contains("role-developer")?"role-developer":
    badge.classList.contains("role-moderator")?"role-moderator":"role-participant";
   m.set(name.toLowerCase(),{label:label||"運営",className:role});
  });
  staffMap=m;
 }catch(e){console.warn("スタッフ情報の取得に失敗:",e)}
}
/* SVG座標1単位が画面上で何pxになるか */
function dimensions(){
 const r=map.getBoundingClientRect();
 return{width:Math.max(1,r.width),aspect:r.width/Math.max(1,r.height)};
}
const scale=()=>view.w/dimensions().width;
function renderRoute(){
 set(routeLayer,`
  <path class="route-line route-wave" d="M0 -17 L0 6132"/>
  <path class="route-line route-yano" d="M0 -17 L0 -7323"/>
  <path class="route-line route-depot" d="M0 -7323 L-9 -7550"/>
  <path class="route-line route-kawatei" d="M0 4080 C0 4330 0 4498 124 4498 L2542 4498"/>
  <path class="route-line route-depot" d="M2542 4498 L2680 4492"/>
 `);
 set(stationLayer,stations.map(st=>{
  const cls=st.line==="depot"?"station-depot":st.line==="yano"?"station-yano":st.line==="kawatei"?"station-kawatei":"station-wave";
  const labelY=st.labelY??-28;
  return `<g transform="translate(${st.x} ${st.z})">
   <circle class="station-dot ${cls}" r="38"/>
   <text class="station-label" x="70" y="${labelY}" font-size="145"><tspan>${esc(st.name)}</tspan><tspan class="station-reading" x="70" dy="100">${esc(st.reading)}</tspan></text>
  </g>`;
 }).join(""));
}
function applyView(render=true){
 view.h=view.w/dimensions().aspect;
 map.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`);
 const right=view.x+view.w,bottom=view.y+view.h,lines=[];
 for(let x=Math.floor(view.x/GRID);x<=Math.ceil(right/GRID);x++)lines.push(`M${x*GRID} ${view.y}V${bottom}`);
 for(let y=Math.floor(view.y/GRID);y<=Math.ceil(bottom/GRID);y++)lines.push(`M${view.x} ${y*GRID}H${right}`);
 set(gridLayer,`<path class="grid-line" d="${lines.join(" ")}"/>`);
 renderRoute();
 if(render&&latest)renderMarkers();
}
function fitView(){
 const a=dimensions().aspect;
 const pts=[...players,...trains].map(toMap).concat(
  stations.map(st=>({x:st.x,y:st.z})),
  [{x:0,y:-17},{x:0,y:6132},{x:0,y:-7323},{x:-9,y:-7550}]
 );
 const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 const pad=Math.max(1000,Math.max(x1-x0,y1-y0)*.12);
 view.w=clamp(Math.max(x1-x0+pad*2,(y1-y0+pad*2)*a),MIN_W,MAX_W);
 view.h=view.w/a;view.x=(x0+x1)/2-view.w/2;view.y=(y0+y1)/2-view.h/2;
 applyView();
}
/* 列車マーカー：地図座標に合わせて拡大縮小 */
const pathShape=(h,t)=>`M${-h} ${-h}L${h} ${-h}L${t} 0L${h} ${h}L${-h} ${h}Z`;
function trainMarker(t,i){
 const c=trainInfo(t),h=110,tip=235;
 return `<g class="train-marker" data-kind="train" data-index="${i}" tabindex="0" role="button" transform="translate(${c.x} ${c.z})">
  <g transform="rotate(${ANGLES[c.d]||0})"><path class="train-hit-area" d="${pathShape(120,250)}" stroke-width="120"/><path class="train-visual" d="${pathShape(h,tip)}" fill="${c.type.color}" stroke="#fff" stroke-width="9" stroke-linejoin="round"/></g>
  <text class="train-label" font-size="130">${esc(c.type.label)}</text>
 </g>`;
}
/* 長いプレイヤー名は地図座標上で幅を制限 */
function playerMarker(p,i,pos){
 const n=getName(p),faceSize=180,labelW=clamp(n.length*65,250,1000),labelH=120,ly=100;
 return `<g class="player-marker" data-kind="player" data-index="${i}" tabindex="0" role="button" transform="translate(${pos.x} ${pos.y})">
  <rect x="${-faceSize/2-30}" y="${-faceSize/2-30}" width="${faceSize+60}" height="${faceSize+60}" fill="transparent"/>
  <image href="${face(n)}" x="${-faceSize/2}" y="${-faceSize/2}" width="${faceSize}" height="${faceSize}" preserveAspectRatio="none"/>
  <rect class="player-name-background" x="${-labelW/2}" y="${ly}" width="${labelW}" height="${labelH}" rx="28"/>
  <text class="player-name-label" x="0" y="${ly+labelH/2}" font-size="85" textLength="${labelW-50}" lengthAdjust="spacingAndGlyphs">${esc(n)}</text>
 </g>`;
}
/* プレイヤーが列車マーカーに重ならないようにする */
function avoidTrains(pos,tp){
 const h=120,tip=250,r=110,poly=[[-h,-h],[h,-h],[tip,0],[h,h],[-h,h]],limit=(tip+r)**2;
 let x=pos.x,y=pos.y;
 for(let pass=0;pass<3;pass++){
  let moved=false;
  for(const t of tp){
   const dx=x-t.x,dy=y-t.z;if(dx*dx+dy*dy>limit)continue;
   const lx=dx*t.c+dy*t.s,ly=-dx*t.s+dy*t.c;let best=Infinity,qx=0,qy=0,inside=true;
   for(let i=0;i<5;i++){
    const a=poly[i],b=poly[(i+1)%5],ax=b[0]-a[0],ay=b[1]-a[1];
    const k=clamp(((lx-a[0])*ax+(ly-a[1])*ay)/(ax*ax+ay*ay),0,1),px=a[0]+ax*k,py=a[1]+ay*k,d=Math.hypot(lx-px,ly-py);
    if(d<best){best=d;qx=px;qy=py}if(ax*(ly-a[1])-ay*(lx-a[0])<0)inside=false;
   }
   if(!inside&&best>=r)continue;
   let ux=inside?qx-lx:lx-qx,uy=inside?qy-ly:ly-qy,len=Math.hypot(ux,uy);
   if(len<1e-9){ux=0;uy=-1}else{ux/=len;uy/=len}
   const nx=qx+ux*r,ny=qy+uy*r;x=t.x+nx*t.c-ny*t.s;y=t.z+nx*t.s+ny*t.c;moved=true;
  }
  if(!moved)break;
 }
 return{x,y};
}
function renderMarkers(){
 if(!latest)return;const tp=trains.map(trainInfo);
 set(markerLayer,trains.map((t,i)=>trainMarker(t,i)).join("")+players.map((p,i)=>playerMarker(p,i,avoidTrains(toMap(p),tp))).join(""));
 ppCount.textContent=players.length;
 set(pList,players.length?players.map((p,i)=>{const n=getName(p),r=getRole(p);return `<button class="player-row" type="button" data-player-index="${i}"><img src="${face(n)}" alt="" loading="lazy"><span class="player-row-info"><span class="player-row-name">${esc(n)}</span><span class="player-role-badge ${r.className}">${esc(r.label)}</span></span></button>`}).join(""):'<div class="player-empty">現在オンラインのプレイヤーはいません</div>');
}
const detailItem=(label,value,wide=false)=>`<div class="detail-item${wide?" wide":""}">
 <div class="detail-label">${label}</div><div class="detail-value">${value}</div></div>`;
function openModal(){modal.classList.add("open");document.body.style.overflow="hidden";closeBtn.focus()}
function closeModal(){modal.classList.remove("open");document.body.style.overflow="";selectedPlayer=null;selectedTrain=null}
function showPlayer(p){
 selectedPlayer=getName(p);selectedTrain=null;mTitle.textContent="プレイヤー情報";
 const role=getRole(p),n=getName(p);
 mContent.innerHTML=`<div class="detail-player"><img src="${face(n)}" alt="">
  <div><div class="detail-player-name">${esc(n)}</div>
  <div class="player-role-badge detail-player-role ${role.className}">${esc(role.label)}</div></div></div>
  <div class="detail-grid">${detailItem("座標 (X, Y, Z)",xyz(coords(p)),true)}</div>
  <div class="detail-note">在線情報は自動更新されます。</div>`;
 openModal();
}
function showTrain(t){
 const c=trainInfo(t),d={"x+":"東方向（X＋）","x-":"西方向（X−）","z+":"南方向（Z＋）","z-":"北方向（Z−）"};
 selectedTrain=c.id;selectedPlayer=null;mTitle.textContent="列車情報";
 mContent.innerHTML=`<div class="train-summary" style="border-color:${c.type.color}">
  <span class="train-type" style="background:${c.type.color}">${esc(c.type.name)}</span>
  <span class="train-destination">${esc(c.destination)} 行</span></div>
  <div class="detail-grid">
  ${detailItem("種別",esc(c.type.name))}${detailItem("形式",esc(c.model))}
  ${detailItem("行先",esc(c.destination))}${detailItem("路線",esc(c.route))}
  ${detailItem("速度",fmt(speedOf(t),0)+" km/h")}${detailItem("進行方向",d[c.d]||"不明")}
  ${detailItem("座標 (X, Y, Z)",xyz(c),true)}</div>
  <div class="detail-note">在線情報は自動更新されます。</div>`;
 openModal();
}
function refreshDetail(){
 if(!modal.classList.contains("open"))return;
 if(selectedPlayer){
  const p=players.find(x=>getName(x)===selectedPlayer);
  if(p)showPlayer(p);
  else mContent.innerHTML='<div class="player-empty">このプレイヤーは現在オンラインではありません。</div>';
 }else if(selectedTrain!==null){
  const t=trains.find(x=>trainInfo(x).id===selectedTrain);
  if(t)showTrain(t);
  else mContent.innerHTML='<div class="player-empty">選択中の列車は現在見つかりません。</div>';
 }
}
function markerOf(target){
 return(target instanceof Element?target:target?.parentElement)?.closest("[data-kind][data-index]");
}
markerLayer.addEventListener("click",e=>{
 const el=markerOf(e.target);
 if(!el||dragMoved)return;
 const i=Number(el.dataset.index);
 if(el.dataset.kind==="player"&&players[i])showPlayer(players[i]);
 if(el.dataset.kind==="train"&&trains[i])showTrain(trains[i]);
});
markerLayer.addEventListener("keydown",e=>{
 if(e.key!=="Enter"&&e.key!==" ")return;
 const el=markerOf(e.target);if(!el)return;
 e.preventDefault();
 const i=Number(el.dataset.index);
 if(el.dataset.kind==="player"&&players[i])showPlayer(players[i]);
 if(el.dataset.kind==="train"&&trains[i])showTrain(trains[i]);
});
pList.addEventListener("click",e=>{
 const b=(e.target instanceof Element?e.target:e.target?.parentElement)?.closest("[data-player-index]");
 if(b&&players[Number(b.dataset.playerIndex)])showPlayer(players[Number(b.dataset.playerIndex)]);
});
function setConnection(ok){
 connDot.classList.toggle("online",ok);
 connDot.classList.toggle("offline",!ok);
 connText.textContent=ok?"サーバー接続中":"サーバーに接続できません";
}
async function fetchStatus(){
 if(isFetching)return;
 isFetching=true;
 try{
  const res=await fetch(API_URL,{cache:"no-store"});
  if(!res.ok)throw Error(`HTTP ${res.status}`);
  const data=await res.json();
  if(data?.success===false)throw Error(data.error||"API error");
  latest=data;
  const r=data?.data??data?.status??data??{};
  players=list(r.players??r.player??r.onlinePlayers??[]);
  trains=list(r.trains??r.train??r.carts??[]);
  wtText.textContent=`ワールド時刻：${r.worldTime??r.time??r.world_time??"--"}`;
  wxText.textContent=`天候：${r.weather??r.worldWeather??r.world_weather??"--"}`;
  tpsText.textContent=`TPS：${fmt(r.tps??r.TPS??"--",0)}`;
  pcText.textContent=players.length;tcText.textContent=`列車：${trains.length}編成`;
  lastUpd.textContent=`最終更新：${new Date().toLocaleTimeString("ja-JP",{hour12:false})}`;
  setConnection(true);lastOk=Date.now();
  if(map.dataset.initialized!=="true"){fitView();map.dataset.initialized="true"}
  else renderMarkers();
  refreshDetail();
 }catch(e){console.error("在線データ取得エラー:",e);setConnection(false)}
 finally{isFetching=false}
}
function scheduleRefresh(){
 clearTimeout(refreshTimer);
 refreshTimer=setTimeout(async()=>{await fetchStatus();scheduleRefresh()},1000);
}
function refreshNow(){clearTimeout(refreshTimer);fetchStatus().finally(scheduleRefresh)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshNow()});
window.addEventListener("focus",refreshNow);
window.addEventListener("online",refreshNow);
window.addEventListener("pagehide",()=>clearTimeout(refreshTimer));
setInterval(()=>{if(lastOk&&Date.now()-lastOk>10000)setConnection(false)},3000);
/* ズーム：地図の表示範囲だけを変更 */
function zoomAt(f,cx,cy){
 const r=map.getBoundingClientRect();
 if(!r.width||!r.height)return;
 const px=(cx-r.left)/r.width,py=(cy-r.top)/r.height;
 const wx=view.x+px*view.w,wy=view.y+py*view.h;
 view.w=clamp(view.w*f,MIN_W,MAX_W);view.h=view.w/dimensions().aspect;
 view.x=wx-px*view.w;view.y=wy-py*view.h;
 applyView();
}
function zoomCenter(f){
 const r=map.getBoundingClientRect();
 zoomAt(f,r.left+r.width/2,r.top+r.height/2);
}
$("zoomIn").addEventListener("click",()=>zoomCenter(.75));
$("zoomOut").addEventListener("click",()=>zoomCenter(1.33));
$("resetView").addEventListener("click",fitView);
map.addEventListener("wheel",e=>{
 e.preventDefault();zoomAt(e.deltaY<0?.9:1.1,e.clientX,e.clientY);
},{passive:false});
/* 地図ドラッグ */
map.addEventListener("pointerdown",e=>{
 if(e.button!==0||markerOf(e.target))return;
 const target=e.target instanceof Element?e.target:e.target?.parentElement;
 if(target?.closest(".map-controls")||target?.closest(".player-panel"))return;
 dragging=true;dragMoved=false;
 dragStart={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};
 map.classList.add("dragging");
});
window.addEventListener("pointermove",e=>{
 if(!dragging||!dragStart)return;
 const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y,s=scale();
 if(Math.abs(dx)+Math.abs(dy)>3)dragMoved=true;
 view.x=dragStart.vx-dx*s;view.y=dragStart.vy-dy*s;
 applyView(false);
});
function stopDragging(){
 if(!dragging)return;
 dragging=false;dragStart=null;map.classList.remove("dragging");
 renderMarkers();
 setTimeout(()=>dragMoved=false,120);
}
window.addEventListener("pointerup",stopDragging);
window.addEventListener("pointercancel",stopDragging);
/* キーボードによる地図移動 */
window.addEventListener("keydown",e=>{
 if(modal.classList.contains("open")){if(e.key==="Escape")closeModal();return}
 if(e.target instanceof HTMLElement&&e.target.matches("input,textarea,button,a"))return;
 const step=view.w*.08;
 const moves={ArrowUp:[0,-step],ArrowDown:[0,step],ArrowLeft:[-step,0],ArrowRight:[step,0]};
 if(moves[e.key]){
  e.preventDefault();view.x+=moves[e.key][0];view.y+=moves[e.key][1];applyView(false);
 }else if(e.key==="+"||e.key==="="){e.preventDefault();zoomCenter(.75)}
 else if(e.key==="-"){e.preventDefault();zoomCenter(1.33)}
});
collapseBtn.addEventListener("click",()=>{
 pPanel.classList.toggle("collapsed");
 collapseBtn.textContent=pPanel.classList.contains("collapsed")?"+":"−";
});
closeBtn.addEventListener("click",closeModal);
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
window.addEventListener("resize",()=>{
 cancelAnimationFrame(resizeFrame);
 resizeFrame=requestAnimationFrame(()=>{view.h=view.w/dimensions().aspect;applyView()});
});
/* 起動 */
(async()=>{
 await loadStaff();
 await fetchStatus();
 scheduleRefresh();
})();
</script>
