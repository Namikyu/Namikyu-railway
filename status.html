<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>在線位置 | 波急サーバー</title>
<link rel="icon" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  min-height: 0;
  margin: 0;
  overflow: hidden;
  font-family:
    "Noto Sans JP",
    "BIZ UDPGothic",
    "Yu Gothic UI",
    "Meiryo",
    sans-serif;
  color: #24364b;
  background: #eef2f7;
  -webkit-font-smoothing: antialiased;
}

/* =====================================
   ヘッダー：既存デザインを維持
===================================== */

.header {
  width: 100%;
  height: 120px;
  min-height: 120px;
  max-height: 120px;
  padding: 8px 3%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  overflow: hidden;
  background: linear-gradient(110deg, #075d9b 0%, #087fc4 55%, #129bd2 100%);
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex: 0 1 42%;
  min-width: 0;
  margin: 0;
}

.logo {
  display: block;
  width: 80px;
  height: 80px;
  object-fit: contain;
  flex-shrink: 0;
}

.brand-text {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
}

.brand-title {
  margin: 0;
  color: white;
  font-size: clamp(30px, 3.5vw, 44px);
  font-weight: 800;
  letter-spacing: .06em;
  line-height: 1.15;
  white-space: nowrap;
}

.brand-subtitle {
  margin-top: 5px;
  color: white;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .2em;
  white-space: nowrap;
}

.navigation {
  display: flex;
  justify-content: center;
  align-items: center;
  flex: 1 1 58%;
  min-width: 0;
  gap: 9px;
  margin: 0;
}

.navigation a {
  display: flex;
  justify-content: center;
  align-items: center;
  flex: 1 1 0;
  min-width: 0;
  height: 52px;
  padding: 8px 7px;
  color: white;
  text-decoration: none;
  font-size: clamp(11px, 1.1vw, 15px);
  font-weight: 700;
  white-space: nowrap;
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 7px;
  background: rgba(255,255,255,.12);
  transition: background .2s;
}

.navigation a:hover,
.navigation a.active {
  background: rgba(255,255,255,.28);
}

/* =====================================
   メイン画面
===================================== */

main {
  height: calc(100dvh - 120px);
  min-height: 0;
  padding: 13px 18px 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.page-title {
  flex-shrink: 0;
  margin: 0 0 2px;
  color: #142b49;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: .015em;
}

.page-subtitle {
  flex-shrink: 0;
  margin: 0 0 10px;
  color: #8295a8;
  font-size: 9px;
  letter-spacing: 2px;
  font-weight: 800;
}

/* 接続状態 */

.status-line {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
  margin-bottom: 8px;
  padding: 10px 13px;
  background: #ffffff;
  border: 1px solid #e1e9f1;
  border-radius: 9px;
  box-shadow: 0 2px 8px rgba(20,43,73,.045);
  font-size: 11px;
  color: #61768b;
}

.status-line strong {
  color: #263e58;
  font-size: 11px;
  font-weight: 800;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #999;
  flex-shrink: 0;
}

.status-dot.online {
  background: #20a464;
  box-shadow: 0 0 0 3px #20a46420;
}

.status-dot.offline {
  background: #d33;
  box-shadow: 0 0 0 3px #d3323220;
}

/* 凡例 */

.legend {
  flex-shrink: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 15px;
  margin: 5px 0 9px;
  font-size: 10px;
  font-weight: 600;
  color: #536b82;
}

.legend span {
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.legend i {
  width: 9px;
  height: 9px;
  border-radius: 3px;
  display: inline-block;
}

/* =====================================
   マップ
===================================== */

#mapArea {
  position: relative;
  width: 100%;
  flex: 1 1 0;
  min-height: 0;
  overflow: hidden;
  border: 1px solid #dce5ed;
  border-radius: 10px;
  background:
    linear-gradient(rgba(255,255,255,.65), rgba(255,255,255,.65)),
    #f3f7fb;
  box-shadow: 0 3px 14px rgba(20,43,73,.065);
}

#map {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
  touch-action: none;
  overflow: visible;
}

#map.dragging {
  cursor: grabbing;
}

.grid-line {
  stroke: #dce5ed;
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
  pointer-events: none;
}

/* マーカー */

.player-marker,
.train-marker {
  cursor: pointer;
}

.player-marker {
  pointer-events: auto;
}

.train-marker {
  pointer-events: auto;
}

.player-face {
  image-rendering: pixelated;
  pointer-events: none;
}

/* 列車マーカー文字 */

.train-label {
  font-family:
    "Noto Sans JP",
    "BIZ UDPGothic",
    "Yu Gothic UI",
    "Meiryo",
    sans-serif;
  font-weight: 900;
  text-anchor: middle;
  dominant-baseline: central;
  alignment-baseline: central;
  fill: #ffffff;
  stroke: rgba(0,0,0,.12);
  stroke-width: .35px;
  paint-order: stroke fill;
  pointer-events: none;
  user-select: none;
}

/* プレイヤー名 */

.player-name-label {
  font-family:
    "Noto Sans JP",
    "BIZ UDPGothic",
    "Yu Gothic UI",
    "Meiryo",
    sans-serif;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
  fill: #263e58;
  stroke: #ffffff;
  stroke-width: 3px;
  paint-order: stroke fill;
  pointer-events: none;
  user-select: none;
}

/* マーカーのホバー */

.train-marker:hover path {
  stroke: #ffffff;
  stroke-width: 2.4px;
  filter: brightness(1.08);
}

.player-marker:hover image {
  filter: brightness(1.12);
}

/* 方角表示 */

.map-compass {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px;
  color: #536b82;
  background: rgba(255,255,255,.95);
  border: 1px solid #dce5ed;
  border-radius: 6px;
  box-shadow: 0 2px 7px rgba(20,43,73,.07);
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
  pointer-events: none;
}

.map-compass strong {
  color: #176da8;
  font-size: 11px;
}

/* =====================================
   プレイヤー一覧
===================================== */

#playerPanel {
  position: absolute;
  top: 12px;
  left: 12px;
  width: min(270px, calc(100% - 24px));
  max-height: 65%;
  display: flex;
  flex-direction: column;
  background: rgba(255,255,255,.97);
  border: 1px solid #dce5ed;
  border-radius: 9px;
  box-shadow: 0 3px 14px rgba(20,43,73,.11);
  z-index: 3;
  overflow: hidden;
  backdrop-filter: blur(8px);
}

.panel-head {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-bottom: 1px solid #e8edf2;
  font-size: 11px;
  font-weight: 800;
  color: #193b5c;
}

.panel-head button,
.map-controls button {
  border: 1px solid #d4e0eb;
  background: #ffffff;
  color: #24415f;
  border-radius: 6px;
  cursor: pointer;
  transition: background .15s, border-color .15s, transform .15s;
}

.panel-head button:hover,
.map-controls button:hover {
  background: #edf5fc;
  border-color: #a9c4dc;
}

.panel-head button:active,
.map-controls button:active {
  transform: scale(.96);
}

.panel-head button {
  padding: 5px 9px;
  font-size: 9px;
  font-weight: 700;
}

#playerList {
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  padding: 4px 10px;
}

.player-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 2px;
  border-bottom: 1px solid #edf1f5;
  min-width: 0;
}

.player-row:last-child {
  border-bottom: none;
}

.player-row img {
  width: 30px;
  height: 30px;
  object-fit: cover;
  border-radius: 5px;
  background: #e8eef4;
  image-rendering: pixelated;
  flex-shrink: 0;
}

.player-info {
  min-width: 0;
  flex: 1;
}

.player-gamertag {
  font-size: 11px;
  font-weight: 700;
  overflow-wrap: anywhere;
  color: #263e58;
}

.role {
  display: inline-block;
  margin-top: 3px;
  padding: 2px 6px;
  border-radius: 3px;
  background: #e8eef5;
  color: #40566d;
  font-size: 8px;
  font-weight: 700;
}

.role-owner {
  background: #ffe08a;
  color: #795000;
}

.role-developer {
  background: #f3c4ec;
  color: #842c73;
}

.role-moderator {
  background: #fbd8e7;
  color: #a34470;
}

.role-leave {
  background: #d9dee3;
  color: #555f69;
}

/* =====================================
   マップ操作ボタン
===================================== */

.map-controls {
  position: absolute;
  right: 12px;
  top: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 2;
}

.map-controls button {
  width: 38px;
  height: 38px;
  padding: 0;
  font-size: 19px;
  font-weight: 600;
}

/* =====================================
   詳細画面
===================================== */

#detailBackdrop {
  position: fixed;
  inset: 0;
  background: rgba(10,25,42,.52);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 20;
  backdrop-filter: blur(3px);
}

#detailCard {
  position: relative;
  width: min(520px, 100%);
  max-height: 88dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: #ffffff;
  border: 3px solid #2878c8;
  border-radius: 13px;
  box-shadow: 0 18px 55px rgba(0,0,0,.24);
  animation: detailAppear .18s ease-out;
}

@keyframes detailAppear {
  from {
    opacity: 0;
    transform: translateY(8px) scale(.985);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

#detailAccent {
  height: 6px;
  background: #2878c8;
}

#detailClose {
  position: absolute;
  right: 15px;
  top: 15px;
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 7px;
  background: #edf2f7;
  color: #24364b;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  transition: background .15s;
}

#detailClose:hover {
  background: #dce8f2;
}

#detailContent {
  padding: 27px 26px;
}

#detailContent h3 {
  margin: 0 45px 16px 0;
  color: #142b49;
  font-size: 21px;
  font-weight: 800;
}

#detailContent p {
  margin: 11px 0;
  font-size: 14px;
  line-height: 1.8;
}

/* 列車詳細 */

.detail-train-heading {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  width: 100%;
  margin: 10px 0 23px;
}

#detailContent .detail-type {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 7px 13px;
  border: 2px solid var(--type-color, #2878c8);
  border-radius: 6px;
  background: var(--type-color, #2878c8);
  color: #fff;
  font-size: 15px;
  font-weight: 800;
  white-space: nowrap;
  margin: 0;
}

.detail-destination {
  color: #142b49;
  font-size: 27px;
  font-weight: 800;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.detail-information {
  border-top: 1px solid #e5ebf1;
  padding-top: 13px;
}

.detail-information p {
  margin: 11px 0;
  color: #40566d;
}

.detail-information b {
  color: #193b5c;
}

/* =====================================
   タブレット
===================================== */

@media(max-width:900px) {
  .header-top {
    flex-basis: 38%;
  }

  .navigation {
    gap: 5px;
  }

  .navigation a {
    font-size: 11px;
    padding: 6px 3px;
  }
}

/* =====================================
   スマートフォン
===================================== */

@media(max-width:650px) {
  .header {
    height: 150px;
    min-height: 150px;
    max-height: 150px;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    padding: 6px 2%;
  }

  .header-top {
    flex: 0 0 auto;
    gap: 8px;
  }

  .logo {
    width: 48px;
    height: 48px;
  }

  .brand-title {
    font-size: 25px;
  }

  .brand-subtitle {
    font-size: 9px;
  }

  .navigation {
    width: 100%;
    flex: 0 0 auto;
    gap: 5px;
  }

  .navigation a {
    height: 42px;
    padding: 5px 3px;
    font-size: 10px;
  }

  main {
    height: calc(100dvh - 150px);
    padding: 8px 10px;
  }

  .page-title {
    font-size: 18px;
  }

  .page-subtitle {
    margin-bottom: 6px;
    font-size: 8px;
  }

  .status-line {
    flex-wrap: wrap;
    font-size: 9px;
    padding: 7px 9px;
    margin-bottom: 5px;
    gap: 6px;
  }

  .status-line strong {
    font-size: 9px;
  }

  .legend {
    gap: 6px 9px;
    margin: 5px 0 7px;
    font-size: 9px;
  }

  .legend i {
    width: 8px;
    height: 8px;
  }

  #mapArea {
    flex: 1 1 0;
    min-height: 0;
  }

  #playerPanel {
    width: min(220px, calc(100% - 24px));
    max-height: 55%;
  }

  .map-compass {
    top: auto;
    bottom: 10px;
    font-size: 8px;
    gap: 6px;
    padding: 5px 8px;
  }

  .map-compass strong {
    font-size: 9px;
  }

  #detailContent {
    padding: 22px 17px;
  }

  #detailContent h3 {
    font-size: 19px;
  }

  #detailContent p {
    font-size: 13px;
  }

  .detail-train-heading {
    gap: 9px;
  }

  #detailContent .detail-type {
    font-size: 13px;
  }

  .detail-destination {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-top">
    <img class="logo" src="./icon.png" alt="波急電鉄ロゴ">
    <div class="brand-text">
      <h1 class="brand-title">波急サーバー</h1>
      <div class="brand-subtitle">NAMIKYU RAILWAY</div>
    </div>
  </div>

  <nav class="navigation">
    <a href="./index.html">ホーム</a>
    <a href="./news.html">お知らせ</a>
    <a href="./join.html">サーバー参加</a>
    <a href="./status.html" class="active">在線位置</a>
    <a href="./staff.html">運営メンバー</a>
  </nav>
</header>

<main>
  <h2 class="page-title">リアルタイム在線位置</h2>
  <p class="page-subtitle">REALTIME TRAIN &amp; PLAYER MAP</p>

  <div class="status-line">
    <span id="statusDot" class="status-dot"></span>
    <strong id="serverState">接続確認中...</strong>
    <span id="lastUpdate">データ取得待機中</span>
    <span style="margin-left:auto">
      プレイヤー <b id="playerCount">0</b> 人 /
      列車 <b id="trainCount">0</b> 編成
    </span>
  </div>

  <div class="legend">
    <span><i style="background:#2878c8"></i>各駅停車</span>
    <span><i style="background:#16a34a"></i>準急</span>
    <span><i style="background:#dc2626"></i>急行</span>
    <span><i style="background:#f97316"></i>特急</span>
    <span><i style="background:#60a5fa"></i>各駅停車（川鉄線）</span>
    <span><i style="background:#888"></i>普通</span>
    <span><i style="background:#000"></i>不明</span>
  </div>

  <section id="mapArea">
    <svg
      id="map"
      xmlns="http://www.w3.org/2000/svg"
      preserveAspectRatio="none"
      aria-label="在線マップ"
    >
      <g id="grid"></g>
      <g id="markers"></g>
    </svg>

    <div class="map-compass">
      <span>上 <strong>Z−</strong></span>
      <span>下 <strong>Z＋</strong></span>
      <span>右 <strong>X＋</strong></span>
      <span>左 <strong>X−</strong></span>
    </div>

    <aside id="playerPanel">
      <div class="panel-head">
        <span>在線プレイヤー (<span id="panelCount">0</span>)</span>
        <button id="togglePlayers">閉じる −</button>
      </div>

      <div id="playerList">
        <p style="font-size:10px;color:#7890a5">
          プレイヤー情報を取得中...
        </p>
      </div>
    </aside>

    <div class="map-controls">
      <button id="zoomIn" title="拡大" aria-label="拡大">＋</button>
      <button id="zoomOut" title="縮小" aria-label="縮小">－</button>
      <button id="resetView" title="全体表示" aria-label="全体表示">⌂</button>
    </div>
  </section>
</main>

<div id="detailBackdrop" role="dialog" aria-modal="true" aria-label="列車・プレイヤー詳細">
  <div id="detailCard">
    <div id="detailAccent"></div>
    <button id="detailClose" aria-label="閉じる">×</button>
    <div id="detailContent"></div>
  </div>
</div>

<script>
"use strict";

/* =====================================
   API設定
===================================== */

const API_URL = "https://namikyu-status.kou20230831.workers.dev/api/status";
const REFRESH_MS = 2500;

/* マップ設定 */
const GRID_SIZE = 500;

/* ズーム制限 */
const MIN_VIEW_WIDTH = 500;
const MAX_VIEW_WIDTH = 50000;

/* マーカーの画面上の大きさ */
const PLAYER_FACE_PIXELS = 20;
const PLAYER_NAME_PIXELS = 10;
const TRAIN_SQUARE_PIXELS = 34;
const TRAIN_ARROW_PIXELS = 9;
const TRAIN_TEXT_PIXELS = 15;

/* 状態 */
let staffRoles = {};
let latestData = null;
let initializedView = false;
let selectedTrainIndex = null;
let playerPanelHidden = false;

let view = {
  x: -5000,
  y: -5000,
  w: 10000,
  h: 10000
};

let drag = null;

/* HTML要素 */
const map = document.getElementById("map");
const grid = document.getElementById("grid");
const markers = document.getElementById("markers");
const mapArea = document.getElementById("mapArea");

/* =====================================
   共通処理
===================================== */

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

function toNumber(value, fallback = 0) {
  if (
    value === null ||
    value === undefined ||
    String(value).trim() === ""
  ) {
    return fallback;
  }

  const number = Number(value);
  return Number.isFinite(number) ? number : fallback;
}

/* =====================================
   運営メンバー情報
===================================== */

async function loadStaff() {
  try {
    const response = await fetch("./staff.html", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("staff.htmlを取得できません");
    }

    const doc = new DOMParser().parseFromString(
      await response.text(),
      "text/html"
    );

    doc.querySelectorAll(".staff-card").forEach(card => {
      const name = card.querySelector(".staff-name")?.textContent.trim();
      const role = card.querySelector(".role-badge")?.textContent.trim();

      if (name && role) {
        staffRoles[name.toLowerCase()] = role;
      }
    });

  } catch (error) {
    console.warn("運営一覧の読み込みに失敗:", error);
  }
}

function getRole(name) {
  return staffRoles[String(name).toLowerCase()] || "参加者";
}

function roleClass(role) {
  if (role === "オーナー") return "role-owner";
  if (role === "デベロッパー") return "role-developer";
  if (role === "モデレーター") return "role-moderator";
  if (role === "休職中") return "role-leave";
  return "";
}

function faceURL(name) {
  return "https://mc-heads.net/avatar/" +
    encodeURIComponent(name) + "/64";
}

/* =====================================
   列車種別
===================================== */

function getTrainType(train) {
  const tags = Array.isArray(train.tags) ? train.tags : [];
  const z = toNumber(train.z);

  if (tags.includes("ltd")) {
    return {
      name: "特急",
      color: "#f97316",
      initial: "特",
      alias: "特急シティ"
    };
  }

  if (tags.includes("exp")) {
    return {
      name: "急行",
      color: "#dc2626",
      initial: "急"
    };
  }

  if (tags.includes("sexp")) {
    /*
      準急が確定に変化した場合は、
      マップ上の種別だけ各駅停車として表示する。
      行先判定では元のsexpタグを使用する。
    */
    if (z < -18 || z > 6131) {
      return {
        name: "各駅停車",
        color: "#2878c8",
        initial: "各",
        downgradedFromSemiExpress: true
      };
    }

    return {
      name: "準急",
      color: "#16a34a",
      initial: "準"
    };
  }

  if (tags.includes("local2")) {
    return {
      name: "各駅停車",
      color: "#60a5fa",
      initial: "各",
      alias: "川鉄線"
    };
  }

  if (tags.includes("local")) {
    return {
      name: "各駅停車",
      color: "#2878c8",
      initial: "各"
    };
  }

  /* 水山線の普通列車判定 */
  const x = toNumber(train.x);
  const inMizuyama =
    x >= -608 &&
    x <= 692 &&
    z >= 3957 &&
    z <= 5257;

  if (inMizuyama) {
    return {
      name: "普通",
      color: "#888888",
      initial: "普",
      alias: "水山線"
    };
  }

  return {
    name: "不明",
    color: "#000000",
    initial: "不"
  };
}

/* =====================================
   列車の進行方向
===================================== */

/*
  マップの方角とSVG回転角度：

  上    = Z− = -90度
  下    = Z＋ =  90度
  右    = X＋ =   0度
  左    = X− = 180度

  画面Y座標は -Z で描画している。

  マーカー本体の矢印をこの角度で回転させる。
  文字は逆回転させて常に正立させる。
*/

function getDirection(tags) {
  if (tags.includes("z-")) return -90;
  if (tags.includes("z")) return 90;
  if (tags.includes("x")) return 0;
  if (tags.includes("x-")) return 180;

  return 0;
}

/* =====================================
   列車の行先
===================================== */

function getTrainDestination(train, type) {
  const tags = Array.isArray(train.tags) ? train.tags : [];

  if (type.alias === "水山線") {
    return "草市～水山 往復";
  }

  const towardPositiveZ =
    tags.includes("z") ||
    (
      !tags.includes("z-") &&
      tags.includes("x")
    );

  const towardNegativeZ =
    tags.includes("z-") ||
    (
      !tags.includes("z") &&
      tags.includes("x-")
    );

  if (!towardPositiveZ && !towardNegativeZ) {
    return "行先不明";
  }

  /*
    川鉄線の各駅停車：
    X/Zのプラス方向は依丘、
    マイナス方向は草市。
  */
  if (type.alias === "川鉄線") {
    return towardPositiveZ ? "依丘" : "草市";
  }

  /*
    準急から各停に変化した列車は、
    表示種別が各停でも準急の行先を維持する。
  */
  if (
    tags.includes("sexp") &&
    type.downgradedFromSemiExpress
  ) {
    return towardPositiveZ ? "雨山" : "矢野";
  }

  if (type.name === "各駅停車") {
    return towardPositiveZ ? "波丘" : "吉山";
  }

  if (type.name === "急行") {
    return towardPositiveZ ? "依丘" : "吉山";
  }

  if (type.name === "特急") {
    return towardPositiveZ ? "雨山" : "吉山";
  }

  if (type.name === "準急") {
    return towardPositiveZ ? "雨山" : "矢野";
  }

  return "行先不明";
}

/* =====================================
   マップ座標・表示範囲
===================================== */

function getMapSize() {
  const rect = map.getBoundingClientRect();

  return {
    width: Math.max(1, rect.width),
    height: Math.max(1, rect.height),
    aspect: Math.max(
      0.01,
      rect.width / Math.max(1, rect.height)
    )
  };
}

function screenScale() {
  const size = getMapSize();
  return view.w / size.width;
}

function visibleBounds() {
  return {
    x: view.x,
    y: view.y,
    w: view.w,
    h: view.h
  };
}

/* =====================================
   グリッド描画
===================================== */

function renderGrid() {
  const bounds = visibleBounds();
  const step = GRID_SIZE;

  const left = Math.floor(bounds.x / step) * step;
  const right = Math.ceil((bounds.x + bounds.w) / step) * step;
  const top = Math.floor(bounds.y / step) * step;
  const bottom = Math.ceil((bounds.y + bounds.h) / step) * step;

  let output = "";

  for (let x = left; x <= right; x += step) {
    output += `
      <line
        class="grid-line"
        x1="${x}"
        y1="${top}"
        x2="${x}"
        y2="${bottom}"
      />
    `;
  }

  for (let y = top; y <= bottom; y += step) {
    output += `
      <line
        class="grid-line"
        x1="${left}"
        y1="${y}"
        x2="${right}"
        y2="${y}"
      />
    `;
  }

  grid.innerHTML = output;
}

/* =====================================
   初期表示位置
===================================== */

function fitViewToData(data) {
  const all = [
    ...(data.players || []),
    ...(data.trains || [])
  ];

  const size = getMapSize();

  if (all.length === 0) {
    view.w = 10000;
    view.h = view.w / size.aspect;
    view.x = -view.w / 2;
    view.y = -view.h / 2;
    return;
  }

  const xs = all.map(p => toNumber(p.x));

  /*
    Zマイナスは画面上、
    Zプラスは画面下。
  */
  const ys = all.map(p => -toNumber(p.z));

  let minX = Math.min(...xs);
  let maxX = Math.max(...xs);
  let minY = Math.min(...ys);
  let maxY = Math.max(...ys);

  const padding = Math.max(
    1000,
    Math.max(maxX - minX, maxY - minY) * 0.12
  );

  minX -= padding;
  maxX += padding;
  minY -= padding;
  maxY += padding;

  const aspect = size.aspect;

  let width = Math.max(2000, maxX - minX);
  let height = Math.max(2000, maxY - minY);

  if (width / height < aspect) {
    width = height * aspect;
  } else {
    height = width / aspect;
  }

  view = {
    x: (minX + maxX - width) / 2,
    y: (minY + maxY - height) / 2,
    w: width,
    h: height
  };
}

/* =====================================
   マーカー描画
===================================== */

/*
  描画順：
  1. 列車
  2. プレイヤー

  SVGは後から描画した要素が前面になるため、
  プレイヤーが列車と重なった場合はプレイヤーを優先する。

  プレイヤーの顔の下にゲーマータグを表示する。
*/

function renderMarkers(data) {
  const unit = screenScale();

  const faceSize = PLAYER_FACE_PIXELS * unit;
  const playerTextSize = PLAYER_NAME_PIXELS * unit;

  const squareSize = TRAIN_SQUARE_PIXELS * unit;
  const arrowSize = TRAIN_ARROW_PIXELS * unit;
  const textSize = TRAIN_TEXT_PIXELS * unit;

  const half = squareSize / 2;

  let output = "";

  /* =====================================
     1. 列車
  ===================================== */

  (data.trains || []).forEach((train, index) => {
    const x = toNumber(train.x);

    /* Z＋を画面下にする */
    const y = -toNumber(train.z);

    const type = getTrainType(train);

    const direction = getDirection(
      Array.isArray(train.tags) ? train.tags : []
    );

    const label = type.initial || "不";

    /*
      右向きの矢印を基準に作成。
      directionの角度に合わせて回転させる。
    */
    const markerPath = `
      M ${-half + 4 * unit} ${-half}
      H ${half - 7 * unit}
      Q ${half} ${-half} ${half} ${-half + 7 * unit}
      L ${half + arrowSize} 0
      L ${half} ${half - 7 * unit}
      Q ${half} ${half} ${half - 7 * unit} ${half}
      H ${-half + 4 * unit}
      Q ${-half} ${half} ${-half} ${half - 4 * unit}
      V ${-half + 4 * unit}
      Q ${-half} ${-half} ${-half + 4 * unit} ${-half}
      Z
    `;

    const destination = getTrainDestination(train, type);

    output += `
      <g
        class="train-marker"
        data-train="${index}"
        tabindex="0"
        role="button"
        aria-label="${escapeHTML(type.name)} ${escapeHTML(destination)}"
        transform="translate(${x} ${y}) rotate(${direction})"
      >
        <title>${escapeHTML(type.name)}・${escapeHTML(destination)}</title>

        <path
          d="${markerPath}"
          fill="${type.color}"
          stroke="rgba(255,255,255,.95)"
          stroke-width="${1.5 * unit}"
          stroke-linejoin="round"
        />

        <!-- 文字は逆回転させて正立 -->
        <g transform="rotate(${-direction})">
          <text
            class="train-label"
            x="0"
            y="0"
            font-size="${textSize}"
          >${escapeHTML(label)}</text>
        </g>
      </g>
    `;
  });

  /* =====================================
     2. プレイヤー
     列車より後に描画して前面に表示
  ===================================== */

  (data.players || []).forEach(player => {
    const x = toNumber(player.x);

    /* Z＋を画面下にする */
    const y = -toNumber(player.z);

    const name = String(player.name || "不明");

    const imageY = y - faceSize / 2;
    const labelY = y + faceSize / 2 + 8 * unit;

    output += `
      <g
        class="player-marker"
        data-player="${escapeHTML(name)}"
        tabindex="0"
        role="button"
        aria-label="プレイヤー ${escapeHTML(name)}"
      >
        <title>${escapeHTML(name)}</title>

        <!-- 顔アイコン -->
        <image
          href="${faceURL(name)}"
          x="${x - faceSize / 2}"
          y="${imageY}"
          width="${faceSize}"
          height="${faceSize}"
          preserveAspectRatio="xMidYMid slice"
          class="player-face"
        />

        <!-- ゲーマータグ -->
        <text
          class="player-name-label"
          x="${x}"
          y="${labelY}"
          font-size="${playerTextSize}"
        >${escapeHTML(name)}</text>
      </g>
    `;
  });

  markers.innerHTML = output;

  /* =====================================
     列車クリック・キーボード操作
  ===================================== */

  markers.querySelectorAll(".train-marker").forEach(element => {
    const open = event => {
      event.stopPropagation();

      const index = Number(element.dataset.train);
      const train = data.trains[index];

      if (train) {
        showTrainDetail(train, index);
      }
    };

    element.addEventListener("click", open);

    element.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        open(event);
      }
    });
  });

  /* =====================================
     プレイヤークリック・キーボード操作
  ===================================== */

  markers.querySelectorAll(".player-marker").forEach(element => {
    const open = event => {
      event.stopPropagation();

      const name = element.dataset.player;

      const player = (data.players || []).find(
        value => value.name === name
      );

      if (player) {
        showPlayerDetail(player);
      }
    };

    element.addEventListener("click", open);

    element.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        open(event);
      }
    });
  });
}

/* =====================================
   マップ表示更新
===================================== */

function applyView() {
  const size = getMapSize();

  const centerX = view.x + view.w / 2;
  const centerY = view.y + view.h / 2;

  view.h = view.w / size.aspect;

  view.x = centerX - view.w / 2;
  view.y = centerY - view.h / 2;

  map.setAttribute(
    "viewBox",
    `${view.x} ${view.y} ${view.w} ${view.h}`
  );

  renderGrid();

  if (latestData) {
    renderMarkers(latestData);
  }
}

function renderMap(data) {
  if (!initializedView) {
    fitViewToData(data);
    initializedView = true;
  }

  applyView();
}

/* =====================================
   速度表示
===================================== */

function getDisplaySpeed(train) {
  const rawScore = train.sokudo;

  /* sokudo 59 は120 km/hとして表示 */
  if (
    rawScore !== null &&
    rawScore !== undefined &&
    String(rawScore).trim() !== "" &&
    Number(rawScore) === 59
  ) {
    return 120;
  }

  const rawSpeed = train.speed;

  if (
    rawSpeed === null ||
    rawSpeed === undefined ||
    String(rawSpeed).trim() === "" ||
    String(rawSpeed).trim() === "-"
  ) {
    return 0;
  }

  const speed = Number(rawSpeed);

  if (!Number.isFinite(speed) || speed < 0) {
    return 0;
  }

  return speed;
}

   列車詳細
===================================== */

  const destination = getTrainDestination(train, type);

  const displayType =
    type.name === "特急"

      : type.name;

  openDetail(`

      <span

          color:#ffffff;
          background:${type.color};

        Y ${escapeHTML(train.y)}

}

/* =====================================
   サーバー状態取得
===================================== */

async function updateStatus() {
  try {
    const response = await fetch(API_URL, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("API error " + response.status);
    }

    const result = await response.json();

    if (!result.online || !result.data) {
      setOffline("サーバーオフライン");
      return;
    }

    latestData = result.data;

    const players = result.data.players || [];
    const trains = result.data.trains || [];

    document.getElementById("statusDot").className =
      "status-dot online";

    document.getElementById("serverState").textContent =
      "サーバーオンライン";

    const updatedAt = result.updated_at
      ? new Date(result.updated_at)
      : new Date();

    document.getElementById("lastUpdate").textContent =
      "最終更新：" +
      updatedAt.toLocaleTimeString("ja-JP");

    document.getElementById("trainCount").textContent =
      trains.length;

    renderPlayerList(players);

    /* マップ更新 */
    renderMap(result.data);

    /* 選択中の列車詳細も最新データに更新 */
    if (selectedTrainIndex !== null) {
      const selectedTrain = trains[selectedTrainIndex];

      if (selectedTrain) {
        showTrainDetail(selectedTrain);
      } else {
        closeDetail();
      }
    }

  } catch (error) {
    console.error(error);
    setOffline("データ取得エラー");
  }
}

}

/* =====================================
   ズーム
===================================== */

function zoomAt(factor, clientX, clientY) {
  const rect = map.getBoundingClientRect();

  if (rect.width <= 0 || rect.height <= 0) {
    return;
  }

  const px = (clientX - rect.left) / rect.width;
  const py = (clientY - rect.top) / rect.height;

  const worldX = view.x + px * view.w;
  const worldY = view.y + py * view.h;

  const newWidth = Math.min(
    MAX_VIEW_WIDTH,
    Math.max(MIN_VIEW_WIDTH, view.w * factor)
  );

  const size = getMapSize();
  const newHeight = newWidth / size.aspect;

  view.x = worldX - px * newWidth;
  view.y = worldY - py * newHeight;
  view.w = newWidth;
  view.h = newHeight;

  applyView();
}

/* 拡大 */
document.getElementById("zoomIn").addEventListener(
  "click",
  () => {
    const rect = map.getBoundingClientRect();

    zoomAt(
      0.75,
      rect.left + rect.width / 2,
      rect.top + rect.height / 2
    );
  }
);

/* 縮小 */
document.getElementById("zoomOut").addEventListener(
  "click",
  () => {
    const rect = map.getBoundingClientRect();

    zoomAt(
      1.33,
      rect.left + rect.width / 2,
      rect.top + rect.height / 2
    );
  }
);

/* 全体表示 */
document.getElementById("resetView").addEventListener(
  "click",

    if (latestData) {
      fitViewToData(latestData);
      initializedView = true;
      applyView();
    }
  }
);

/* =====================================
   マップのドラッグ
===================================== */

map.addEventListener("pointerdown", event => {
  if (event.target.closest(".train-marker, .player-marker")) {
    return;
  }

  drag = {
    x: event.clientX,
    y: event.clientY,
    viewX: view.x,
    viewY: view.y
  };

  map.classList.add("dragging");
  map.setPointerCapture(event.pointerId);
});

map.addEventListener("pointermove", event => {
  if (!drag) return;

  const rect = map.getBoundingClientRect();

  view.x =
    drag.viewX -
    (event.clientX - drag.x) / rect.width * view.w;

  view.y =
    drag.viewY -
    (event.clientY - drag.y) / rect.height * view.h;

  applyView();
});

function endDrag() {
  drag = null;
  map.classList.remove("dragging");
}

map.addEventListener("pointerup", endDrag);
map.addEventListener("pointercancel", endDrag);
map.addEventListener("lostpointercapture", endDrag);

/* =====================================
   マウスホイールズーム
===================================== */

map.addEventListener("wheel", event => {
  event.preventDefault();

  const factor = event.deltaY < 0 ? 0.9 : 1.1;

  zoomAt(
    factor,
    event.clientX,
    event.clientY
  );
}, {
  passive: false
});

/* =====================================
   キーボードによるマップ操作
===================================== */

document.addEventListener("keydown", event => {
  const tag = document.activeElement?.tagName;

  if (
    tag === "INPUT" ||
    tag === "TEXTAREA" ||
    tag === "BUTTON"
  ) {
    return;
  }

  const size = getMapSize();
  const moveAmount = view.w * 0.08;

  switch (event.key) {
    case "+":
    case "=":
      zoomAt(
        0.8,
        size.width / 2 + map.getBoundingClientRect().left,
        size.height / 2 + map.getBoundingClientRect().top
      );
      break;

    case "-":
      zoomAt(
        1.25,
        size.width / 2 + map.getBoundingClientRect().left,
        size.height / 2 + map.getBoundingClientRect().top
      );
      break;

    case "ArrowUp":
      event.preventDefault();
      view.y -= moveAmount / size.aspect;
      applyView();
      break;

    case "ArrowDown":
      event.preventDefault();
      view.y += moveAmount / size.aspect;
      applyView();
      break;

    case "ArrowLeft":
      event.preventDefault();
      view.x -= moveAmount;
      applyView();
      break;

    case "ArrowRight":
      event.preventDefault();
      view.x += moveAmount;
      applyView();
      break;
  }
});

/* =====================================
   画面サイズ変更
===================================== */

window.addEventListener("resize", () => {
  if (!latestData) return;

  applyView();
});

/* =====================================
   起動
===================================== */

(async function start() {
  await loadStaff();
  await updateStatus();

  setInterval(updateStatus, REFRESH_MS);
})();

</script>
