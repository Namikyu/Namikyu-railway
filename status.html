
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#087fc4">
<title>在線位置 | 波急サーバー</title>
<link rel="icon" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">

<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:"Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;color:#24364b;background:#eef2f7}
button{font:inherit}

/* ヘッダー */
.header{height:120px;min-height:120px;padding:8px 3%;display:flex;align-items:center;justify-content:space-between;gap:18px;background:linear-gradient(110deg,#075d9b 0%,#087fc4 55%,#129bd2 100%);overflow:hidden}
.header-top{display:flex;align-items:center;gap:14px;flex:0 1 42%;min-width:0}
.logo{width:80px;height:80px;object-fit:contain;flex-shrink:0}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-title{margin:0;color:white;font-size:clamp(30px,3.5vw,44px);font-weight:800;letter-spacing:.06em;line-height:1.15;white-space:nowrap}
.brand-subtitle{margin-top:5px;color:white;font-size:13px;font-weight:600;letter-spacing:.2em;white-space:nowrap}
.navigation{display:flex;justify-content:center;align-items:center;flex:1 1 58%;min-width:0;gap:9px}
.navigation a{display:flex;justify-content:center;align-items:center;flex:1 1 0;min-width:0;height:52px;padding:8px 7px;color:white;text-decoration:none;font-size:clamp(11px,1.1vw,15px);font-weight:700;white-space:nowrap;border:1px solid rgba(255,255,255,.45);border-radius:7px;background:rgba(255,255,255,.12);transition:background .2s}
.navigation a:hover,.navigation a.active{background:rgba(255,255,255,.28)}

/* メイン */
main{height:calc(100dvh - 120px);min-height:0;padding:13px 18px 16px;display:flex;flex-direction:column;overflow:hidden}
.page-title{flex-shrink:0;margin:0 0 2px;color:#142b49;font-size:21px;font-weight:800}
.page-subtitle{flex-shrink:0;margin:0 0 10px;color:#8295a8;font-size:9px;letter-spacing:2px;font-weight:800}
.status-line{flex-shrink:0;display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-bottom:8px;padding:10px 13px;background:#fff;border:1px solid #e1e9f1;border-radius:9px;box-shadow:0 2px 8px rgba(20,43,73,.045);font-size:11px;color:#61768b}
.status-line strong{color:#263e58;font-size:11px;font-weight:800}
.status-dot{width:8px;height:8px;border-radius:50%;background:#999;flex-shrink:0}
.status-dot.online{background:#20a464;box-shadow:0 0 0 3px #20a46420}
.status-dot.offline{background:#d33;box-shadow:0 0 0 3px #d3323220}
.legend{flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 15px;margin:5px 0 9px;font-size:10px;font-weight:600;color:#536b82}
.legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* マップ */
#mapArea{position:relative;width:100%;flex:1 1 0;min-height:0;overflow:hidden;border:1px solid #dce5ed;border-radius:10px;background:linear-gradient(rgba(255,255,255,.65),rgba(255,255,255,.65)),#f3f7fb;box-shadow:0 3px 14px rgba(20,43,73,.065)}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none;overflow:hidden;user-select:none}
#map.dragging{cursor:grabbing}
.grid-line{stroke:#dce5ed;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.marker-layer{pointer-events:auto}
.player-marker,.train-marker{cursor:pointer;pointer-events:auto;outline:none}
.player-marker:focus-visible,.train-marker:focus-visible{opacity:.8}
.player-face{image-rendering:pixelated;pointer-events:none}
.player-hit-area{fill:transparent;stroke:transparent;pointer-events:all}
.train-label{font-family:"Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;font-weight:900;text-anchor:middle;dominant-baseline:central;fill:#fff;stroke:rgba(0,0,0,.18);stroke-width:2px;paint-order:stroke fill;pointer-events:none;user-select:none}
.player-name-label{font-family:"Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#263e58;stroke:#fff;stroke-width:3px;paint-order:stroke fill;pointer-events:none;user-select:none}
.train-marker:hover .train-body{filter:brightness(1.12)}
.player-marker:hover image{filter:brightness(1.12)}

/* 方角 */
.map-compass{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:3;display:grid;grid-template-columns:30px 30px 30px;grid-template-rows:22px 22px 22px;align-items:center;justify-items:center;pointer-events:none;color:#60778e;font-size:10px;font-weight:800;text-shadow:0 1px 2px white}
.compass-top{grid-column:2;grid-row:1}
.compass-left{grid-column:1;grid-row:2}
.compass-center{grid-column:2;grid-row:2;color:#9aabba}
.compass-right{grid-column:3;grid-row:2}
.compass-bottom{grid-column:2;grid-row:3}

/* 操作ボタン */
.map-controls{position:absolute;right:13px;top:13px;z-index:4;display:flex;flex-direction:column;gap:6px}
.map-controls button{width:36px;height:36px;border:1px solid #d8e2ec;border-radius:8px;background:rgba(255,255,255,.95);color:#284967;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 2px 6px rgba(20,43,73,.08)}
.map-controls button:hover{background:#eaf5fc}
.map-controls button:active{transform:scale(.96)}
.map-help{position:absolute;right:13px;bottom:10px;z-index:2;padding:5px 8px;border-radius:5px;background:rgba(255,255,255,.8);color:#8093a5;font-size:9px;pointer-events:none}

/* プレイヤー一覧 */
.player-panel{position:absolute;left:12px;top:12px;z-index:4;width:205px;max-height:calc(100% - 24px);display:flex;flex-direction:column;background:rgba(255,255,255,.94);border:1px solid #dce5ed;border-radius:9px;box-shadow:0 3px 12px rgba(20,43,73,.09);overflow:hidden;transition:width .18s}
.player-panel.collapsed{width:112px}
.player-panel-head{height:38px;min-height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid #e8eef4;color:#29445f;font-size:11px;font-weight:800}
.player-panel-head button{border:0;background:transparent;color:#55718b;cursor:pointer;font-size:14px}
.player-list{padding:5px 7px;overflow:auto;min-height:0}
.player-row{display:flex;align-items:center;gap:7px;width:100%;padding:5px 3px;border:0;border-radius:5px;background:transparent;text-align:left;color:#334d67;font-size:10px;cursor:pointer}
.player-row:hover{background:#edf6fc}
.player-row img{width:23px;height:23px;image-rendering:pixelated;border-radius:4px}
.player-row-info{min-width:0;display:flex;flex-direction:column}
.player-row-name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-row-role{font-size:9px;color:#8799aa}
.player-panel.collapsed .player-list{display:none}

/* モーダル */
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(13,31,50,.48);backdrop-filter:blur(3px)}
.modal.open{display:flex}
.modal-card{width:min(420px,100%);max-height:85vh;overflow:auto;padding:20px;background:white;border:1px solid #dce5ed;border-radius:13px;box-shadow:0 15px 50px rgba(0,0,0,.2)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
.modal-title{margin:0;color:#142b49;font-size:17px;font-weight:900}
.modal-close{width:30px;height:30px;border:0;border-radius:7px;background:#edf2f6;color:#49647e;font-size:18px;cursor:pointer}
.detail-player{display:flex;align-items:center;gap:13px;margin-bottom:15px}
.detail-player img{width:56px;height:56px;border-radius:8px;image-rendering:pixelated}
.detail-player-name{font-size:17px;font-weight:900;color:#203c58}
.detail-player-role{margin-top:3px;color:#8193a5;font-size:11px}
.train-summary{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 17px;padding:17px 10px;border:2px solid #2878c8;border-radius:9px}
.train-type{font-size:19px;font-weight:900;color:white;background:#2878c8;border-radius:6px;padding:7px 13px;white-space:nowrap}
.train-destination{font-size:17px;font-weight:900;color:#263f58;text-align:center}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail-item{padding:10px;border:1px solid #e4ebf1;border-radius:7px;background:#f8fafc}
.detail-label{font-size:9px;color:#899aab;font-weight:700}
.detail-value{margin-top:4px;font-size:13px;color:#29445f;font-weight:800;overflow-wrap:anywhere}
.detail-note{margin-top:12px;font-size:10px;color:#8a9aaa}

/* スマートフォン */
@media(max-width:760px){
 .header{height:92px;min-height:92px;padding:7px 10px;gap:8px}
 .header-top{gap:7px;flex:0 1 auto}
 .logo{width:48px;height:48px}
 .brand-title{font-size:clamp(19px,5vw,28px)}
 .brand-subtitle{font-size:8px;letter-spacing:.1em}
 .navigation{gap:4px}
 .navigation a{height:39px;padding:4px 3px;font-size:9px;border-radius:5px}
 main{height:calc(100dvh - 92px);padding:9px 9px 10px}
 .page-title{font-size:17px}
 .page-subtitle{font-size:8px;margin-bottom:7px}
 .status-line{padding:8px;margin-bottom:5px;gap:6px;font-size:9px}
 .legend{gap:6px 9px;font-size:9px;margin:4px 0 7px}
 .player-panel{width:145px;left:7px;top:7px;max-height:48%}
 .player-panel.collapsed{width:105px}
 .map-controls{right:7px;top:7px}
 .map-controls button{width:32px;height:32px}
 .map-help{right:7px;bottom:6px;font-size:8px}
 .map-compass{top:48px}
}
@media(max-width:430px){
 .header{height:84px;min-height:84px}
 .logo{width:39px;height:39px}
 .brand-title{font-size:18px}
 .brand-subtitle{font-size:7px}
 .navigation{gap:3px}
 .navigation a{font-size:8px;height:34px}
 main{height:calc(100dvh - 84px)}
}
</style>
</head>

<body>

<header class="header">
  <div class="header-top">
    <img class="logo" src="./icon.png" alt="波急">
    <div class="brand-text">
      <h1 class="brand-title">波急サーバー</h1>
      <div class="brand-subtitle">NAMIKYU SERVER</div>
    </div>
  </div>

  <nav class="navigation">
    <a href="./index.html">ホーム</a>
    <a href="./news.html">お知らせ</a>
    <a href="./join.html">参加方法</a>
    <a href="./status.html" class="active">在線位置</a>
    <a href="./staff.html">運営メンバー</a>
  </nav>
</header>

<main>
  <h2 class="page-title">在線位置</h2>
  <p class="page-subtitle">REAL-TIME PLAYER & TRAIN POSITION</p>

  <div class="status-line">
    <span id="connectionDot" class="status-dot"></span>
    <strong id="connectionText">サーバーに接続しています...</strong>
    <span id="lastUpdated">最終更新：--:--:--</span>
    <span id="worldTime">ワールド時刻：--</span>
    <span id="weatherText">天候：--</span>
    <span id="tpsText">TPS：--</span>
    <span id="playerCount">プレイヤー：--人</span>
    <span id="trainCount">列車：--編成</span>
  </div>

  <div class="legend">
    <span><i style="background:#f97316"></i>特急</span>
    <span><i style="background:#dc2626"></i>急行</span>
    <span><i style="background:#16a34a"></i>準急</span>
    <span><i style="background:#2878c8"></i>各駅停車</span>
    <span><i style="background:#888"></i>水山線</span>
    <span><i style="background:#111"></i>その他</span>
    <span>顔マーク：プレイヤー</span>
  </div>

  <section id="mapArea">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="サーバー在線位置マップ">

      <g id="markerLayer" class="marker-layer"></g>
    </svg>

    <div class="map-compass">
      <span class="compass-top">Z−</span>
      <span class="compass-left">X−</span>
      <span class="compass-center">＋</span>
      <span class="compass-right">X＋</span>
      <span class="compass-bottom">Z＋</span>
    </div>

    <div class="player-panel" id="playerPanel">
      <div class="player-panel-head">
        <span>オンライン</span>
        <button id="collapsePlayers" type="button" aria-label="一覧を折りたたむ">−</button>
      </div>
      <div class="player-list" id="playerList"></div>
    </div>

    <div class="map-controls">
      <button id="zoomIn" type="button" title="拡大">＋</button>
      <button id="zoomOut" type="button" title="縮小">−</button>
      <button id="resetView" type="button" title="全体表示">⌂</button>
    </div>

    <div class="map-help">ドラッグ：移動 / ホイール：拡大・縮小 / 矢印キー：移動</div>
  </section>
</main>

<div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <div class="modal-head">
      <h3 class="modal-title" id="modalTitle">詳細情報</h3>
      <button class="modal-close" id="closeModal" type="button" aria-label="閉じる">×</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<script>
"use strict";

/* =========================================
   基本設定
========================================= */

const API_URL = "https://namikyu-status.kou20230831.workers.dev/api/status";
const REFRESH_MS = 1000;

const MIN_VIEW_WIDTH = 0.001;
const MAX_VIEW_WIDTH = 1000000000;

const GRID_TARGET_PIXELS = 90;
const GRID_MAX_LINES = 120;

const map = document.getElementById("map");
const mapArea = document.getElementById("mapArea");
const gridLayer = document.getElementById("gridLayer");
const markerLayer = document.getElementById("markerLayer");

const connectionDot = document.getElementById("connectionDot");
const connectionText = document.getElementById("connectionText");
const lastUpdated = document.getElementById("lastUpdated");
const worldTimeText = document.getElementById("worldTime");
const weatherText = document.getElementById("weatherText");
const tpsText = document.getElementById("tpsText");
const playerCountText = document.getElementById("playerCount");
const trainCountText = document.getElementById("trainCount");

const playerList = document.getElementById("playerList");
const playerPanel = document.getElementById("playerPanel");

let latestData = null;
let players = [];
let trains = [];
let staffMap = new Map();

let selectedEntity = null;
let selectedEntityKey = null;

let isFetching = false;
let fetchAgainRequested = false;
let lastSuccessfulFetch = 0;

let view = {
  x: -5000,
  y: -5000,
  w: 10000,
  h: 10000
};

let dragging = false;
let dragStart = null;
let dragMoved = false;

/* =========================================
   共通処理
========================================= */

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function toNumber(value, fallback = 0) {
  const number = Number(value);
  return Number.isFinite(number) ? number : fallback;
}

function formatNumber(value, digits = 1) {
  const number = Number(value);
  if (!Number.isFinite(number)) return "--";
  return number.toFixed(digits);
}

function getName(entity) {
  return String(
    entity?.name ??
    entity?.playerName ??
    entity?.player ??
    entity?.id ??
    "不明"
  );
}

function getCoordinates(entity) {
  const location = entity?.location ?? entity?.position ?? entity ?? {};

  return {
    x: toNumber(location.x, 0),
    z: toNumber(location.z, 0)
  };
}

function normalizeTags(entity) {
  const raw = entity?.tags ?? entity?.tag ?? [];

  if (Array.isArray(raw)) {
    return raw.map(v => String(v).toLowerCase());
  }

  if (typeof raw === "string") {
    return raw
      .split(/[,\s]+/)
      .map(v => v.trim().toLowerCase())
      .filter(Boolean);
  }

  return [];
}

function hasTag(entity, tag) {
  return normalizeTags(entity).includes(tag.toLowerCase());
}

function getMapSize() {
  const rect = map.getBoundingClientRect();
  const width = Math.max(1, rect.width);
  const height = Math.max(1, rect.height);

  return {
    width,
    height,
    aspect: width / height
  };
}

function getScale() {
  const size = getMapSize();
  return view.w / size.width;
}

/* =========================================
   種別判定
========================================= */

function getTrainType(train) {
  const tags = normalizeTags(train);
  const { x, z } = getCoordinates(train);

  if (tags.includes("ltd")) {
    return {
      key: "ltd",
      name: "特急",
      label: "特",
      color: "#f97316"
    };
  }

  if (tags.includes("exp")) {
    return {
      key: "exp",
      name: "急行",
      label: "急",
      color: "#dc2626"
    };
  }

  if (tags.includes("sexp")) {
    if (z < -18 || z > 6131) {
      return {
        key: "sexp-local",
        name: "各駅停車",
        label: "各",
        color: "#2878c8",
        downgradedFromSemiExpress: true
      };
    }

    return {
      key: "sexp",
      name: "準急",
      label: "準",
      color: "#16a34a"
    };
  }

  if (tags.includes("local2")) {
    return {
      key: "local2",
      name: "各駅停車",
      label: "各",
      color: "#60a5fa",
      alias: "川鉄線"
    };
  }

  if (tags.includes("local")) {
    return {
      key: "local",
      name: "各駅停車",
      label: "各",
      color: "#2878c8"
    };
  }

  if (x >= -608 && x <= 692 && z >= 3957 && z <= 5257) {
    return {
      key: "waterline",
      name: "普通",
      label: "普",
      color: "#888888",
      alias: "水山線"
    };
  }

  return {
    key: "unknown",
    name: "その他",
    label: "不",
    color: "#222222"
  };
}

/* =========================================
   進行方向判定
========================================= */

function getTrainDirection(train) {
  const tags = normalizeTags(train);

  if (tags.includes("z-")) return "z-";
  if (tags.includes("z+")) return "z+";
  if (tags.includes("z")) return "z+";

  if (tags.includes("x-")) return "x-";
  if (tags.includes("x+")) return "x+";
  if (tags.includes("x")) return "x+";

  return "x+";
}

function getDirectionAngle(train) {
  const direction = getTrainDirection(train);

  switch (direction) {
    case "z-": return -90;
    case "z+": return 90;
    case "x-": return 180;
    case "x+": return 0;
    default: return 0;
  }
}

function isPositiveDirection(train) {
  const direction = getTrainDirection(train);
  return direction === "z+" || direction === "x+";
}

/* =========================================
   行先判定
========================================= */

function getTrainDestination(train) {
  const type = getTrainType(train);

  if (type.key === "waterline") {
    return "草市～水山 往復";
  }

  const positive = isPositiveDirection(train);

  if (type.key === "local2") {
    return positive ? "依丘" : "草市";
  }

  if (type.key === "local") {
    return positive ? "波丘" : "吉山";
  }

  if (type.key === "exp") {
    return positive ? "依丘" : "吉山";
  }

  if (type.key === "ltd") {
    return positive ? "雨山" : "吉山";
  }

  if (type.key === "sexp" || type.downgradedFromSemiExpress) {
    return positive ? "雨山" : "矢野";
  }

  return "不明";
}

/* =========================================
   速度表示
========================================= */

function getDisplaySpeed(train) {
  const sokudo = Number(train?.sokudo);

  if (sokudo === 59) {
    return 120;
  }

  const raw = train?.speed;

  if (
    raw === null ||
    raw === undefined ||
    raw === "" ||
    raw === "-" ||
    raw === "—"
  ) {
    return 0;
  }

  const speed = Number(raw);

  if (!Number.isFinite(speed) || speed < 0) {
    return 0;
  }

  return speed;
}

/* =========================================
   データ形式の吸収
========================================= */

function normalizeCollection(value) {
  if (Array.isArray(value)) return value;

  if (value && typeof value === "object") {
    return Object.entries(value).map(([key, item]) => {
      if (item && typeof item === "object") {
        return { id: item.id ?? key, ...item };
      }
      return { id: key, value: item };
    });
  }

  return [];
}

function extractDataLists(data) {
  const root = data?.data ?? data?.status ?? data ?? {};

  const playerSource =
    root.players ??
    root.player ??
    root.onlinePlayers ??
    [];

  const trainSource =
    root.trains ??
    root.train ??
    root.carts ??
    [];

  players = normalizeCollection(playerSource);
  trains = normalizeCollection(trainSource);

  return root;
}

/* =========================================
   運営メンバー情報
========================================= */

async function loadStaff() {
  try {
    const response = await fetch("./staff.html", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("スタッフ一覧を取得できません");
    }

    const html = await response.text();
    const documentData = new DOMParser().parseFromString(html, "text/html");

    const nextMap = new Map();

    documentData.querySelectorAll(".staff-card").forEach(card => {
      const nameElement = card.querySelector(".staff-name");
      if (!nameElement) return;

      const name = nameElement.textContent.trim();
      if (!name) return;

      const roleElements = card.querySelectorAll(".role-badge");
      const roles = Array.from(roleElements)
        .map(element => element.textContent.trim())
        .filter(Boolean);

      nextMap.set(name.toLowerCase(), roles.join(" / ") || "運営");
    });

    staffMap = nextMap;
  } catch (error) {
    console.warn("運営メンバー情報の取得に失敗:", error);
  }
}

function getPlayerRole(player) {
  const name = getName(player);
  return staffMap.get(name.toLowerCase()) || "";
}

/* =========================================
   マップ表示範囲
========================================= */

function fitViewToData() {
  const size = getMapSize();
  const points = [];

  players.forEach(player => {
    const p = getCoordinates(player);
    points.push({ x: p.x, y: -p.z });
  });

  trains.forEach(train => {
    const p = getCoordinates(train);
    points.push({ x: p.x, y: -p.z });
  });

  if (points.length === 0) {
    view.w = 10000;
    view.h = view.w / size.aspect;
    view.x = -view.w / 2;
    view.y = -view.h / 2;
    applyView();
    return;
  }

  const xs = points.map(p => p.x);
  const ys = points.map(p => p.y);

  const minX = Math.min(...xs);
  const maxX = Math.max(...xs);
  const minY = Math.min(...ys);
  const maxY = Math.max(...ys);

  let width = Math.max(500, maxX - minX);
  let height = Math.max(500, maxY - minY);

  const margin = 1.35;
  width *= margin;
  height *= margin;

  let targetWidth = Math.max(width, height * size.aspect);

  targetWidth = Math.max(500, targetWidth);

  view.w = targetWidth;
  view.h = targetWidth / size.aspect;
  view.x = (minX + maxX) / 2 - view.w / 2;
  view.y = (minY + maxY) / 2 - view.h / 2;

  applyView();
}

function visibleBounds() {
  return {
    x: view.x,
    y: view.y,
    w: view.w,
    h: view.h
  };
}

/* =========================================
   軽量グリッド
========================================= */

function getAdaptiveGridStep() {
  const size = getMapSize();
  const worldPerPixel = view.w / size.width;
  const target = worldPerPixel * GRID_TARGET_PIXELS;

  if (!Number.isFinite(target) || target <= 0) {
    return 500;
  }

  const exponent = Math.pow(10, Math.floor(Math.log10(target)));
  const candidates = [
    exponent,
    exponent * 2,
    exponent * 5,
    exponent * 10
  ];

  return candidates.find(step => step >= target) || exponent * 10;
}

function renderGrid() {
  const bounds = visibleBounds();
  const step = getAdaptiveGridStep();

  const left = Math.floor(bounds.x / step) * step;
  const right = Math.ceil((bounds.x + bounds.w) / step) * step;
  const top = Math.floor(bounds.y / step) * step;
  const bottom = Math.ceil((bounds.y + bounds.h) / step) * step;

  const path = [];

  let count = 0;

  for (let x = left; x <= right && count < GRID_MAX_LINES; x += step) {
    path.push(`M${x} ${top}V${bottom}`);
    count++;
  }

  count = 0;

  for (let y = top; y <= bottom && count < GRID_MAX_LINES; y += step) {
    path.push(`M${left} ${y}H${right}`);
    count++;
  }

  gridLayer.innerHTML =
    `<path class="grid-line" d="${path.join("")}" fill="none"/>`;
}

/* =========================================
   表示範囲反映
========================================= */

function applyView(renderMarkerLayer = true) {
  const size = getMapSize();

  view.h = view.w / size.aspect;

  map.setAttribute(
    "viewBox",
    `${view.x} ${view.y} ${view.w} ${view.h}`
  );

  renderGrid();

  if (renderMarkerLayer && latestData) {
    renderMarkers();
  }
}

/* =========================================
   マーカー文字列生成
========================================= */

function makeTrainMarker(train, index, scale) {
  const { x, z } = getCoordinates(train);
  const y = -z;

  const type = getTrainType(train);
  const angle = getDirectionAngle(train);

  const size = 18.4 * scale;
  const triangle = 7.6 * scale;
  const fontSize = 11.5 * scale;

  /*
    重要：
    外側のtranslateは座標移動だけ。
    内側のiconだけを進行方向に回転。
    文字は回転グループの外側に置くため、
    進行方向に関係なく常に正立する。
  */

  return `
    <g class="train-marker"
       data-kind="train"
       data-index="${index}"
       tabindex="0"
       role="button"
       aria-label="${escapeHtml(type.name)} ${escapeHtml(getTrainDestination(train))}"
       transform="translate(${x} ${y})">

      <g class="train-body" transform="rotate(${angle})">
        <rect
          x="${-size / 2}"
          y="${-size / 2}"
          width="${size}"
          height="${size}"
          rx="${2.8 * scale}"
          fill="${type.color}"
          stroke="#ffffff"
          stroke-width="${1.2 * scale}"
        />

        <path
          d="M ${size / 2 - triangle * .25} 0
             L ${size / 2 + triangle} ${-triangle}
             L ${size / 2 + triangle} ${triangle} Z"
          fill="${type.color}"
          stroke="#ffffff"
          stroke-width="${.8 * scale}"
          stroke-linejoin="round"
        />
      </g>

      <text
        class="train-label"
        x="0"
        y="0"
        font-size="${fontSize}"
        transform="none"
      >${escapeHtml(type.label)}</text>
    </g>
  `;
}

function makePlayerMarker(player, index, scale) {
  const { x, z } = getCoordinates(player);
  const y = -z;

  const name = getName(player);
  const role = getPlayerRole(player);

  const faceSize = 19.2 * scale;
  const nameSize = 10.5 * scale;

  const safeName = encodeURIComponent(name);
  const faceUrl = `https://mc-heads.net/avatar/${safeName}/64`;

  return `
    <g class="player-marker"
       data-kind="player"
       data-index="${index}"
       tabindex="0"
       role="button"
       aria-label="${escapeHtml(name)}"
       transform="translate(${x} ${y})">

      <circle
        class="player-hit-area"
        cx="0"
        cy="0"
        r="${faceSize * .9}"
      />

      <image
        class="player-face"
        href="${faceUrl}"
        x="${-faceSize / 2}"
        y="${-faceSize / 2}"
        width="${faceSize}"
        height="${faceSize}"
        preserveAspectRatio="none"
      />

      <text
        class="player-name-label"
        x="0"
        y="${faceSize * .95}"
        font-size="${nameSize}"
        transform="none"
      >${escapeHtml(name)}</text>
    </g>
  `;
}

/* =========================================
   マーカー描画
========================================= */

function renderMarkers() {
  if (!latestData) return;

  const scale = getScale();

  const trainMarkup = trains
    .map((train, index) => makeTrainMarker(train, index, scale))
    .join("");

  const playerMarkup = players
    .map((player, index) => makePlayerMarker(player, index, scale))
    .join("");

  /*
    プレイヤーを列車より後に描画して、
    重なった場合はプレイヤーを手前に表示する。
  */

  markerLayer.innerHTML = trainMarkup + playerMarkup;

  renderPlayerList();

  if (selectedEntityKey) {
    refreshSelectedModal();
  }
}

/* =========================================
   プレイヤー一覧
========================================= */

function renderPlayerList() {
  if (players.length === 0) {
    playerList.innerHTML =
      `<div style="padding:10px;color:#91a0ae;font-size:10px">プレイヤーはいません</div>`;
    return;
  }

  playerList.innerHTML = players.map((player, index) => {
    const name = getName(player);
    const role = getPlayerRole(player);
    const face = `https://mc-heads.net/avatar/${encodeURIComponent(name)}/64`;

    return `
      <button class="player-row" type="button" data-player-index="${index}">
        <img src="${face}" alt="" loading="lazy">
        <span class="player-row-info">
          <span class="player-row-name">${escapeHtml(name)}</span>
          <span class="player-row-role">${escapeHtml(role || "プレイヤー")}</span>
        </span>
      </button>
    `;
  }).join("");
}

/* =========================================
   詳細画面
========================================= */

const detailModal = document.getElementById("detailModal");
const modalContent = document.getElementById("modalContent");
const modalTitle = document.getElementById("modalTitle");

function openModal() {
  detailModal.classList.add("open");
}

function closeModal() {
  detailModal.classList.remove("open");
  selectedEntity = null;
  selectedEntityKey = null;
}

function showPlayerDetail(player) {
  const name = getName(player);
  const role = getPlayerRole(player);
  const { x, z } = getCoordinates(player);

  selectedEntity = player;
  selectedEntityKey = `player:${name}`;

  modalTitle.textContent = "プレイヤー情報";

  const face = `https://mc-heads.net/avatar/${encodeURIComponent(name)}/64`;

  modalContent.innerHTML = `
    <div class="detail-player">
      <img src="${face}" alt="">
      <div>
        <div class="detail-player-name">${escapeHtml(name)}</div>
        <div class="detail-player-role">${escapeHtml(role || "プレイヤー")}</div>
      </div>
    </div>

    <div class="detail-grid">
      <div class="detail-item">
        <div class="detail-label">X座標</div>
        <div class="detail-value">${formatNumber(x, 2)}</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Z座標</div>
        <div class="detail-value">${formatNumber(z, 2)}</div>
      </div>
    </div>
  `;

  openModal();
}

function showTrainDetail(train) {
  const type = getTrainType(train);
  const destination = getTrainDestination(train);
  const speed = getDisplaySpeed(train);
  const { x, z } = getCoordinates(train);

  selectedEntity = train;

  const trainIndex = trains.indexOf(train);
  selectedEntityKey = `train:${trainIndex}`;

  modalTitle.textContent = "列車情報";

  modalContent.innerHTML = `
    <div class="train-summary" style="border-color:${type.color}">
      <span class="train-type" style="background:${type.color}">
        ${escapeHtml(type.name)}
      </span>
      <span class="train-destination">
        ${escapeHtml(destination)}
      </span>
    </div>

    <div class="detail-grid">
      <div class="detail-item">
        <div class="detail-label">速度</div>
        <div class="detail-value">${formatNumber(speed, 0)} km/h</div>
      </div>

      <div class="detail-item">
        <div class="detail-label">X座標</div>
        <div class="detail-value">${formatNumber(x, 2)}</div>
      </div>

      <div class="detail-item">
        <div class="detail-label">Z座標</div>
        <div class="detail-value">${formatNumber(z, 2)}</div>
      </div>

      <div class="detail-item">
        <div class="detail-label">路線</div>
        <div class="detail-value">${escapeHtml(type.alias || "波急線")}</div>
      </div>
    </div>
  `;

  openModal();
}

function refreshSelectedModal() {
  if (!detailModal.classList.contains("open") || !selectedEntityKey) {
    return;
  }

  if (selectedEntityKey.startsWith("player:")) {
    const name = selectedEntityKey.slice("player:".length);
    const current = players.find(player => getName(player) === name);

    if (current) {
      showPlayerDetail(current);
    } else {
      closeModal();
    }

    return;
  }

  if (selectedEntityKey.startsWith("train:")) {
    const index = Number(selectedEntityKey.slice("train:".length));
    const current = trains[index];

    if (current) {
      showTrainDetail(current);
    } else {
      closeModal();
    }
  }
}

/* =========================================
   SVGクリック処理
========================================= */

markerLayer.addEventListener("click", event => {
  if (dragMoved) return;

  const marker = event.target.closest("[data-kind]");
  if (!marker) return;

  const index = Number(marker.dataset.index);

  if (marker.dataset.kind === "player") {
    const player = players[index];
    if (player) showPlayerDetail(player);
  }

  if (marker.dataset.kind === "train") {
    const train = trains[index];
    if (train) showTrainDetail(train);
  }
});

markerLayer.addEventListener("keydown", event => {
  if (event.key !== "Enter" && event.key !== " ") return;

  const marker = event.target.closest("[data-kind]");
  if (!marker) return;

  event.preventDefault();

  const index = Number(marker.dataset.index);

  if (marker.dataset.kind === "player" && players[index]) {
    showPlayerDetail(players[index]);
  }

  if (marker.dataset.kind === "train" && trains[index]) {
    showTrainDetail(trains[index]);
  }
});

playerList.addEventListener("click", event => {
  const button = event.target.closest("[data-player-index]");
  if (!button) return;

  const player = players[Number(button.dataset.playerIndex)];
  if (player) showPlayerDetail(player);
});

/* =========================================
   ステータス表示
========================================= */

function updateStatusDisplay(root) {
  const worldTime =
    root.worldTime ??
    root.time ??
    root.world_time ??
    "--";

  const weather =
    root.weather ??
    root.worldWeather ??
    root.world_weather ??
    "--";

  const tps =
    root.tps ??
    root.TPS ??
    "--";

  worldTimeText.textContent = `ワールド時刻：${worldTime}`;
  weatherText.textContent = `天候：${weather}`;
  tpsText.textContent = `TPS：${formatNumber(tps, 1)}`;

  playerCountText.textContent = `プレイヤー：${players.length}人`;
  trainCountText.textContent = `列車：${trains.length}編成`;

  const now = new Date();

  lastUpdated.textContent =
    `最終更新：${now.toLocaleTimeString("ja-JP", { hour12: false })}`;
}

function setOnline() {
  connectionDot.classList.remove("offline");
  connectionDot.classList.add("online");
  connectionText.textContent = "サーバー接続中";
}

function setOffline() {
  connectionDot.classList.remove("online");
  connectionDot.classList.add("offline");
  connectionText.textContent = "サーバーに接続できません";
}

/* =========================================
   APIデータ取得
========================================= */

async function fetchStatus() {
  if (isFetching) {
    fetchAgainRequested = true;
    return;
  }

  isFetching = true;

  try {
    const response = await fetch(API_URL, {
      method: "GET",
      cache: "no-store",
      headers: {
        "Accept": "application/json",
        "Cache-Control": "no-cache"
      }
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    latestData = data;

    const root = extractDataLists(data);

    updateStatusDisplay(root);
    setOnline();

    lastSuccessfulFetch = Date.now();

    /*
      初回はデータ全体が入るように表示範囲を調整。
      2回目以降はユーザーが動かしたマップ位置を維持する。
    */

    if (!map.dataset.initialized) {
      fitViewToData();
      map.dataset.initialized = "true";
    } else {
      renderMarkers();
    }

  } catch (error) {
    console.warn("在線データ取得エラー:", error);
    setOffline();
  } finally {
    isFetching = false;

    if (fetchAgainRequested) {
      fetchAgainRequested = false;
      queueMicrotask(fetchStatus);
    }
  }
}

/* =========================================
   自動更新
========================================= */

/*
  通常は1秒間隔で取得する。

  visibilitychange:
    別タブから戻ってきたときに即時更新。

  focus:
    ブラウザのウィンドウに戻ったときに即時更新。

  pageshow:
    ページ表示・復元時に即時更新。

  online:
    ネット接続が復旧したときに即時更新。

  pagehide:
    ページを離れたときの無駄な処理を抑制。
*/

let refreshTimer = null;

function scheduleRefresh() {
  if (refreshTimer !== null) {
    clearTimeout(refreshTimer);
  }

  refreshTimer = setTimeout(async () => {
    await fetchStatus();
    scheduleRefresh();
  }, REFRESH_MS);
}

function refreshImmediately() {
  if (refreshTimer !== null) {
    clearTimeout(refreshTimer);
    refreshTimer = null;
  }

  fetchStatus().finally(() => {
    scheduleRefresh();
  });
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    refreshImmediately();
  }
});

window.addEventListener("focus", refreshImmediately);
window.addEventListener("pageshow", refreshImmediately);
window.addEventListener("online", refreshImmediately);

window.addEventListener("pagehide", () => {
  if (refreshTimer !== null) {
    clearTimeout(refreshTimer);
    refreshTimer = null;
  }
});

/* =========================================
   ズーム
========================================= */

function zoomAt(factor, clientX, clientY) {
  const rect = map.getBoundingClientRect();

  if (rect.width <= 0 || rect.height <= 0) return;

  const px = (clientX - rect.left) / rect.width;
  const py = (clientY - rect.top) / rect.height;

  const worldX = view.x + px * view.w;
  const worldY = view.y + py * view.h;

  const newWidth = Math.max(
    MIN_VIEW_WIDTH,
    Math.min(MAX_VIEW_WIDTH, view.w * factor)
  );

  const size = getMapSize();
  const newHeight = newWidth / size.aspect;

  view.x = worldX - px * newWidth;
  view.y = worldY - py * newHeight;
  view.w = newWidth;
  view.h = newHeight;

  applyView(true);
}

function zoomCenter(factor) {
  const rect = map.getBoundingClientRect();

  zoomAt(
    factor,
    rect.left + rect.width / 2,
    rect.top + rect.height / 2
  );
}

document.getElementById("zoomIn").addEventListener("click", () => {
  zoomCenter(0.75);
});

document.getElementById("zoomOut").addEventListener("click", () => {
  zoomCenter(1.33);
});

document.getElementById("resetView").addEventListener("click", () => {
  fitViewToData();
});

/* =========================================
   ホイールズーム
========================================= */

map.addEventListener("wheel", event => {
  event.preventDefault();

  const delta = Math.max(-300, Math.min(300, event.deltaY));
  const factor = Math.exp(delta * 0.0015);

  zoomAt(factor, event.clientX, event.clientY);
}, { passive: false });

/* =========================================
   ドラッグ移動
========================================= */

map.addEventListener("pointerdown", event => {
  if (event.button !== 0) return;

  dragging = true;
  dragMoved = false;

  dragStart = {
    x: event.clientX,
    y: event.clientY,
    viewX: view.x,
    viewY: view.y
  };

  map.classList.add("dragging");
  map.setPointerCapture(event.pointerId);
});

map.addEventListener("pointermove", event => {
  if (!dragging || !dragStart) return;

  const dx = event.clientX - dragStart.x;
  const dy = event.clientY - dragStart.y;

  if (Math.abs(dx) + Math.abs(dy) > 3) {
    dragMoved = true;
  }

  const scale = getScale();

  view.x = dragStart.viewX - dx * scale;
  view.y = dragStart.viewY - dy * scale;

  /*
    移動中はマーカーを再生成しない。
    SVGのviewBoxだけを変更するので軽い。
  */

  applyView(false);
});

function stopDragging() {
  if (!dragging) return;

  dragging = false;
  dragStart = null;
  map.classList.remove("dragging");

  /*
    ドラッグ後に一度だけマーカーを更新。
  */

  renderMarkers();

  setTimeout(() => {
    dragMoved = false;
  }, 0);
}

map.addEventListener("pointerup", stopDragging);
map.addEventListener("pointercancel", stopDragging);
map.addEventListener("lostpointercapture", stopDragging);

/* =========================================
   キーボード移動
========================================= */

window.addEventListener("keydown", event => {
  if (detailModal.classList.contains("open")) {
    if (event.key === "Escape") {
      closeModal();
    }
    return;
  }

  if (
    event.target instanceof HTMLInputElement ||
    event.target instanceof HTMLTextAreaElement
  ) {
    return;
  }

  const amount = view.w * 0.08;

  switch (event.key) {
    case "ArrowUp":
      event.preventDefault();
      view.y -= amount;
      applyView(false);
      break;

    case "ArrowDown":
      event.preventDefault();
      view.y += amount;
      applyView(false);
      break;

    case "ArrowLeft":
      event.preventDefault();
      view.x -= amount;
      applyView(false);
      break;

    case "ArrowRight":
      event.preventDefault();
      view.x += amount;
      applyView(false);
      break;

    case "+":
    case "=":
      event.preventDefault();
      zoomCenter(0.75);
      break;

    case "-":
      event.preventDefault();
      zoomCenter(1.33);
      break;
  }
});

/* =========================================
   プレイヤー一覧の折りたたみ
========================================= */

document.getElementById("collapsePlayers").addEventListener("click", () => {
  playerPanel.classList.toggle("collapsed");

  const button = document.getElementById("collapsePlayers");

  button.textContent =
    playerPanel.classList.contains("collapsed") ? "+" : "−";
});

/* =========================================
   モーダル操作
========================================= */

document.getElementById("closeModal").addEventListener("click", closeModal);

detailModal.addEventListener("click", event => {
  if (event.target === detailModal) {
    closeModal();
  }
});

/* =========================================
   画面サイズ変更
========================================= */

let resizeFrame = null;

function handleResize() {
  if (resizeFrame !== null) {
    cancelAnimationFrame(resizeFrame);
  }

  resizeFrame = requestAnimationFrame(() => {
    resizeFrame = null;

    if (latestData && map.dataset.initialized === "true") {
      applyView(true);
    } else {
      applyView(false);
    }
  });
}

window.addEventListener("resize", handleResize);

/* =========================================
   初期化
========================================= */

async function initialize() {
  await loadStaff();

  /*
    ページを開いた瞬間に取得。
    その後は1秒ごとの定期更新。
  */

  await fetchStatus();
  scheduleRefresh();
}

initialize();

/* =========================================
   接続状態の補助監視
========================================= */

setInterval(() => {
  if (
    lastSuccessfulFetch > 0 &&
    Date.now() - lastSuccessfulFetch > 10000
  ) {
    setOffline();
  }
}, 3000);

</script>
