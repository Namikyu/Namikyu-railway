
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>在線位置 | 波急サーバー</title>
<link rel="icon" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  min-height: 0;
  margin: 0;
  overflow: hidden;
  font-family: "Yu Gothic UI", "Meiryo", sans-serif;
  color: #24364b;
  background: #eef2f7;
}

/* ヘッダー：既存デザインを維持 */
.header {
  width: 100%;
  height: 120px;
  min-height: 120px;
  max-height: 120px;
  padding: 8px 3%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  overflow: hidden;
  background: linear-gradient(110deg, #075d9b 0%, #087fc4 55%, #129bd2 100%);
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex: 0 1 42%;
  min-width: 0;
  margin: 0;
}

.logo {
  display: block;
  width: 80px;
  height: 80px;
  object-fit: contain;
  flex-shrink: 0;
}

.brand-text {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
}

.brand-title {
  margin: 0;
  color: white;
  font-size: clamp(30px, 3.5vw, 44px);
  font-weight: 800;
  letter-spacing: .06em;
  line-height: 1.15;
  white-space: nowrap;
}

.brand-subtitle {
  margin-top: 5px;
  color: white;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .2em;
  white-space: nowrap;
}

.navigation {
  display: flex;
  justify-content: center;
  align-items: center;
  flex: 1 1 58%;
  min-width: 0;
  gap: 9px;
  margin: 0;
}

.navigation a {
  display: flex;
  justify-content: center;
  align-items: center;
  flex: 1 1 0;
  min-width: 0;
  height: 52px;
  padding: 8px 7px;
  color: white;
  text-decoration: none;
  font-size: clamp(11px, 1.1vw, 15px);
  font-weight: 700;
  white-space: nowrap;
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 7px;
  background: rgba(255,255,255,.12);
  transition: background .2s;
}

.navigation a:hover,
.navigation a.active {
  background: rgba(255,255,255,.28);
}

/* ページ全体 */
main {
  height: calc(100dvh - 120px);
  min-height: 0;
  padding: 12px 18px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.page-title {
  flex-shrink: 0;
  margin: 0 0 3px;
  color: #142b49;
  font-size: 23px;
  font-weight: 800;
}

.page-subtitle {
  flex-shrink: 0;
  margin: 0 0 9px;
  color: #668098;
  font-size: 10px;
  letter-spacing: 2px;
  font-weight: bold;
}

.status-line {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 8px;
  padding: 8px 13px;
  background: white;
  border: 1px solid #e0e8f0;
  border-radius: 9px;
  box-shadow: 0 3px 12px #142b4910;
  font-size: 12px;
}

.status-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #999;
  flex-shrink: 0;
}

.status-dot.online {
  background: #20a464;
  box-shadow: 0 0 0 4px #20a46422;
}

.status-dot.offline {
  background: #d33;
}

/* 凡例 */
.legend {
  flex-shrink: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 11px;
  margin: 6px 0 8px;
  font-size: 11px;
  font-weight: 600;
}

.legend span {
  display: flex;
  align-items: center;
  gap: 5px;
}

.legend i {
  width: 11px;
  height: 11px;
  border-radius: 3px;
  display: inline-block;
}

/* マップ */
#mapArea {
  position: relative;
  width: 100%;
  flex: 1 1 0;
  min-height: 0;
  overflow: hidden;
  border: 1px solid #d7e2ec;
  border-radius: 12px;
  background: #f9fbfd;
  box-shadow: 0 4px 18px #142b4910;
}

#map {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
  touch-action: none;
  overflow: visible;
}

#map.dragging {
  cursor: grabbing;
}

.grid-line {
  stroke: #d9e1e9;
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
  pointer-events: none;
}

.player-marker,
.train-marker {
  cursor: pointer;
}

.player-face {
  image-rendering: pixelated;
  pointer-events: none;
}

.train-label {
  font-weight: 800;
  text-anchor: middle;
  dominant-baseline: central;
  fill: white;
  pointer-events: none;
}

/* プレイヤー一覧 */
#playerPanel {
  position: absolute;
  top: 12px;
  left: 12px;
  width: min(280px, calc(100% - 24px));
  max-height: 65%;
  display: flex;
  flex-direction: column;
  background: #ffffffed;
  border: 1px solid #d8e3ed;
  border-radius: 10px;
  box-shadow: 0 4px 18px #142b4930;
  z-index: 3;
  overflow: hidden;
}

.panel-head {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-bottom: 1px solid #e2e9f0;
  font-size: 12px;
  font-weight: bold;
  color: #142b49;
}

.panel-head button,
.map-controls button {
  border: 1px solid #cbd8e5;
  background: white;
  color: #24415f;
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
}

#playerList {
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  padding: 5px 10px;
}

.player-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 3px;
  border-bottom: 1px solid #edf1f5;
  min-width: 0;
}

.player-row img {
  width: 34px;
  height: 34px;
  object-fit: cover;
  border-radius: 6px;
  background: #e8eef4;
  image-rendering: pixelated;
}

.player-info {
  min-width: 0;
  flex: 1;
}

.player-gamertag {
  font-size: 11px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.role {
  display: inline-block;
  margin-top: 3px;
  padding: 2px 6px;
  border-radius: 4px;
  background: #e8eef5;
  color: #40566d;
  font-size: 9px;
  font-weight: bold;
}

.role-owner {
  background: #ffe08a;
  color: #795000;
}

.role-developer {
  background: #f3c4ec;
  color: #842c73;
}

.role-moderator {
  background: #fbd8e7;
  color: #a34470;
}

.role-leave {
  background: #d9dee3;
  color: #555f69;
}

/* マップ操作ボタン */
.map-controls {
  position: absolute;
  right: 12px;
  top: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 2;
}

.map-controls button {
  width: 38px;
  height: 38px;
  padding: 0;
  font-size: 19px;
}

/* 詳細表示 */
#detailBackdrop {
  position: fixed;
  inset: 0;
  background: rgba(10,25,42,.42);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 20;
}

#detailCard {
  position: relative;
  width: min(480px, 100%);
  max-height: 85dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: white;
  border: 4px solid #2878c8;
  border-radius: 15px;
  box-shadow: 0 18px 60px #0004;
}

#detailAccent {
  height: 8px;
  background: #2878c8;
}

#detailClose {
  position: absolute;
  right: 12px;
  top: 15px;
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 50%;
  background: #edf2f7;
  color: #24364b;
  font-size: 21px;
  line-height: 1;
  cursor: pointer;
}

#detailContent {
  padding: 23px;
}

#detailContent h3 {
  margin: 0 42px 15px 0;
  color: #142b49;
  font-size: 19px;
}

#detailContent p {
  margin: 10px 0;
  font-size: 13px;
  line-height: 1.7;
}

/* 列車詳細の種別・行先 */
.detail-train-heading {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  width: 100%;
  margin: 10px 0 22px;
  text-align: center;
}

#detailContent .detail-type {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 6px 11px;
  border: 2px solid var(--type-color, #2878c8);
  border-radius: 7px;
  background: var(--type-color, #2878c8);
  color: #ffffff;
  font-size: 17px;
  font-weight: 800;
  white-space: nowrap;
  margin: 0;
}

.detail-destination {
  color: #142b49;
  font-size: clamp(22px, 4vw, 29px);
  font-weight: 900;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.detail-information {
  border-top: 1px solid #e4eaf0;
  padding-top: 12px;
}

.detail-information p {
  margin: 10px 0;
}

/* タブレット */
@media(max-width:900px) {
  .header-top {
    flex-basis: 38%;
  }

  .navigation {
    gap: 5px;
  }

  .navigation a {
    font-size: 11px;
    padding: 6px 3px;
  }
}

/* スマートフォン */
@media(max-width:650px) {
  .header {
    height: 150px;
    min-height: 150px;
    max-height: 150px;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    padding: 6px 2%;
  }

  .header-top {
    flex: 0 0 auto;
    gap: 8px;
  }

  .logo {
    width: 48px;
    height: 48px;
  }

  .brand-title {
    font-size: 25px;
  }

  .brand-subtitle {
    font-size: 9px;
  }

  .navigation {
    width: 100%;
    flex: 0 0 auto;
    gap: 5px;
  }

  .navigation a {
    height: 42px;
    padding: 5px 3px;
    font-size: 10px;
  }

  main {
    height: calc(100dvh - 150px);
    padding: 8px 10px;
  }

  .page-title {
    font-size: 20px;
  }

  .page-subtitle {
    margin-bottom: 6px;
    font-size: 9px;
  }

  .status-line {
    flex-wrap: wrap;
    font-size: 10px;
    padding: 7px 10px;
    margin-bottom: 5px;
    gap: 6px;
  }

  .legend {
    gap: 7px;
    margin: 5px 0 7px;
    font-size: 9px;
  }

  .legend i {
    width: 9px;
    height: 9px;
  }

  #mapArea {
    flex: 1 1 0;
    min-height: 0;
  }

  #playerPanel {
    width: min(230px, calc(100% - 24px));
  }

  #detailContent {
    padding: 19px 15px;
  }

  .detail-train-heading {
    gap: 9px;
  }

  #detailContent .detail-type {
    font-size: 16px;
  }

  .detail-destination {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-top">
    <img class="logo" src="./icon.png" alt="波急電鉄ロゴ">
    <div class="brand-text">
      <h1 class="brand-title">波急サーバー</h1>
      <div class="brand-subtitle">NAMIKYU RAILWAY</div>
    </div>
  </div>

  <nav class="navigation">
    <a href="./index.html">ホーム</a>
    <a href="./news.html">お知らせ</a>
    <a href="./join.html">サーバー参加</a>
    <a href="./status.html" class="active">在線位置</a>
    <a href="./staff.html">運営メンバー</a>
  </nav>
</header>

<main>
  <h2 class="page-title">リアルタイム在線位置</h2>
  <p class="page-subtitle">REALTIME TRAIN &amp; PLAYER MAP</p>

  <div class="status-line">
    <span id="statusDot" class="status-dot"></span>
    <strong id="serverState">接続確認中...</strong>
    <span id="lastUpdate">データ取得待機中</span>
    <span style="margin-left:auto">
      プレイヤー <b id="playerCount">0</b> 人 /
      列車 <b id="trainCount">0</b> 編成
    </span>
  </div>

  <div class="legend">
    <span><i style="background:#2878c8"></i>各駅停車</span>
    <span><i style="background:#16a34a"></i>準急</span>
    <span><i style="background:#dc2626"></i>急行</span>
    <span><i style="background:#f97316"></i>特急</span>
    <span><i style="background:#60a5fa"></i>各駅停車（川鉄線）</span>
    <span><i style="background:#888"></i>普通</span>
    <span><i style="background:#000"></i>不明</span>
  </div>

  <section id="mapArea">
    <svg
      id="map"
      xmlns="http://www.w3.org/2000/svg"
      preserveAspectRatio="none"
      aria-label="在線マップ"
    >
      <g id="grid"></g>
      <g id="markers"></g>
    </svg>

    <aside id="playerPanel">
      <div class="panel-head">
        <span>在線プレイヤー (<span id="panelCount">0</span>)</span>
        <button id="togglePlayers">閉じる −</button>
      </div>

      <div id="playerList">
        <p style="font-size:11px;color:#7890a5">
          プレイヤー情報を取得中...
        </p>
      </div>
    </aside>

    <div class="map-controls">
      <button id="zoomIn" title="拡大">＋</button>
      <button id="zoomOut" title="縮小">－</button>
      <button id="resetView" title="全体表示">⌂</button>
    </div>
  </section>
</main>

<div id="detailBackdrop" role="dialog" aria-modal="true" aria-label="列車・プレイヤー詳細">
  <div id="detailCard">
    <div id="detailAccent"></div>
    <button id="detailClose" aria-label="閉じる">×</button>
    <div id="detailContent"></div>
  </div>
</div>

<script>
"use strict";

/* API設定 */
const API_URL = "https://namikyu-status.kou20230831.workers.dev/api/status";
const REFRESH_MS = 2500;

/* マップ設定 */
const GRID_SIZE = 500;

/* ズーム制限 */
const MIN_VIEW_WIDTH = 500;
const MAX_VIEW_WIDTH = 50000;

/* マーカーの画面上の大きさ */
const PLAYER_FACE_PIXELS = 19.2;
const TRAIN_SQUARE_PIXELS = 34;
const TRAIN_LOCAL_SQUARE_PIXELS = 88;
const TRAIN_TRIANGLE_PIXELS = 14;
const TRAIN_TEXT_PIXELS = 15;

/* 状態 */
let staffRoles = {};
let latestData = null;
let initializedView = false;

/* 現在詳細表示している列車の配列位置 */
let selectedTrainIndex = null;

let view = {
  x: -5000,
  y: -5000,
  w: 10000,
  h: 10000
};

let drag = null;

/* HTML要素 */
const map = document.getElementById("map");
const grid = document.getElementById("grid");
const markers = document.getElementById("markers");
const mapArea = document.getElementById("mapArea");

/* HTMLエスケープ */
function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

/* 運営メンバーをstaff.htmlから取得 */
async function loadStaff() {
  try {
    const response = await fetch("./staff.html");

    if (!response.ok) {
      throw new Error("staff.htmlを取得できません");
    }

    const doc = new DOMParser().parseFromString(
      await response.text(),
      "text/html"
    );

    doc.querySelectorAll(".staff-card").forEach(card => {
      const name = card.querySelector(".staff-name")?.textContent.trim();
      const role = card.querySelector(".role-badge")?.textContent.trim();

      if (name && role) {
        staffRoles[name.toLowerCase()] = role;
      }
    });
  } catch (error) {
    console.warn("運営一覧の読み込みに失敗:", error);
  }
}

/* プレイヤーの役職 */
function getRole(name) {
  return staffRoles[String(name).toLowerCase()] || "参加者";
}

function roleClass(role) {
  if (role === "オーナー") return "role-owner";
  if (role === "デベロッパー") return "role-developer";
  if (role === "モデレーター") return "role-moderator";
  if (role === "休職中") return "role-leave";
  return "";
}

/* Minecraftスキンの顔画像 */
function faceURL(name) {
  return "https://mc-heads.net/avatar/" +
    encodeURIComponent(name) + "/64";
}

/* 列車種別判定 */
function getTrainType(train) {
  const tags = train.tags || [];
  const z = Number(train.z);

  if (tags.includes("ltd")) {
    return {
      name: "特急",
      color: "#f97316",
      initial: "特",
      alias: "特急シティ"
    };
  }

  if (tags.includes("exp")) {
    return {
      name: "急行",
      color: "#dc2626",
      initial: "急"
    };
  }

  if (tags.includes("sexp")) {
    if (z < -18 || z > 6131) {
      return {
        name: "各駅停車",
        color: "#2878c8",
        initial: "各駅停車"
      };
    }

    return {
      name: "準急",
      color: "#16a34a",
      initial: "準"
    };
  }

  if (tags.includes("local2")) {
    return {
      name: "各駅停車",
      color: "#60a5fa",
      initial: "各駅停車"
    };
  }

  if (tags.includes("local")) {
    return {
      name: "各駅停車",
      color: "#2878c8",
      initial: "各駅停車"
    };
  }

  /* 水山線の普通列車判定 */
  const x = Number(train.x);

  const inMizuyama =
    x >= -608 &&
    x <= 692 &&
    z >= 3957 &&
    z <= 5257;

  if (inMizuyama) {
    return {
      name: "普通",
      color: "#888888",
      initial: "普",
      alias: "水山線"
    };
  }

  return {
    name: "不明",
    color: "#000000",
    initial: "不"
  };
}

/*
  進行方向タグの判定。
  上がz-、下がz+、右がx、左がx-。
*/
function getDirection(tags) {
  if (tags.includes("z")) return -90;
  if (tags.includes("z-")) return 90;
  if (tags.includes("x")) return 0;
  if (tags.includes("x-")) return 180;
  return 0;
}

/*
  列車の行先判定。
  xをzと同じ方向、x-をz-と同じ方向として扱う。
  z / z- がある場合はそちらを優先する。
*/
function getTrainDestination(train, type) {
  const tags = train.tags || [];

  if (type.alias === "水山線") {
    return "草市～水山 往復";
  }

  let towardPositiveZ = false;
  let towardNegativeZ = false;

  if (tags.includes("z")) {
    towardPositiveZ = true;
  } else if (tags.includes("z-")) {
    towardNegativeZ = true;
  } else if (
    type.name === "急行" ||
    type.name === "各駅停車"
  ) {
    if (tags.includes("x")) {
      towardPositiveZ = true;
    } else if (tags.includes("x-")) {
      towardNegativeZ = true;
    }
  }

  if (!towardPositiveZ && !towardNegativeZ) {
    return "行先不明";
  }

  if (type.name === "各駅停車") {
    return towardPositiveZ ? "波丘" : "吉山";
  }

  if (type.name === "急行") {
    return towardPositiveZ ? "依丘" : "吉山";
  }

  if (type.name === "特急") {
    return towardPositiveZ ? "雨山" : "吉山";
  }

  if (type.name === "準急") {
    return towardPositiveZ ? "雨山" : "矢野";
  }

  return "行先不明";
}

/* SVGの実際の表示サイズ */
function getMapSize() {
  const rect = map.getBoundingClientRect();

  return {
    width: Math.max(1, rect.width),
    height: Math.max(1, rect.height),
    aspect: Math.max(0.01, rect.width / Math.max(1, rect.height))
  };
}

/* 現在の表示倍率 */
function screenScale() {
  const size = getMapSize();
  return view.w / size.width;
}

/* 表示範囲 */
function visibleBounds() {
  return {
    x: view.x,
    y: view.y,
    w: view.w,
    h: view.h
  };
}

/* グリッド描画。500m間隔・数字なし */
function renderGrid() {
  const bounds = visibleBounds();
  const step = GRID_SIZE;

  const left = Math.floor(bounds.x / step) * step;
  const right = Math.ceil((bounds.x + bounds.w) / step) * step;
  const top = Math.floor(bounds.y / step) * step;
  const bottom = Math.ceil((bounds.y + bounds.h) / step) * step;

  let output = "";

  for (let x = left; x <= right; x += step) {
    output += `
      <line
        class="grid-line"
        x1="${x}"
        y1="${top}"
        x2="${x}"
        y2="${bottom}"
      />
    `;
  }

  for (let y = top; y <= bottom; y += step) {
    output += `
      <line
        class="grid-line"
        x1="${left}"
        y1="${y}"
        x2="${right}"
        y2="${y}"
      />
    `;
  }

  grid.innerHTML = output;
}

/* 初回表示位置を決める */
function fitViewToData(data) {
  const all = [
    ...(data.players || []),
    ...(data.trains || [])
  ];

  if (all.length === 0) {
    const size = getMapSize();

    view.w = 10000;
    view.h = view.w / size.aspect;
    view.x = -view.w / 2;
    view.y = -view.h / 2;
    return;
  }

  const xs = all.map(p => Number(p.x) || 0);

  /*
    マップの縦座標はZ座標を反転して配置。
    Zマイナスは画面上、Zプラスは画面下。
  */
  const ys = all.map(p => -(Number(p.z) || 0));

  let minX = Math.min(...xs);
  let maxX = Math.max(...xs);
  let minY = Math.min(...ys);
  let maxY = Math.max(...ys);

  const padding = Math.max(
    1000,
    Math.max(maxX - minX, maxY - minY) * 0.12
  );

  minX -= padding;
  maxX += padding;
  minY -= padding;
  maxY += padding;

  const size = getMapSize();
  const aspect = size.aspect;

  let width = Math.max(2000, maxX - minX);
  let height = Math.max(2000, maxY - minY);

  if (width / height < aspect) {
    width = height * aspect;
  } else {
    height = width / aspect;
  }

  view = {
    x: (minX + maxX - width) / 2,
    y: (minY + maxY - height) / 2,
    w: width,
    h: height
  };
}

/* マーカー描画 */
function renderMarkers(data) {
  const unit = screenScale();

  /* プレイヤーの顔は画面上で一定サイズ */
  const faceSize = PLAYER_FACE_PIXELS * unit;

  const triangleSize = TRAIN_TRIANGLE_PIXELS * unit;

  let output = "";

  /* プレイヤー */
  (data.players || []).forEach(player => {
    const x = Number(player.x) || 0;

    /* Zプラスを画面下にする */
    const y = -(Number(player.z) || 0);

    const name = String(player.name || "不明");

    output += `
      <g
        class="player-marker"
        data-player="${escapeHTML(name)}"
      >
        <image
          href="${faceURL(name)}"
          x="${x - faceSize / 2}"
          y="${y - faceSize / 2}"
          width="${faceSize}"
          height="${faceSize}"
          preserveAspectRatio="xMidY slice"
          class="player-face"
        />
      </g>
    `;
  });

  /* 列車 */
  (data.trains || []).forEach((train, index) => {
    const x = Number(train.x) || 0;

    /* Zプラスを画面下にする */
    const y = -(Number(train.z) || 0);

    const type = getTrainType(train);
    const direction = getDirection(train.tags || []);

    const label = type.initial || type.name;
    const isLongLocalLabel = label === "各駅停車";

    /* 各駅停車だけ文字が収まる横長マーカーにする */
    const squareSize = (
      isLongLocalLabel
        ? TRAIN_LOCAL_SQUARE_PIXELS
        : TRAIN_SQUARE_PIXELS
    ) * unit;

    const markerHalf = squareSize / 2;

    const textWidth = Math.max(
      1,
      squareSize - (isLongLocalLabel ? 8 : 2) * unit
    );

    const left = -markerHalf;
    const top = -markerHalf;
    const right = markerHalf;
    const bottom = markerHalf;
    const tip = right + triangleSize;

    const path = [
      `M ${left} ${top}`,
      `H ${right}`,
      `L ${tip} 0`,
      `L ${right} ${bottom}`,
      `H ${left}`,
      "Z"
    ].join(" ");

    output += `
      <g
        class="train-marker"
        data-train="${index}"
        transform="translate(${x} ${y}) rotate(${direction})"
      >
        <path
          d="${path}"
          fill="${type.color}"
        />

        <!-- マーカー本体は回転、文字は常に正立 -->
        <g transform="rotate(${-direction})">
          <text
            class="train-label"
            x="0"
            y="0"
            textLength="${textWidth}"
            lengthAdjust="spacingAndGlyphs"
            style="font-size:${TRAIN_TEXT_PIXELS * unit}px"
          >${escapeHTML(label)}</text>
        </g>
      </g>
    `;
  });

  markers.innerHTML = output;

  /* 列車クリック */
  markers.querySelectorAll(".train-marker").forEach(element => {
    element.addEventListener("click", () => {
      const index = Number(element.dataset.train);
      const train = data.trains[index];

      if (train) {
        showTrainDetail(train, index);
      }
    });
  });

  /* プレイヤークリック */
  markers.querySelectorAll(".player-marker").forEach(element => {
    element.addEventListener("click", () => {
      const name = element.dataset.player;

      const player = (data.players || []).find(
        value => value.name === name
      );

      if (player) {
        showPlayerDetail(player);
      }
    });
  });
}

/* マップ全体を更新 */
function applyView() {
  const size = getMapSize();

  const centerX = view.x + view.w / 2;
  const centerY = view.y + view.h / 2;

  view.h = view.w / size.aspect;

  view.x = centerX - view.w / 2;
  view.y = centerY - view.h / 2;

  map.setAttribute(
    "viewBox",
    `${view.x} ${view.y} ${view.w} ${view.h}`
  );

  renderGrid();

  if (latestData) {
    renderMarkers(latestData);
  }
}

/* マップ描画 */
function renderMap(data) {
  if (!initializedView) {
    fitViewToData(data);
    initializedView = true;
  }

  applyView();
}

/* 詳細画面を開く */
function openDetail(html, color) {
  document.getElementById("detailAccent").style.background =
    color || "#2878c8";

  document.getElementById("detailCard").style.borderColor =
    color || "#2878c8";

  document.getElementById("detailContent").innerHTML = html;
  document.getElementById("detailBackdrop").style.display = "flex";
}

/* 詳細画面を閉じる */
function closeDetail() {
  document.getElementById("detailBackdrop").style.display = "none";
  selectedTrainIndex = null;
}

/*
  速度表示用の値を整える。
  sokudoが59なら120。
  speedまたはsokudoが"-"なら0。
  空欄や数値に変換できない値も0として扱う。
*/
function getDisplaySpeed(train) {
  if (Number(train.sokudo) === 59 && String(train.sokudo).trim() !== "") {
    return 120;
  }

  const rawSpeed = train.speed;

  if (
    rawSpeed === null ||
    rawSpeed === undefined ||
    String(rawSpeed).trim() === "" ||
    String(rawSpeed).trim() === "-"
  ) {
    return 0;
  }

  const speed = Number(rawSpeed);

  if (!Number.isFinite(speed)) {
    return 0;
  }

  return speed;
}

/* 列車詳細 */
function showTrainDetail(train, index = null) {
  /*
    列車をクリックしたときは選択位置を保存する。
    定期更新から呼び出されたときは保存位置を維持する。
  */
  if (index !== null) {
    selectedTrainIndex = index;
  }

  const type = getTrainType(train);
  const speed = getDisplaySpeed(train);
  const destination = getTrainDestination(train, type);

  openDetail(`
    <div class="detail-train-heading">
      <span
        class="detail-type"
        style="
          --type-color:${type.color};
          color:#ffffff;
          background:${type.color};
          border-color:${type.color};
        "
      >${escapeHTML(type.name === "特急" ? "特急シティ" : type.name)}</span>

      <span class="detail-destination">
        ${escapeHTML(destination)}
      </span>
    </div>

    <div class="detail-information">
      <p>
        <b>速度：</b>
        ${speed} km/h
      </p>

      <p>
        <b>座標：</b>
        X ${escapeHTML(train.x)}
        /
        Y ${escapeHTML(train.y)}
        /
        Z ${escapeHTML(train.z)}
      </p>
    </div>
  `, type.color);
}

/* プレイヤー詳細 */
function showPlayerDetail(player) {
  selectedTrainIndex = null;

  const role = getRole(player.name);

  openDetail(`
    <h3>${escapeHTML(player.name)}</h3>

    <span
      class="detail-type"
      style="
        --type-color:#2878c8;
        color:#ffffff;
        background:#2878c8;
        border-color:#2878c8;
      "
    >${escapeHTML(role)}</span>

    <div class="detail-information">
      <p>
        <b>ディメンション：</b>
        ${escapeHTML(player.dimension || "overworld")}
      </p>

      <p>
        <b>座標：</b>
        X ${escapeHTML(player.x)}
        /
        Y ${escapeHTML(player.y)}
        /
        Z ${escapeHTML(player.z)}
      </p>
    </div>
  `, "#2878c8");
}

/* プレイヤー一覧 */
function renderPlayerList(players) {
  document.getElementById("playerCount").textContent = players.length;
  document.getElementById("panelCount").textContent = players.length;

  const list = document.getElementById("playerList");

  if (players.length === 0) {
    list.innerHTML = `
      <p style="font-size:11px;color:#7890a5">
        現在プレイヤーはいません。
      </p>
    `;
    return;
  }

  list.innerHTML = players.map(player => {
    const role = getRole(player.name);

    return `
      <div class="player-row">
        <img
          src="${faceURL(player.name)}"
          alt=""
          onerror="this.style.display='none'"
        >

        <div class="player-info">
          <div class="player-gamertag">
            ${escapeHTML(player.name)}
          </div>

          <span class="role ${roleClass(role)}">
            ${escapeHTML(role)}
          </span>
        </div>
      </div>
    `;
  }).join("");
}

/* サーバー状態取得 */
async function updateStatus() {
  try {
    const response = await fetch(API_URL, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("API error " + response.status);
    }

    const result = await response.json();

    if (!result.online || !result.data) {
      setOffline("サーバーオフライン");
      return;
    }

    latestData = result.data;

    document.getElementById("statusDot").className =
      "status-dot online";

    document.getElementById("serverState").textContent =
      "サーバーオンライン";

    document.getElementById("lastUpdate").textContent =
      "最終更新：" +
      new Date(result.updated_at).toLocaleTimeString("ja-JP");

    document.getElementById("trainCount").textContent =
      (result.data.trains || []).length;

    renderPlayerList(result.data.players || []);

    /* マップ上のプレイヤー・列車位置を更新 */
    renderMap(result.data);

    /* 選択中の列車詳細も最新データに更新 */
    if (selectedTrainIndex !== null) {
      const selectedTrain =
        (result.data.trains || [])[selectedTrainIndex];

      if (selectedTrain) {
        showTrainDetail(selectedTrain);
      } else {
        closeDetail();
      }
    }

  } catch (error) {
    console.error(error);
    setOffline("データ取得エラー");
  }
}

/* オフライン表示 */
function setOffline(message) {
  document.getElementById("statusDot").className =
    "status-dot offline";

  document.getElementById("serverState").textContent = message;
  document.getElementById("lastUpdate").textContent =
    "データを取得できません";

  document.getElementById("playerCount").textContent = "0";
  document.getElementById("panelCount").textContent = "0";
  document.getElementById("trainCount").textContent = "0";

  document.getElementById("playerList").innerHTML = `
    <p style="font-size:11px;color:#7890a5">
      在線データがありません。
    </p>
  `;

  latestData = null;
  markers.innerHTML = "";

  closeDetail();
}

/* プレイヤー一覧の開閉 */
document.getElementById("togglePlayers").addEventListener("click", () => {
  const list = document.getElementById("playerList");
  const button = document.getElementById("togglePlayers");

  const hidden = list.style.display === "none";

  list.style.display = hidden ? "block" : "none";
  button.textContent = hidden ? "閉じる −" : "開く ＋";
});

/* 詳細画面の閉じる操作 */
document.getElementById("detailClose").addEventListener(
  "click",
  closeDetail
);

document.getElementById("detailBackdrop").addEventListener(
  "click",
  event => {
    if (event.target.id === "detailBackdrop") {
      closeDetail();
    }
  }
);

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeDetail();
  }
});

/* 指定位置を中心にズーム */
function zoomAt(factor, clientX, clientY) {
  const rect = map.getBoundingClientRect();

  if (rect.width <= 0 || rect.height <= 0) return;

  const px = (clientX - rect.left) / rect.width;
  const py = (clientY - rect.top) / rect.height;

  const worldX = view.x + px * view.w;
  const worldY = view.y + py * view.h;

  const newWidth = Math.min(
    MAX_VIEW_WIDTH,
    Math.max(MIN_VIEW_WIDTH, view.w * factor)
  );

  const size = getMapSize();
  const newHeight = newWidth / size.aspect;

  view.x = worldX - px * newWidth;
  view.y = worldY - py * newHeight;
  view.w = newWidth;
  view.h = newHeight;

  applyView();
}

/* 拡大ボタン */
document.getElementById("zoomIn").addEventListener("click", () => {
  const rect = map.getBoundingClientRect();

  zoomAt(
    0.75,
    rect.left + rect.width / 2,
    rect.top + rect.height / 2
  );
});

/* 縮小ボタン */
document.getElementById("zoomOut").addEventListener("click", () => {
  const rect = map.getBoundingClientRect();

  zoomAt(
    1.33,
    rect.left + rect.width / 2,
    rect.top + rect.height / 2
  );
});

/* 初期表示に戻す */
document.getElementById("resetView").addEventListener("click", () => {
  if (latestData) {
    fitViewToData(latestData);
    initializedView = true;
    applyView();
  }
});

/* ドラッグ開始 */
map.addEventListener("pointerdown", event => {
  if (event.target.closest(".train-marker, .player-marker")) {
    return;
  }

  drag = {
    x: event.clientX,
    y: event.clientY,
    viewX: view.x,
    viewY: view.y
  };

  map.classList.add("dragging");
  map.setPointerCapture(event.pointerId);
});

/* ドラッグ中 */
map.addEventListener("pointermove", event => {
  if (!drag) return;

  const rect = map.getBoundingClientRect();

  view.x =
    drag.viewX -
    (event.clientX - drag.x) / rect.width * view.w;

  view.y =
    drag.viewY -
    (event.clientY - drag.y) / rect.height * view.h;

  applyView();
});

/* ドラッグ終了 */
function endDrag() {
  drag = null;
  map.classList.remove("dragging");
}

map.addEventListener("pointerup", endDrag);
map.addEventListener("pointercancel", endDrag);

/* マップ内のマウスホイールだけでズーム */
map.addEventListener("wheel", event => {
  event.preventDefault();

  const factor = event.deltaY < 0 ? 0.9 : 1.1;

  zoomAt(
    factor,
    event.clientX,
    event.clientY
  );
}, {
  passive: false
});

/* 画面サイズ変更 */
window.addEventListener("resize", () => {
  if (!latestData) return;
  applyView();
});

/* 起動 */
(async function start() {
  await loadStaff();
  await updateStatus();

  setInterval(updateStatus, REFRESH_MS);
})();
</script>
