
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#087fc4">
<link rel="icon" href="./icon.png">
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js" defer></script>
<title>在線位置 | 波急サーバー</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;user-select:none;-webkit-user-select:none;font-family:"Yu Gothic UI","Meiryo",sans-serif;color:#24364b;background:#eef2f7}

/* ヘッダー */
.header{width:100%;height:120px;min-height:120px;padding:8px 3%;display:flex;align-items:center;justify-content:space-between;gap:18px;overflow:hidden;background:linear-gradient(110deg,#075d9b 0,#087fc4 55%,#129bd2 100%)}
.header-top{display:flex;align-items:center;justify-content:center;gap:14px;flex:0 1 42%;min-width:0}
.logo{display:block;width:80px;height:80px;object-fit:contain;flex-shrink:0}
.brand-text{display:flex;flex-direction:column;justify-content:center;min-width:0}
.brand-title{margin:0;color:#fff;font-size:clamp(30px,3.5vw,44px);font-weight:800;letter-spacing:.06em;line-height:1.15;white-space:nowrap}
.brand-subtitle{margin-top:5px;color:#fff;font-size:13px;font-weight:600;letter-spacing:.2em;white-space:nowrap}
.navigation{display:flex;justify-content:center;align-items:center;flex:1 1 58%;min-width:0;gap:9px}
.navigation a{display:flex;justify-content:center;align-items:center;flex:1 1 0;min-width:0;height:52px;padding:8px 7px;color:#fff;text-decoration:none;font-size:clamp(11px,1.1vw,15px);font-weight:700;white-space:nowrap;border:1px solid rgba(255,255,255,.45);border-radius:7px;background:rgba(255,255,255,.12);transition:background .2s}
.navigation a:hover,.navigation .theme-toggle:hover{background:rgba(255,255,255,.28)}
.navigation .theme-toggle{flex:0 0 44px;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700;border:1px solid rgba(255,255,255,.55);border-radius:7px;background:rgba(255,255,255,.12);cursor:pointer;transition:background .2s,transform .2s}
.navigation .theme-toggle:active{transform:scale(.95)}

main{height:calc(100dvh - 120px);padding:14px 17px 16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
h2{margin:0;color:#142b49;font-size:22px;font-weight:850}
.subtitle{margin:3px 0 10px;color:#8a9bad;font-size:9px;font-weight:700;letter-spacing:2px}
.status{display:flex;align-items:center;flex-wrap:wrap;gap:9px 17px;padding:12px 16px;margin-bottom:9px;background:white;border:1px solid #e1e9f1;border-radius:11px;font-size:13px;color:#71859a}
.status strong{color:#263e58}
.dot{width:8px;height:8px;border-radius:50%;background:#999;flex-shrink:0}
.dot.online{background:#20a464;box-shadow:0 0 0 4px #20a4641c}
.dot.offline{background:#d33}
.online-count{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:7px;background:#e9f8f0;color:#16834e;font-weight:800}
.online-count strong{font-size:16px;color:#117746}
.legend{display:flex;flex-wrap:wrap;gap:8px 15px;margin:4px 0 9px;font-size:10px;font-weight:650;color:#536b82}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px}
#mapArea{position:relative;flex:1;min-height:0;overflow:hidden;border:1px solid #dce5ed;border-radius:12px;background:#f5f8fb;box-shadow:0 3px 14px #142b4910}
#map{display:block;width:100%;height:100%;cursor:grab;touch-action:none;user-select:none}
#map.dragging{cursor:grabbing}
.grid-line{stroke:#dce5ed;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.route-line{fill:none;stroke-width:32;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.route-wave{stroke:#38bfe8}
.route-yano{stroke:#f97316}
.route-kawatei{stroke:#dc2626}
.route-rain{stroke:#84cc16}
.route-depot{stroke:#888;stroke-width:21}
.station-dot{fill:white;stroke-width:12;pointer-events:none}
.station-wave{stroke:#38bfe8}
.station-yano{stroke:#f97316}
.station-kawatei{stroke:#dc2626}
.station-rain{stroke:#84cc16}
.station-depot{stroke:#888}
.station-label{fill:#111827;stroke:#f5f8fb;stroke-width:3px;paint-order:stroke fill;font-family:"Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;font-weight:800;text-anchor:start;pointer-events:none}
.station-label-end{text-anchor:end}
.station-reading{font-size:.68em;font-weight:600}
.station-label-vertical{font-weight:850}
.station-reading-vertical{font-weight:650}
.train-marker,.player-marker{cursor:pointer;pointer-events:all;outline:none}
.train-marker:focus-visible,.player-marker:focus-visible{filter:drop-shadow(0 0 4px #087fc4)}
.train-visual{pointer-events:none;filter:drop-shadow(0 1px 1.5px #142b4933)}
.train-hit-area{fill:transparent;stroke:transparent;pointer-events:all}
.train-label{fill:white;stroke:#26364a66;stroke-width:1.2px;paint-order:stroke fill;font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.player-name-background{fill:white;fill-opacity:.94;stroke:#dce5ed;stroke-width:1;pointer-events:none}
.player-name-label{fill:#263e58;stroke:white;stroke-width:3px;paint-order:stroke fill;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.compass{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;display:grid;grid-template-columns:28px 28px 28px;grid-template-rows:20px 20px 20px;align-items:center;justify-items:center;pointer-events:none;color:#60778e;font-size:10px;font-weight:850;text-shadow:0 1px 3px white}
.north{grid-column:2;grid-row:1}.west{grid-column:1;grid-row:2}.center{grid-column:2;grid-row:2;color:#9aabba}.east{grid-column:3;grid-row:2}.south{grid-column:2;grid-row:3}
.map-controls{position:absolute;right:12px;top:12px;z-index:5;display:flex;flex-direction:column;gap:6px}
.map-controls button{width:36px;height:36px;border:1px solid #d8e2ec;border-radius:9px;background:#fffffff2;color:#284967;font-size:19px;font-weight:800;cursor:pointer}
.map-controls button:hover{background:#eaf5fc}
.map-help{position:absolute;right:12px;bottom:9px;z-index:2;padding:6px 9px;border-radius:6px;background:#ffffffdf;color:#8093a5;font-size:9px;font-weight:650;pointer-events:none}
.player-panel{position:absolute;left:12px;top:12px;z-index:5;width:220px;max-height:calc(100% - 24px);display:flex;flex-direction:column;background:#fffffff5;border:1px solid #dce5ed;border-radius:12px;box-shadow:0 4px 16px #142b491b;overflow:hidden}
.player-panel.collapsed{width:135px}
.player-panel-head{min-height:45px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 11px;border-bottom:1px solid #e8eef4;color:#29445f;font-size:11px;font-weight:850}
.player-panel-heading{display:flex;align-items:center;gap:7px;min-width:0}
.player-panel-heading:before{content:"";width:7px;height:7px;border-radius:50%;background:#20a464}
.player-panel-count{padding:3px 7px;border-radius:6px;background:#e9f8f0;color:#16834e;font-size:10px;font-weight:900}
.player-panel-head button{width:25px;height:25px;border:0;border-radius:6px;background:#edf3f8;color:#55718b;cursor:pointer}
.player-list{padding:6px;overflow-y:auto;min-height:0}
.player-row{display:flex;align-items:center;gap:9px;width:100%;padding:7px;margin-bottom:3px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;color:#334d67;font-size:11px;cursor:pointer}
.player-row:hover{background:#edf6fc;border-color:#dcecf8}
.player-row img{width:31px;height:31px;flex-shrink:0;image-rendering:pixelated;border-radius:7px;background:#edf2f6}
.player-row-info{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.player-row-name{font-weight:850;overflow-wrap:anywhere;word-break:break-word}
.player-role-badge{display:inline-flex;align-items:center;width:max-content;max-width:100%;padding:3px 8px;border-radius:5px;font-size:9px;font-weight:800;line-height:1.4;white-space:nowrap;border:1px solid transparent}
.role-owner{color:#795000;background:#ffe08a;border-color:#f1c85d}
.role-developer{color:#842c73;background:#f3c4ec;border-color:#e5a5d9}
.role-moderator{color:#a34470;background:#fbd8e7;border-color:#efb8cf}
.role-participant{color:#555f69;background:#d9dee3;border-color:#b9c1c9}
.player-empty{padding:17px 8px;color:#91a0ae;font-size:10px;text-align:center}
.player-panel.collapsed .player-list{display:none}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:#0d1f327a;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.modal-card{width:min(460px,100%);max-height:85vh;overflow:auto;padding:21px;background:white;border:1px solid #dce5ed;border-radius:15px;box-shadow:0 15px 50px #0003}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
.modal-title{margin:0;color:#142b49;font-size:17px;font-weight:900}
.modal-close{width:32px;height:32px;border:0;border-radius:8px;background:#edf2f6;color:#49647e;font-size:19px;cursor:pointer}
.detail-player{display:flex;align-items:center;gap:13px;margin-bottom:15px;padding:12px;background:#f7fafd;border:1px solid #e6edf3;border-radius:10px}
.detail-player img{width:58px;height:58px;border-radius:9px;image-rendering:pixelated}
.detail-player-name{font-size:17px;font-weight:900;color:#203c58;overflow-wrap:anywhere}
.detail-player-role{margin-top:6px}
.train-summary{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 17px;padding:17px 10px;border:2px solid #2878c8;border-radius:10px;flex-wrap:wrap;background:#f9fbfd}
.train-type{font-size:19px;font-weight:900;color:white;background:#2878c8;border-radius:7px;padding:7px 14px}
.train-destination{font-size:17px;font-weight:900;color:#263f58;text-align:center}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail-item{padding:11px;border:1px solid #e4ebf1;border-radius:8px;background:#f8fafc;min-width:0}
.detail-item.wide{grid-column:1/-1}
.detail-label{font-size:9px;color:#899aab;font-weight:750}
.detail-value{margin-top:5px;font-size:13px;color:#29445f;font-weight:850;overflow-wrap:anywhere;word-break:break-word}
.detail-note{margin-top:12px;font-size:10px;color:#8a9aaa}

/* ダークモード */
html[data-theme=dark]{color-scheme:dark;--navy:#eaf3ff;--text:#e4edf7;--border:#354b62;--bg:#111c2b;--surface:#1c2b3e}
html[data-theme=dark] body{background:#111c2b;color:#e4edf7}
html[data-theme=dark] h2{color:#eaf3ff}
html[data-theme=dark] .status{background:#1c2b3e;color:#b5c7d9;border-color:#354b62}
html[data-theme=dark] .status strong,html[data-theme=dark] .detail-value{color:#e4edf7}
html[data-theme=dark] .online-count,html[data-theme=dark] .player-panel-count{background:#173d32;color:#79dfae}
html[data-theme=dark] .online-count strong{color:#79dfae}
html[data-theme=dark] .legend{color:#b5c7d9}
html[data-theme=dark] #mapArea{background:#172538;border-color:#354b62}
html[data-theme=dark] .grid-line{stroke:#354b62}
html[data-theme=dark] .station-label{fill:#f3f7fc;stroke:#172538}
html[data-theme=dark] .player-panel{background:#1c2b3ef5;border-color:#354b62}
html[data-theme=dark] .player-panel-head{color:#e4edf7;border-color:#354b62}
html[data-theme=dark] .player-panel-head button,html[data-theme=dark] .modal-close{background:#30465d;color:#e4edf7}
html[data-theme=dark] .player-row{color:#d5e3f0}
html[data-theme=dark] .player-row:hover{background:#263d53;border-color:#405a73}
html[data-theme=dark] .player-row-name,html[data-theme=dark] .detail-player-name{color:#e4edf7}
html[data-theme=dark] .player-row img,html[data-theme=dark] .detail-player img{background:#30465d}
html[data-theme=dark] .map-controls button{background:#26384d;color:#e4edf7;border-color:#40566e}
html[data-theme=dark] .map-help{background:#1c2b3ee8;color:#b5c7d9}
html[data-theme=dark] .compass{color:#c0d0df;text-shadow:0 1px 3px #111c2b}
html[data-theme=dark] .modal-card{background:#1c2b3e;border-color:#40566e}
html[data-theme=dark] .modal-title{color:#eaf3ff}
html[data-theme=dark] .detail-player,html[data-theme=dark] .detail-item{background:#26384d;border-color:#40566e}
html[data-theme=dark] .train-summary{background:#26384d}
html[data-theme=dark] .train-destination{color:#e4edf7}
html[data-theme=dark] .player-name-background{fill:#172638;stroke:#52677d}
html[data-theme=dark] .player-name-label{fill:white;stroke:#172638}

@media(max-width:900px){
 .header{gap:10px}.header-top{flex-basis:38%}.navigation{flex-basis:62%;gap:6px}
 .brand-title{font-size:clamp(25px,3vw,36px)}
}
@media(max-width:760px){
 main{padding:9px}h2{font-size:17px}
 .status{padding:9px 11px;gap:7px 11px;font-size:11px}
 .legend{gap:6px 9px;font-size:9px}
 .player-panel{width:155px;left:7px;top:7px;max-height:48%}
 .player-panel.collapsed{width:125px}
 .map-controls{right:7px;top:7px}
 .map-controls button{width:32px;height:32px}
 .map-help{right:7px;bottom:6px;font-size:8px}
}
@media(max-width:650px){
 .header{height:150px;min-height:150px;flex-direction:column;justify-content:center;gap:8px;padding:6px 2%}
 .header-top{flex:0 0 auto;gap:8px}
 .logo{width:48px;height:48px}
 .brand-title{font-size:25px}
 .brand-subtitle{font-size:9px}
 .navigation{width:100%;flex:0 0 auto;gap:5px}
 .navigation a{height:42px;padding:5px 3px;font-size:10px}
 .navigation .theme-toggle{flex-basis:36px;width:36px;height:38px;font-size:18px}
 main{height:calc(100dvh - 150px)}
}
@media(max-width:430px){
 main{padding:7px}.player-panel{width:140px}.player-panel.collapsed{width:120px}
}
</style>
</head>
<body>
<header class="header">
 <div class="header-top">
  <img class="logo" src="./icon.png" alt="波急電鉄ロゴ">
  <div class="brand-text">
   <h1 class="brand-title">波急サーバー</h1>
   <div class="brand-subtitle">NAMIKYU RAILWAY</div>
  </div>
 </div>
 <nav class="navigation">
  <a href="./index.html">ホーム</a>
  <a href="./news.html">お知らせ</a>
  <a href="./join.html">サーバー参加</a>
  <a href="./status.html">在線位置</a>
  <a href="./staff.html">運営メンバー</a>
  <button class="theme-toggle" type="button" data-theme-toggle aria-label="ダークモードに切り替え">🌙</button>
 </nav>
</header>

<main>
<h2>在線位置</h2>
<p class="subtitle">REAL-TIME PLAYER &amp; TRAIN POSITION</p>
<div class="status">
 <span id="connectionDot" class="dot"></span><strong id="connectionText">接続しています...</strong>
 <span id="lastUpdated">最終更新：--:--:--</span>
 <span id="worldTime">ワールド時刻：--</span>
 <span id="weatherText">天候：--</span>
 <span id="tpsText">TPS：--</span>
 <span class="online-count">オンライン <strong id="playerCount">--</strong> 人</span>
 <span id="trainCount">列車：--編成</span>
</div>
<div class="legend">
 <span><i style="background:#38bfe8"></i>波急波川線</span>
 <span><i style="background:#f97316"></i>矢野電</span>
 <span><i style="background:#dc2626"></i>川鉄依丘線</span>
 <span><i style="background:#84cc16"></i>雨急</span>
 <span><i style="background:#888"></i>留置線・車庫線</span>
 <span><i style="background:#f97316"></i>特急</span>
 <span><i style="background:#dc2626"></i>急行</span>
 <span><i style="background:#16a34a"></i>準急</span>
 <span><i style="background:#2878c8"></i>各駅停車</span>
 <span>顔マーク：プレイヤー</span>
</div>

<section id="mapArea">
 <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="在線位置マップ">
  <g id="gridLayer"></g>
  <g id="routeLayer"></g>
  <g id="stationLayer"></g>
  <g id="markerLayer"></g>
 </svg>
 <div class="compass">
  <span class="north">Z−</span><span class="west">X−</span>
  <span class="center">＋</span><span class="east">X＋</span>
  <span class="south">Z＋</span>
 </div>
 <div class="player-panel" id="playerPanel">
  <div class="player-panel-head">
   <div class="player-panel-heading">オンラインプレイヤー</div>
   <span class="player-panel-count" id="playerPanelCount">0</span>
   <button id="collapsePlayers" type="button">−</button>
  </div>
  <div class="player-list" id="playerList"><div class="player-empty">読み込み中...</div></div>
 </div>
 <div class="map-controls">
  <button id="zoomIn" type="button" aria-label="拡大">＋</button>
  <button id="zoomOut" type="button" aria-label="縮小">−</button>
  <button id="resetView" type="button" aria-label="全体表示">⌂</button>
 </div>
 <div class="map-help">ドラッグ：移動 / ホイール：拡大・縮小 / マーカー：詳細</div>
</section>
</main>

<div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
 <div class="modal-card">
  <div class="modal-head">
   <h3 class="modal-title" id="modalTitle">詳細情報</h3>
   <button class="modal-close" id="closeModal" type="button">×</button>
  </div>
  <div id="modalContent"></div>
 </div>
</div>

<script>
"use strict";

const API_URL="https://namikyu-status.kou20230831.workers.dev/api/status";
const MIN_W=1100,MAX_W=28000,GRID=500,$=id=>document.getElementById(id);
const map=$("map"),gridLayer=$("gridLayer"),routeLayer=$("routeLayer"),stationLayer=$("stationLayer"),markerLayer=$("markerLayer");
const connDot=$("connectionDot"),connText=$("connectionText"),lastUpd=$("lastUpdated"),wtText=$("worldTime"),wxText=$("weatherText"),tpsText=$("tpsText"),pcText=$("playerCount"),tcText=$("trainCount");
const ppCount=$("playerPanelCount"),pList=$("playerList"),pPanel=$("playerPanel"),modal=$("detailModal"),mContent=$("modalContent"),mTitle=$("modalTitle"),closeBtn=$("closeModal"),collapseBtn=$("collapsePlayers");

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const num=(v,f=0)=>Number.isFinite(Number(v))?Number(v):f;
const fmt=(v,d=1)=>Number.isFinite(Number(v))?Number(v).toFixed(d):"--";
const getName=e=>String(e?.name??e?.playerName??e?.player??e?.id??"不明");
const coords=e=>{const p=e?.location??e?.position??e??{};return{x:num(p.x),y:num(p.y),z:num(p.z)}};
const toMap=e=>{const p=coords(e);return{x:p.x,y:p.z}};
const xyz=p=>`${fmt(p.x,2)}, ${fmt(p.y,2)}, ${fmt(p.z,2)}`;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const face=n=>`https://mc-heads.net/avatar/${encodeURIComponent(n)}/64`;
const ANGLES={"x+":0,"z+":90,"x-":180,"z-":-90};
const TYPE_TAGS=["ltd","exp","sexp","local2","local"];
const DEST={local2:["依丘","草市"],local:["波丘","吉山"],exp:["依丘","吉山"],ltd:["雨山","吉山"],sexp:["雨山","矢野"],"sexp-local":["雨山","矢野"]};
const MODELS={1532:"波急3500系",2532:"矢野電5000系",3800:"雨急3800系",4722:"雨急4000系",5179:"波急5100系",6971:"水鉄1500系",8152:"川鉄9700系",7661:"波急3100系",8575:"波急2500系"};
const KTS=/kts:kts(\d{4})_1/i;

/* 駅データ：Y座標は路線図に使用しない */
const stations=[
 {name:"中市",reading:"なかいち",x:0,z:-17,line:"both"},
 {name:"大白",reading:"おおしろ",x:0,z:1051,line:"wave"},
 {name:"水浜",reading:"みずはま",x:0,z:2020,line:"wave"},
 {name:"竹ヶ丘",reading:"たけがおか",x:0,z:3100,line:"wave"},
 {name:"草市",reading:"くさし",x:0,z:4080,line:"wave"},
 {name:"長立",reading:"ながたち",x:0,z:5000,line:"wave"},
 {name:"波丘",reading:"なみおか",x:0,z:6132,line:"wave"},
 {name:"矢野空港",reading:"やのくうこう",x:0,z:-1327,line:"yano"},
 {name:"矢野",reading:"やの",x:0,z:-2483,line:"yano"},
 {name:"大東",reading:"だいとう",x:0,z:-3787,line:"yano"},
 {name:"浜口",reading:"はまぐち",x:0,z:-4988,line:"yano"},
 {name:"新矢野",reading:"しんやの",x:0,z:-5989,line:"yano"},

function trainType(g,z,water){
 if(g.includes("ltd"))return{key:"ltd",name:"特急",label:"特",color:"#f97316"};
 if(g.includes("exp"))return{key:"exp",name:"急行",label:"急",color:"#dc2626"};
 if(g.includes("sexp"))return z<-18||z>6131?{key:"sexp-local",name:"各駅停車",label:"各",color:"#2878c8"}:{key:"sexp",name:"準急",label:"準",color:"#16a34a"};
 if(g.includes("local2"))return{key:"local2",name:"各駅停車",label:"各",color:"#60a5fa"};
 if(g.includes("local"))return{key:"local",name:"各駅停車",label:"各",color:"#2878c8"};
 return water?{key:"waterline",name:"普通",label:"普",color:"#888"}:{key:"unknown",name:"その他",label:"不",color:"#222"};
}
function trainInfo(t){
 const g=tags(t),p=coords(t),water=p.x>=-608&&p.x<=692&&p.z>=3957&&p.z<=5257&&!g.some(x=>TYPE_TAGS.includes(x));
 const d=g.includes("z-")?"z-":g.includes("z+")||g.includes("z")?"z+":g.includes("x-")?"x-":"x+";
 const a=(ANGLES[d]||0)*Math.PI/180,match=KTS.exec(t?.car_type_id)||KTS.exec(t?.car_name),type=trainType(g,p.z,water);
 return{...p,id:stableId(t),d,c:Math.cos(a),s:Math.sin(a),type,model:MODELS[match?.[1]]||"不明",
 route:water?"水鉄水山線":p.x>=50&&p.z>=4000&&p.z<=5000?"川鉄依丘線":p.z>6131?"雨急雨波線":p.z<-18?"矢野電鉄":"波急波川線",
 destination:water?"草市～水山 往復":DEST[type.key]?DEST[type.key][d==="z+"||d==="x+"?0:1]:"不明"};
}
function speedOf(t){
 const s=Number(t?.sokudo??(t?.speed!=null?t.speed/2:NaN));
 if(s===59)return 120;
 if(Number.isFinite(s)&&s<0)return 0;
 const p=Number(t?.speed);
 return!Number.isFinite(p)||p<0?0:p;
}

function avoidTrains(pos,tp){
 const poly=[[-90,-90],[90,-90],[180,0],[90,90],[-90,90]],limit=265**2;
 let x=pos.x,y=pos.y;
 for(let pass=0;pass<3;pass++){
  let moved=false;
  for(const t of tp){
   const dx=x-t.x,dy=y-t.z;
   if(dx*dx+dy*dy>limit)continue;
   const lx=dx*t.c+dy*t.s,ly=-dx*t.s+dy*t.c;
   let best=Infinity,qx=0,qy=0,inside=true;
   for(let i=0;i<5;i++){
    const a=poly[i],b=poly[(i+1)%5],ax=b[0]-a[0],ay=b[1]-a[1];
    const k=clamp(((lx-a[0])*ax+(ly-a[1])*ay)/(ax*ax+ay*ay),0,1);
    const px=a[0]+ax*k,py=a[1]+ay*k,d=Math.hypot(lx-px,ly-py);
    if(d<best){best=d;qx=px;qy=py}
    if(ax*(ly-a[1])-ay*(lx-a[0])<0)inside=false;
   }
   if(!inside&&best>=85)continue;
   let ux=inside?qx-lx:lx-qx,uy=inside?qy-ly:ly-qy,len=Math.hypot(ux,uy);
   if(len<1e-9){ux=0;uy=-1}else{ux/=len;uy/=len}
   const nx=qx+ux*85,ny=qy+uy*85;
   x=t.x+nx*t.c-ny*t.s;y=t.z+nx*t.s+ny*t.c;moved=true;
  }
  if(!moved)break;
 }
 for(let pass=0;pass<2;pass++)for(const s of stations){
  const q=stationLabelLayout[s.name];if(!q)continue;
  let x0,x1,y0,y1;
  if(q.vertical){
   x0=Math.min(q.x,q.readingX)-105;x1=Math.max(q.x,q.readingX)+55;
   y0=q.y-40;y1=q.y+Math.max(s.name.length,s.reading.length)*95+60;
  }else{
   const w=Math.max(s.name.length*145,s.reading.length*99)+90;
   x0=q.a==="end"?q.x-w:q.x-25;x1=q.a==="end"?q.x+25:x0+w;
   y0=q.y-185;y1=q.y+145;
  }
  if(x>=x0-110&&x<=x1+110&&y>=y0-110&&y<=y1+110){
   const ds=[Math.abs(x-(x0-145)),Math.abs(x1+145-x),Math.abs(y-(y0-145)),Math.abs(y1+145-y)];
   const m=Math.min(...ds);
   if(m===ds[0])x=x0-145;
   else if(m===ds[1])x=x1+145;
   else if(m===ds[2])y=y0-145;
   else y=y1+145;
  }
 }
 return{x,y};
}

async function fetchStatus(){

  const res=await fetch(API_URL,{cache:"no-store"});
  if(!res.ok)throw Error(`HTTP ${res.status}`);
  const data=await res.json();
  if(data?.success===false)throw Error(data.error||"API error");
  latest=data;
  const r=data?.data??data?.status??data??{};
  players=list(r.players??r.player??r.onlinePlayers??[]);
  trains=list(r.trains??r.train??r.carts??[]);
  wtText.textContent=`ワールド時刻：${r.worldTime??r.time??r.world_time??"--"}`;
  wxText.textContent=`天候：${r.weather??r.worldWeather??r.world_weather??"--"}`;
  tpsText.textContent=`TPS：${fmt(r.tps??r.TPS??"--",0)}`;
  pcText.textContent=players.length;
  tcText.textContent=`列車：${trains.length}編成`;
  lastUpd.textContent=`最終更新：${new Date().toLocaleTimeString("ja-JP",{hour12:false})}`;
  setConnection(true);lastOk=Date.now();
  if(map.dataset.initialized!=="true"){
   setInitialView();map.dataset.initialized="true";
  }else renderMarkers();
  refreshDetail();
 }catch(e){
  console.error("在線データ取得エラー:",e);
  setConnection(false);
 }finally{isFetching=false}
}

function zoomAt(f,cx,cy){

 const wx=view.x+px*view.w,wy=view.y+py*view.h;
 view.w=clamp(view.w*f,MIN_W,MAX_W);
 view.h=view.w/dimensions().aspect;
 view.x=wx-px*view.w;view.y=wy-py*view.h;
 applyView();
}

}

});
window.addEventListener("pointermove",e=>{
 if(!dragging||!dragStart)return;
 const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y,s=scale();
 if(Math.abs(dx)+Math.abs(dy)>3)dragMoved=true;
 view.x=dragStart.vx-dx*s;view.y=dragStart.vy-dy*s;
 applyView(false);
});
function stopDragging(){
 if(!dragging)return;
 dragging=false;dragStart=null;map.classList.remove("dragging");
 renderMarkers();setTimeout(()=>dragMoved=false,120);
}
window.addEventListener("pointerup",stopDragging);
window.addEventListener("pointercancel",stopDragging);

window.addEventListener("keydown",e=>{
 if(modal.classList.contains("open")){if(e.key==="Escape")closeModal();return}
 if(e.target instanceof HTMLElement&&e.target.matches("input,textarea,button,a"))return;
 const step=view.w*.08;
 const moves={ArrowUp:[0,-step],ArrowDown:[0,step],ArrowLeft:[-step,0],ArrowRight:[step,0]};
 if(moves[e.key]){
  e.preventDefault();view.x+=moves[e.key][0];view.y+=moves[e.key][1];applyView(false);
 }else if(e.key==="+"||e.key==="="){
  e.preventDefault();zoomCenter(.75);
 }else if(e.key==="-"){
  e.preventDefault();zoomCenter(1.33);
 }
});

collapseBtn.addEventListener("click",()=>{
 pPanel.classList.toggle("collapsed");
 collapseBtn.textContent=pPanel.classList.contains("collapsed")?"+":"−";
});
closeBtn.addEventListener("click",closeModal);
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
window.addEventListener("resize",()=>{
 cancelAnimationFrame(resizeFrame);
 resizeFrame=requestAnimationFrame(()=>{view.h=view.w/dimensions().aspect;applyView()});
});

document.addEventListener("selectstart",e=>e.preventDefault());
document.addEventListener("copy",e=>e.preventDefault());
document.addEventListener("cut",e=>e.preventDefault());
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
 if((e.ctrlKey||e.metaKey)&&["a","c","x"].includes(e.key.toLowerCase()))e.preventDefault();
});

(async()=>{
 await loadStaff();
 await fetchStatus();
 scheduleRefresh();
})();
</script>
</body>
</html>
