<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087fc4"><title>在線位置 | 波急サーバー</title><link rel="icon" href="./icon.png">
<style>
*{box-sizing:border-box}

.player-row{display:flex;align-items:center;gap:9px;width:100%;padding:7px;margin-bottom:3px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;color:#334d67;font-size:11px;transition:background .15s,border-color .15s}

.player-row:hover{background:#edf6fc;border-color:#dcecf8}
.player-row img{width:31px;height:31px;flex-shrink:0;image-rendering:pixelated;border-radius:7px;background:#edf2f6}

.player-row-name{font-weight:850;overflow-wrap:anywhere;word-break:break-word;color:#29445f}
.player-role-badge{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:max-content;max-width:100%;padding:3px 8px;border-radius:5px;font-size:9px;font-weight:800;line-height:1.4;white-space:nowrap;border:1px solid transparent}
.player-role-badge.role-owner{color:#795000;background:#ffe08a;border-color:#f1c85d}
.player-role-badge.role-developer{color:#842c73;background:#f3c4ec;border-color:#e5a5d9}
.player-role-badge.role-moderator{color:#a34470;background:#fbd8e7;border-color:#efb8cf}
.player-role-badge.role-participant{color:#555f69;background:#d9dee3;border-color:#b9c1c9}

.player-panel.collapsed .player-list{display:none}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:#0d1f327a;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.modal-card{width:min(460px,100%);max-height:85vh;overflow:auto;padding:21px;background:#fff;border:1px solid #dce5ed;border-radius:15px;box-shadow:0 15px 50px #0003;overscroll-behavior:contain;animation:modalIn .16s ease-out}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
.modal-title{margin:0;color:#142b49;font-size:17px;font-weight:900}
.modal-close{width:32px;height:32px;border:0;border-radius:8px;background:#edf2f6;color:#49647e;font-size:19px}
.modal-close:hover{background:#dceaf5}
.detail-player{display:flex;align-items:center;gap:13px;margin-bottom:15px;padding:12px;background:#f7fafd;border:1px solid #e6edf3;border-radius:10px}
.detail-player img{width:58px;height:58px;border-radius:9px;image-rendering:pixelated;background:#edf2f6}
.detail-player-name{font-size:17px;font-weight:900;color:#203c58;overflow-wrap:anywhere}
.detail-player-role{margin-top:6px}
.train-summary{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 17px;padding:17px 10px;border:2px solid #2878c8;border-radius:10px;flex-wrap:wrap;background:#f9fbfd}
.train-type{font-size:19px;font-weight:900;color:#fff;background:#2878c8;border-radius:7px;padding:7px 14px}
.train-destination{font-size:17px;font-weight:900;color:#263f58;text-align:center}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail-item{padding:11px;border:1px solid #e4ebf1;border-radius:8px;background:#f8fafc;min-width:0}
.detail-label{font-size:9px;color:#899aab;font-weight:750;letter-spacing:.04em}
.detail-value{margin-top:5px;font-size:13px;color:#29445f;font-weight:850;overflow-wrap:anywhere;word-break:break-word;font-variant-numeric:tabular-nums}
.detail-note{margin-top:12px;font-size:10px;color:#8a9aaa}
@media(max-width:760px){

h2{font-size:17px}
.subtitle{font-size:8px;margin-bottom:7px}

.legend{gap:6px 9px;font-size:9px;margin:4px 0 7px}
.player-panel{width:155px;left:7px;top:7px;max-height:48%}
.player-panel.collapsed{width:125px}

@media(max-width:650px){
.header{height:150px;min-height:150px;max-height:150px;flex-basis:150px;flex-direction:column;justify-content:center;gap:8px;padding:6px 2%}
.header-top{flex:0 0 auto;gap:8px}
.logo{width:48px;height:48px}
.brand-title{font-size:25px}
.brand-subtitle{font-size:9px}
.navigation{width:100%;flex:0 0 auto;gap:5px}
.navigation a{height:42px;padding:5px 3px;font-size:10px}
main{height:calc(100dvh - 150px)}
}
@media(max-width:430px){
main{padding:7px}

.player-panel.collapsed{width:120px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body>
<header class="header"><div class="header-top"><img class="logo" src="./icon.png" alt="波急電鉄ロゴ"><div class="brand-text"><h1 class="brand-title">波急サーバー</h1><div class="brand-subtitle">NAMIKYU RAILWAY</div></div></div>
<nav class="navigation"><a href="./index.html">ホーム</a><a href="./news.html">お知らせ</a><a href="./join.html">サーバー参加</a><a href="./status.html">在線位置</a><a href="./staff.html">運営メンバー</a></nav></header>
<main>
<h2>在線位置</h2>
<p class="subtitle">REAL-TIME PLAYER &amp; TRAIN POSITION</p>
<div class="status"><span id="connectionDot" class="dot"></span><strong id="connectionText">接続しています...</strong><span id="lastUpdated">最終更新：--:--:--</span><span id="worldTime">ワールド時刻：--</span><span id="weatherText">天候：--</span><span id="tpsText">TPS：--</span><span class="online-count">オンライン <strong id="playerCount">--</strong> 人</span><span id="trainCount">列車：--編成</span></div>
<div class="legend"><span><i style="background:#f97316"></i>特急</span><span><i style="background:#dc2626"></i>急行</span><span><i style="background:#16a34a"></i>準急</span><span><i style="background:#2878c8"></i>各駅停車</span><span><i style="background:#888"></i>水鉄水山線</span><span><i style="background:#222"></i>その他</span><span>顔マーク：プレイヤー</span></div>
<section id="mapArea">
<svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="在線位置マップ"><g id="gridLayer"></g><g id="markerLayer"></g></svg>
<div class="compass"><span class="north">Z−</span><span class="west">X−</span><span class="center">＋</span><span class="east">X＋</span><span class="south">Z＋</span></div>
<div class="player-panel" id="playerPanel"><div class="player-panel-head"><div class="player-panel-heading">オンラインプレイヤー</div><span class="player-panel-count" id="playerPanelCount">0</span><button id="collapsePlayers" type="button" aria-label="プレイヤー一覧を開閉">−</button></div><div class="player-list" id="playerList"><div class="player-empty">読み込み中...</div></div></div>
<div class="map-controls"><button id="zoomIn" type="button" title="拡大" aria-label="拡大">＋</button><button id="zoomOut" type="button" title="縮小" aria-label="縮小">−</button><button id="resetView" type="button" title="全体表示" aria-label="全体表示">⌂</button></div>
<div class="map-help">ドラッグ：移動 / ホイール：拡大・縮小 / マーカー：詳細</div>
</section>
</main>
<div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-card"><div class="modal-head"><h3 class="modal-title" id="modalTitle">詳細情報</h3><button class="modal-close" id="closeModal" type="button" aria-label="閉じる">×</button></div><div id="modalContent"></div></div></div>
<script>
"use strict";
const API_URL="https://namikyu-status.kou20230831.workers.dev/api/status",REFRESH_MS=3000,MIN_VIEW_WIDTH=500,MAX_VIEW_WIDTH=50000,GRID_SIZE=500,
WATERLINE_MIN_X=-608,WATERLINE_MAX_X=692,WATERLINE_MIN_Z=3957,WATERLINE_MAX_Z=5257,KAWATETSU_MIN_X=50,UKYU_MIN_Z=6131,YANODEN_MAX_Z=-18,
$=id=>document.getElementById(id),
map=$("map"),gridLayer=$("gridLayer"),markerLayer=$("markerLayer"),connectionDot=$("connectionDot"),connectionText=$("connectionText"),lastUpdated=$("lastUpdated"),worldTimeText=$("worldTime"),weatherText=$("weatherText"),tpsText=$("tpsText"),playerCountText=$("playerCount"),trainCountText=$("trainCount"),playerPanelCount=$("playerPanelCount"),playerList=$("playerList"),playerPanel=$("playerPanel"),detailModal=$("detailModal"),modalContent=$("modalContent"),modalTitle=$("modalTitle");

let latestData=null,players=[],trains=[],staffMap=new Map(),view={x:-5000,y:-5000,w:10000,h:10000},dragging=false,dragStart=null,dragMoved=false,dragResetTimer=null,isFetching=false,refreshTimer=null,lastSuccessfulFetch=0,selectedEntityKey=null,selectedTrainIdentity=null;

const escapeHtml=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"),
numberValue=(v,f=0)=>{const n=Number(v);return Number.isFinite(n)?n:f},
formatNumber=(v,d=1)=>{const n=Number(v);return Number.isFinite(n)?n.toFixed(d):"--"},
getName=e=>String(e?.name??e?.playerName??e?.player??e?.id??"不明"),
getCoordinates=e=>{const l=e?.location??e?.position??e??{};return{x:numberValue(l.x,0),z:numberValue(l.z,0)}},
clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),
faceUrl=n=>`https://mc-heads.net/avatar/${encodeURIComponent(n)}/64`;

function normalizeTags(e){
const r=e?.tags??e?.tag??[];
if(Array.isArray(r))return r.map(v=>String(v).toLowerCase());
if(typeof r==="string")return r.split(/[,\s]+/).map(v=>v.trim().toLowerCase()).filter(Boolean);
return[]}

function normalizeCollection(v){
if(Array.isArray(v))return v;
if(v&&typeof v==="object")return Object.entries(v).map(([k,i])=>i&&typeof i==="object"?{...i,id:i.id??k}:{id:k,value:i});
return[]}

function getMapSize(){const r=map.getBoundingClientRect(),w=Math.max(1,r.width),h=Math.max(1,r.height);return{width:w,height:h,aspect:w/h}}
const getScale=()=>view.w/getMapSize().width;

function xInWaterline(t){const{x,z}=getCoordinates(t);return x>=WATERLINE_MIN_X&&x<=WATERLINE_MAX_X&&z>=WATERLINE_MIN_Z&&z<=WATERLINE_MAX_Z}

function getTrainRoute(t){
const{x,z}=getCoordinates(t);
if(xInWaterline(t))return"水鉄水山線";
if(x>=KAWATETSU_MIN_X)return"川鉄依丘線";
if(z>UKYU_MIN_Z)return"雨急雨波線";
if(z<YANODEN_MAX_Z)return"矢野電鉄";
return"波急波川線"}

function getTrainType(t){
const g=normalizeTags(t),{z}=getCoordinates(t);
if(g.includes("ltd"))return{key:"ltd",name:"特急",label:"特",color:"#f97316"};
if(g.includes("exp"))return{key:"exp",name:"急行",label:"急",color:"#dc2626"};
if(g.includes("sexp")){
if(z<-18||z>6131)return{key:"sexp-local",name:"各駅停車",label:"各",color:"#2878c8",downgradedFromSemiExpress:true};
return{key:"sexp",name:"準急",label:"準",color:"#16a34a"}}
if(g.includes("local2"))return{key:"local2",name:"各駅停車",label:"各",color:"#60a5fa"};
if(g.includes("local"))return{key:"local",name:"各駅停車",label:"各",color:"#2878c8"};
if(xInWaterline(t))return{key:"waterline",name:"普通",label:"普",color:"#888888"};
return{key:"unknown",name:"その他",label:"不",color:"#222222"}}

function getTrainDirection(t){
const g=normalizeTags(t);
if(g.includes("z-"))return"z-";
if(g.includes("z+")||g.includes("z"))return"z+";
if(g.includes("x-"))return"x-";
return"x+"}

const ANGLES={"x+":0,"z+":90,"x-":180,"z-":-90},
getDirectionAngle=t=>ANGLES[getTrainDirection(t)]??0,
isPositiveDirection=t=>{const d=getTrainDirection(t);return d==="z+"||d==="x+"};

function getTrainDestination(t){
const y=getTrainType(t),p=isPositiveDirection(t);
if(y.key==="waterline")return"草市～水山 往復";
if(y.key==="local2")return p?"依丘":"草市";
if(y.key==="local")return p?"波丘":"吉山";
if(y.key==="exp")return p?"依丘":"吉山";
if(y.key==="ltd")return p?"雨山":"吉山";
if(y.key==="sexp"||y.downgradedFromSemiExpress)return p?"雨山":"矢野";
return"不明"}

function getDisplaySpeed(t){
const s=Number(t?.sokudo);
if(s===59)return 120;
if(Number.isFinite(s)&&s<0)return 0;
const p=Number(t?.speed);
return!Number.isFinite(p)||p<0?0:p}

function getTrainStableId(t){
const v=t?.id??t?.uuid??t?.uniqueId??t?.unique_id??t?.entityId??t?.entity_id??null;
return v===null||v===undefined||v===""?null:String(v)}

function createTrainIdentity(t){
const p=getCoordinates(t);
return{stableId:getTrainStableId(t),x:p.x,z:p.z,tags:normalizeTags(t).slice().sort().join("|"),type:getTrainType(t).key,direction:getTrainDirection(t)}}

function findSelectedTrain(){
if(!selectedTrainIdentity||trains.length===0)return null;
const id=selectedTrainIdentity;
if(id.stableId===null)return null;
const i=trains.findIndex(t=>getTrainStableId(t)===id.stableId);
if(i===-1)return null;
const train=trains[i];
selectedTrainIdentity=createTrainIdentity(train);
return{train,index:i}}

async function loadStaff(){
try{
const r=await fetch("./staff.html",{cache:"no-store"});
if(!r.ok)throw new Error(`HTTP ${r.status}`);
const doc=new DOMParser().parseFromString(await r.text(),"text/html"),m=new Map();
doc.querySelectorAll(".staff-card").forEach(card=>{
const n=card.querySelector(".staff-name");
if(!n)return;
const name=n.textContent.trim();
if(!name)return;
const b=card.querySelector(".role-badge");
if(!b)return;
const t=b.textContent.trim();
let c="role-participant";
if(b.classList.contains("role-owner"))c="role-owner";
else if(b.classList.contains("role-developer"))c="role-developer";
else if(b.classList.contains("role-moderator"))c="role-moderator";
else if(b.classList.contains("role-leave"))c="role-participant";
else if(t.includes("オーナー"))c="role-owner";
else if(t.includes("デベロッパー"))c="role-developer";
else if(t.includes("モデレーター"))c="role-moderator";
m.set(name.toLowerCase(),{label:t||"運営",className:c})});
staffMap=m
}catch(e){console.warn("スタッフ情報の取得に失敗:",e)}}

const getPlayerRoleInfo=p=>staffMap.get(getName(p).toLowerCase())||{label:"参加者",className:"role-participant"};

function extractDataLists(d){
const r=d?.data??d?.status??d??{};
players=normalizeCollection(r.players??r.player??r.onlinePlayers??[]);
trains=normalizeCollection(r.trains??r.train??r.carts??[]);
return r}

const worldToMap=e=>{const p=getCoordinates(e);return{x:p.x,y:p.z}};

function fitViewToData(){
const size=getMapSize(),pts=[];
players.forEach(p=>pts.push(worldToMap(p)));
trains.forEach(t=>pts.push(worldToMap(t)));
if(pts.length===0){
view.w=10000;view.h=view.w/size.aspect;view.x=-view.w/2;view.y=-view.h/2;
applyView();return}
const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),
minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),
cx=(minX+maxX)/2,cy=(minY+maxY)/2,dw=Math.max(0,maxX-minX),dh=Math.max(0,maxY-minY),
pad=Math.max(1000,Math.max(dw,dh)*.12);
let w=dw+pad*2;const h=dh+pad*2;
w=Math.max(w,h*size.aspect);
w=clamp(w,MIN_VIEW_WIDTH,MAX_VIEW_WIDTH);
view.w=w;view.h=w/size.aspect;view.x=cx-view.w/2;view.y=cy-view.h/2;
applyView()}

function renderGrid(){
const l=view.x,r=l+view.w,t=view.y,b=t+view.h,paths=[],
fx=Math.floor(l/GRID_SIZE),lx=Math.ceil(r/GRID_SIZE),fz=Math.floor(t/GRID_SIZE),lz=Math.ceil(b/GRID_SIZE);
for(let i=fx;i<=lx;i++){paths.push(`M ${i*GRID_SIZE} ${t} V ${b}`)}
for(let i=fz;i<=lz;i++){paths.push(`M ${l} ${i*GRID_SIZE} H ${r}`)}
gridLayer.innerHTML=`<path class="grid-line" d="${paths.join(" ")}" fill="none"/>`}

function applyView(renderMarkers=true){
view.h=view.w/getMapSize().aspect;
map.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`);
renderGrid();
if(renderMarkers&&latestData)renderMarkersNow()}

function makeTrainMarker(train,index,scale){
const pos=worldToMap(train),type=getTrainType(train),angle=getDirectionAngle(train),
half=15*scale,tip=half+17*scale,
path=`M ${-half} ${-half} L ${half} ${-half} L ${tip} 0 L ${half} ${half} L ${-half} ${half} Z`;
return`<g class="train-marker" data-kind="train" data-index="${index}" tabindex="0" role="button" aria-label="${escapeHtml(type.name)}" transform="translate(${pos.x} ${pos.y})"><g class="train-body" transform="rotate(${angle})"><path class="train-hit-area" d="${path}" stroke-width="${14*scale}"/><path class="train-visual" d="${path}" fill="${type.color}" stroke="#ffffff" stroke-width="${1.2*scale}" stroke-linejoin="round" stroke-linecap="round"/></g><text class="train-label" x="0" y="0" font-size="${17*scale}">${escapeHtml(type.label)}</text></g>`}

function makePlayerMarker(player,index,scale){
const pos=worldToMap(player),name=getName(player),
faceSize=22*scale,labelSize=12*scale,
labelWidth=Math.max(25,name.length*12*.95)*scale,labelHeight=17*scale,labelY=faceSize*.65,
hitRadius=Math.max(faceSize,labelWidth/2,labelHeight)+5*scale;
return`<g class="player-marker" data-kind="player" data-index="${index}" tabindex="0" role="button" aria-label="${escapeHtml(name)}" transform="translate(${pos.x} ${pos.y})"><circle cx="0" cy="${labelY/2}" r="${hitRadius}" fill="transparent" pointer-events="all"/><image class="player-face" href="${faceUrl(name)}" x="${-faceSize/2}" y="${-faceSize/2}" width="${faceSize}" height="${faceSize}" preserveAspectRatio="none" pointer-events="none"/><rect x="${-labelWidth/2}" y="${labelY}" width="${labelWidth}" height="${labelHeight}" rx="${4*scale}" fill="#ffffff" fill-opacity=".92" stroke="#dce5ed" stroke-width="${.7*scale}" pointer-events="none"/><text class="player-name-label" x="0" y="${labelY+labelHeight/2}" font-size="${labelSize}" pointer-events="none">${escapeHtml(name)}</text></g>`}

function handleMarkerOpen(el){
if(!el)return;
const i=Number(el.getAttribute("data-index")),k=el.getAttribute("data-kind");
if(!Number.isInteger(i)||i<0)return;
if(k==="player"){const p=players[i];if(p)showPlayerDetail(p);return}
if(k==="train"){const t=trains[i];if(t)showTrainDetail(t,i)}}

function findMarkerFromEvent(ev){
if(typeof ev.composedPath==="function")
for(const n of ev.composedPath())if(n instanceof Element&&n.matches("[data-kind][data-index]"))return n;
let n=ev.target;
while(n&&n!==map){if(n instanceof Element&&n.matches("[data-kind][data-index]"))return n;n=n.parentElement}
return null}

function attachMarkerEvents(){
markerLayer.querySelectorAll("[data-kind][data-index]").forEach(m=>{
m.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();if(dragMoved)return;handleMarkerOpen(m)});
m.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;e.preventDefault();e.stopPropagation();handleMarkerOpen(m)})})}

function renderMarkersNow(){
if(!latestData)return;
const s=getScale();
markerLayer.innerHTML=trains.map((t,i)=>makeTrainMarker(t,i,s)).join("")+players.map((p,i)=>makePlayerMarker(p,i,s)).join("");
attachMarkerEvents();
renderPlayerList()}

function renderPlayerList(){
playerPanelCount.textContent=String(players.length);
if(players.length===0){playerList.innerHTML='<div class="player-empty">現在オンラインのプレイヤーはいません</div>';return}
playerList.innerHTML=players.map((p,i)=>{
const n=getName(p),r=getPlayerRoleInfo(p),e=escapeHtml(n);
return`<button class="player-row" type="button" data-player-index="${i}" aria-label="${e}の詳細を表示"><img src="${faceUrl(n)}" alt="" loading="lazy"><span class="player-row-info"><span class="player-row-name">${e}</span><span class="player-role-badge ${r.className}">${escapeHtml(r.label)}</span></span></button>`}).join("")}

function openModal(){
const was=detailModal.classList.contains("open");
detailModal.classList.add("open");
document.body.style.overflow="hidden";
if(!was)$("closeModal").focus()}

function closeModal(){
detailModal.classList.remove("open");
document.body.style.overflow="";
selectedEntityKey=null;selectedTrainIdentity=null}

function showPlayerDetail(player){
const name=getName(player),role=getPlayerRoleInfo(player),pos=getCoordinates(player);
selectedEntityKey=`player:${name}`;selectedTrainIdentity=null;
modalTitle.textContent="プレイヤー情報";
modalContent.innerHTML=`<div class="detail-player"><img src="${faceUrl(name)}" alt=""><div><div class="detail-player-name">${escapeHtml(name)}</div><div class="player-role-badge detail-player-role ${role.className}">${escapeHtml(role.label)}</div></div></div><div class="detail-grid"><div class="detail-item"><div class="detail-label">X座標</div><div class="detail-value">${formatNumber(pos.x,2)}</div></div><div class="detail-item"><div class="detail-label">Z座標</div><div class="detail-value">${formatNumber(pos.z,2)}</div></div></div><div class="detail-note">在線情報は自動更新されます。</div>`;
openModal()}

function showTrainDetail(train){
const type=getTrainType(train),dest=getTrainDestination(train),dir=getTrainDirection(train),pos=getCoordinates(train),
names={"x+":"東方向（X＋）","x-":"西方向（X−）","z+":"南方向（Z＋）","z-":"北方向（Z−）"},
item=(l,v)=>`<div class="detail-item"><div class="detail-label">${l}</div><div class="detail-value">${v}</div></div>`;
selectedEntityKey="train";selectedTrainIdentity=createTrainIdentity(train);
modalTitle.textContent="列車情報";
modalContent.innerHTML=`<div class="train-summary" style="border-color:${type.color}"><span class="train-type" style="background:${type.color}">${escapeHtml(type.name)}</span><span class="train-destination">${escapeHtml(dest)} 行</span></div><div class="detail-grid">${item("種別",escapeHtml(type.name))}${item("行先",escapeHtml(dest))}${item("路線",escapeHtml(getTrainRoute(train)))}${item("速度",formatNumber(getDisplaySpeed(train),0)+" km/h")}${item("進行方向",escapeHtml(names[dir]||"不明"))}${item("X座標",formatNumber(pos.x,2))}${item("Z座標",formatNumber(pos.z,2))}</div><div class="detail-note">在線情報は自動更新されます。</div>`;
openModal()}

function refreshSelectedDetail(){
if(!detailModal.classList.contains("open")||!selectedEntityKey)return;
if(selectedEntityKey.startsWith("player:")){
const name=selectedEntityKey.slice(7),p=players.find(i=>getName(i)===name);
if(p)showPlayerDetail(p);
else{modalTitle.textContent="プレイヤー情報";modalContent.innerHTML='<div class="player-empty">このプレイヤーは現在オンラインではありません。</div>'}
return}
if(selectedEntityKey==="train"){
const r=findSelectedTrain();
if(r)showTrainDetail(r.train,r.index);
else{modalTitle.textContent="列車情報";modalContent.innerHTML='<div class="player-empty">選択中の列車を確認しています。<br>次回の更新で再検索します。</div>'}}}

playerList.addEventListener("click",ev=>{
const el=ev.target instanceof Element?ev.target:ev.target?.parentElement,
b=el?.closest("[data-player-index]");
if(!b||!playerList.contains(b))return;
const p=players[Number(b.dataset.playerIndex)];
if(p)showPlayerDetail(p)});

function updateStatus(r){
const wt=r.worldTime??r.time??r.world_time??"--",
w=r.weather??r.worldWeather??r.world_weather??"--",
tps=r.tps??r.TPS??"--";
worldTimeText.textContent=`ワールド時刻：${wt}`;
weatherText.textContent=`天候：${w}`;
tpsText.textContent=`TPS：${formatNumber(tps,1)}`;
playerCountText.textContent=String(players.length);
trainCountText.textContent=`列車：${trains.length}編成`;
lastUpdated.textContent=`最終更新：${new Date().toLocaleTimeString("ja-JP",{hour12:false})}`}

function setOnline(){connectionDot.classList.remove("offline");connectionDot.classList.add("online");connectionText.textContent="サーバー接続中"}
function setOffline(){connectionDot.classList.remove("online");connectionDot.classList.add("offline");connectionText.textContent="サーバーに接続できません"}

async function fetchStatus(){
if(isFetching)return;
isFetching=true;
try{
const res=await fetch(API_URL,{method:"GET",mode:"cors",cache:"no-store"});
if(!res.ok)throw new Error(`HTTP ${res.status}`);
const data=await res.json();
if(data&&data.success===false)throw new Error(data.error||"API error");
latestData=data;
const root=extractDataLists(data);
updateStatus(root);
setOnline();
lastSuccessfulFetch=Date.now();
if(map.dataset.initialized!=="true"){fitViewToData();map.dataset.initialized="true"}
else renderMarkersNow();
refreshSelectedDetail()
}catch(e){console.error("在線データ取得エラー:",e);setOffline()}
finally{isFetching=false}}

function startRefresh(){
if(refreshTimer!==null)clearTimeout(refreshTimer);
refreshTimer=setTimeout(async()=>{await fetchStatus();startRefresh()},REFRESH_MS)}

function refreshNow(){
if(refreshTimer!==null){clearTimeout(refreshTimer);refreshTimer=null}
fetchStatus().finally(startRefresh)}

document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshNow()});
window.addEventListener("focus",refreshNow);
window.addEventListener("online",refreshNow);
window.addEventListener("pagehide",()=>{if(refreshTimer!==null){clearTimeout(refreshTimer);refreshTimer=null}});

function zoomAt(f,cx,cy){
const r=map.getBoundingClientRect();
if(r.width<=0||r.height<=0)return;
const px=(cx-r.left)/r.width,py=(cy-r.top)/r.height,
wx=view.x+px*view.w,wy=view.y+py*view.h,
nw=clamp(view.w*f,MIN_VIEW_WIDTH,MAX_VIEW_WIDTH),nh=nw/getMapSize().aspect;
view.x=wx-px*nw;view.y=wy-py*nh;view.w=nw;view.h=nh;
applyView(true)}

function zoomCenter(f){const r=map.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}

$("zoomIn").addEventListener("click",()=>zoomCenter(.75));
$("zoomOut").addEventListener("click",()=>zoomCenter(1.33));
$("resetView").addEventListener("click",fitViewToData);

map.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY<0?.9:1.1,e.clientX,e.clientY)},{passive:false});

map.addEventListener("pointerdown",e=>{
if(e.button!==0)return;
if(findMarkerFromEvent(e)){dragMoved=false;return}
const el=e.target instanceof Element?e.target:e.target?.parentElement;
if(el?.closest(".map-controls")||el?.closest(".player-panel"))return;
dragging=true;dragMoved=false;
if(dragResetTimer!==null){clearTimeout(dragResetTimer);dragResetTimer=null}
dragStart={x:e.clientX,y:e.clientY,viewX:view.x,viewY:view.y};
map.classList.add("dragging")});

window.addEventListener("pointermove",e=>{
if(!dragging||!dragStart)return;
const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;
if(Math.abs(dx)+Math.abs(dy)>3)dragMoved=true;
const s=getScale();
view.x=dragStart.viewX-dx*s;view.y=dragStart.viewY-dy*s;
applyView(false)});

function stopDragging(){
if(!dragging)return;
dragging=false;dragStart=null;
map.classList.remove("dragging");
renderMarkersNow();
if(dragResetTimer!==null)clearTimeout(dragResetTimer);
dragResetTimer=setTimeout(()=>{dragMoved=false;dragResetTimer=null},150)}

window.addEventListener("pointerup",stopDragging);
window.addEventListener("pointercancel",stopDragging);

window.addEventListener("keydown",e=>{
if(detailModal.classList.contains("open")){if(e.key==="Escape")closeModal();return}
if(e.target instanceof HTMLInputElement||e.target instanceof HTMLTextAreaElement||e.target instanceof HTMLButtonElement||e.target instanceof HTMLAnchorElement)return;
const a=view.w*.08;
switch(e.key){
case"ArrowUp":e.preventDefault();view.y-=a;applyView(false);break;
case"ArrowDown":e.preventDefault();view.y+=a;applyView(false);break;
case"ArrowLeft":e.preventDefault();view.x-=a;applyView(false);break;
case"ArrowRight":e.preventDefault();view.x+=a;applyView(false);break;
case"+":case"=":e.preventDefault();zoomCenter(.75);break;
case"-":e.preventDefault();zoomCenter(1.33);break}});

$("collapsePlayers").addEventListener("click",()=>{
playerPanel.classList.toggle("collapsed");
$("collapsePlayers").textContent=playerPanel.classList.contains("collapsed")?"+":"−"});

$("closeModal").addEventListener("click",closeModal);
detailModal.addEventListener("click",e=>{if(e.target===detailModal)closeModal()});

let resizeFrame=null;
window.addEventListener("resize",()=>{
if(resizeFrame!==null)cancelAnimationFrame(resizeFrame);
resizeFrame=requestAnimationFrame(()=>{
resizeFrame=null;
view.h=view.w/getMapSize().aspect;
applyView(true)})});

setInterval(()=>{if(lastSuccessfulFetch>0&&Date.now()-lastSuccessfulFetch>10000)setOffline()},3000);

(async()=>{await loadStaff();await fetchStatus();startRefresh()})();
</script>
</body></html>
