
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>お知らせ | 波急電鉄</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="波急電鉄・波急サーバーからのお知らせ">

  <link rel="icon" href="./icon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
      color: #24364b;
      background: #eef2f7;
    }

    /* ヘッダー */
    .header {
      min-height: 120px;
      padding: 12px 3%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: linear-gradient(
        110deg,
        #075d9b,
        #087fc4 55%,
        #129bd2
      );
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .brand-title {
      margin: 0;
      color: white;
      font-size: clamp(30px, 3.5vw, 44px);
      font-weight: 800;
      white-space: nowrap;
    }

    .brand-subtitle {
      color: white;
      font-size: 13px;
      letter-spacing: 0.2em;
    }

    /* ナビゲーション */
    .navigation {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .navigation a {
      padding: 15px 12px;
      color: white;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 7px;
      background: rgba(255,255,255,0.12);
    }

    .navigation a:hover {
      background: rgba(255,255,255,0.28);
    }

    /* メイン */
    .main {
      width: min(100% - 40px, 1000px);
      margin: 50px auto;
    }

    .page-title {
      margin: 0;
      color: #075d9b;
      font-size: 36px;
      font-weight: 800;
    }

    .page-subtitle {
      margin-top: 8px;
      color: #64748b;
      font-size: 14px;
      letter-spacing: 0.12em;
    }

    .title-line {
      width: 80px;
      height: 5px;
      margin: 20px 0 35px;
      border-radius: 10px;
      background: #087fc4;
    }

    /* お知らせ一覧 */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .news-item {
      padding: 24px 28px;
      border-left: 5px solid #087fc4;
      border-radius: 8px;
      background: white;
      box-shadow: 0 3px 12px rgba(20,43,73,0.07);
    }

    .news-date {
      color: #64748b;
      font-size: 14px;
      font-weight: 600;
    }

    .news-category {
      display: inline-block;
      margin-left: 10px;
      padding: 4px 10px;
      color: white;
      font-size: 12px;
      font-weight: bold;
      border-radius: 20px;
      background: #087fc4;
    }

    .news-heading {
      margin: 12px 0 8px;
      color: #142b49;
      font-size: 21px;
    }

    .news-description {
      margin: 0;
      color: #52647a;
      font-size: 15px;
      line-height: 1.8;
    }

    .empty {
      padding: 40px 20px;
      color: #64748b;
      text-align: center;
      border-radius: 8px;
      background: white;
    }

    @media (max-width: 750px) {
      .header {
        flex-direction: column;
        gap: 15px;
        padding: 15px 10px;
      }

      .logo {
        width: 55px;
        height: 55px;
      }

      .brand-title {
        font-size: 27px;
      }

      .brand-subtitle {
        font-size: 9px;
      }

      .navigation {
        width: 100%;
        flex-wrap: wrap;
        gap: 5px;
      }

      .navigation a {
        padding: 10px 8px;
        font-size: 12px;
      }

      .main {
        width: calc(100% - 28px);
        margin: 30px auto;
      }

      .page-title {
        font-size: 29px;
      }

      .news-item {
        padding: 20px;
      }

      .news-heading {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-top">
      <img class="logo" src="./icon.png" alt="波急電鉄ロゴ">

      <div>
        <h1 class="brand-title">波急サーバー</h1>
        <div class="brand-subtitle">NAMIKYU RAILWAY</div>
      </div>
    </div>

    <nav class="navigation">
      <a href="./index.html">ホーム</a>
      <a href="./news.html">お知らせ</a>
      <a href="./join.html">サーバー参加</a>
      <a href="./status.html">在線位置</a>
      <a href="./staff.html">運営メンバー</a>
    </nav>
  </header>

  <main class="main">
    <h2 class="page-title">お知らせ</h2>
    <div class="page-subtitle">NEWS</div>
    <div class="title-line"></div>

    <section class="news-list">

      <article class="news-item">
        <div class="news-date">
          2026年11月20日
          <span class="news-category">お知らせ</span>
        </div>

        <h3 class="news-heading">
          波急電鉄公式ホームページを公開しました
        </h3>

        <p class="news-description">
          波急電鉄の公式ホームページを公開しました。
          今後、運行情報やサーバーに関する情報などを掲載していきます。
        </p>
      </article>

    </section>
  </main>

</body>
</html>
