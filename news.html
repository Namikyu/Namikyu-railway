
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>お知らせ | 波急電鉄</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="波急電鉄からのお知らせ">

  <link rel="icon" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
      color: #24364b;
      background: #eef2f7;
    }

    /* =========================
       ヘッダー：ホーム画面と共通
    ========================= */

    .header {
      width: 100%;
      height: 120px;
      min-height: 120px;
      max-height: 120px;
      padding: 8px 3%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      overflow: hidden;

      background: linear-gradient(
        110deg,
        #075d9b 0%,
        #087fc4 55%,
        #129bd2 100%
      );
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex: 0 1 42%;
      min-width: 0;
      margin: 0;
    }

    .logo {
      display: block;
      width: 80px;
      height: 80px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      color: white;
      font-size: clamp(30px, 3.5vw, 44px);
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1.15;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin-top: 5px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2em;
      white-space: nowrap;
    }

    .navigation {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1 1 58%;
      min-width: 0;
      gap: 9px;
      margin: 0;
    }

    .navigation a {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1 1 0;
      min-width: 0;
      height: 52px;
      padding: 8px 7px;
      color: white;
      text-decoration: none;
      font-size: clamp(11px, 1.1vw, 15px);
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.12);
      transition: background 0.2s;
    }

    .navigation a:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* =========================
       お知らせページ
    ========================= */

    .main {
      width: min(100% - 40px, 1000px);
      margin: 45px auto 70px;
    }

    .page-title {
      margin: 0;
      color: #075d9b;
      font-size: 36px;
      font-weight: 800;
    }

    .page-subtitle {
      margin-top: 8px;
      color: #64748b;
      font-size: 14px;
      letter-spacing: 0.12em;
    }

    .title-line {
      width: 80px;
      height: 5px;
      margin: 20px 0 35px;
      border-radius: 10px;
      background: #087fc4;
    }

    /* お知らせ一覧 */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .news-item {
      padding: 24px 28px;
      border-left: 5px solid #087fc4;
      border-radius: 8px;
      background: white;
      box-shadow: 0 3px 12px rgba(20, 43, 73, 0.07);
    }

    .news-information {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .news-date {
      color: #64748b;
      font-size: 14px;
      font-weight: 600;
    }

    .news-category {
      display: inline-block;
      padding: 4px 10px;
      color: white;
      font-size: 12px;
      font-weight: bold;
      border-radius: 20px;
      background: #087fc4;
    }

    .news-heading {
      margin: 13px 0 8px;
      color: #142b49;
      font-size: 21px;
      font-weight: 800;
      line-height: 1.5;
    }

    .news-description {
      margin: 0;
      color: #52647a;
      font-size: 15px;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 45px 20px;
      color: #64748b;
      text-align: center;
      border-radius: 8px;
      background: white;
    }

    /* =========================
       スマートフォン
    ========================= */

    @media (max-width: 650px) {
      .header {
        height: 150px;
        min-height: 150px;
        max-height: 150px;
        flex-basis: 150px;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        padding: 6px 2%;
      }

      .header-top {
        flex: 0 0 auto;
        gap: 8px;
      }

      .logo {
        width: 48px;
        height: 48px;
      }

      .brand-title {
        font-size: 25px;
      }

      .brand-subtitle {
        font-size: 9px;
      }

      .navigation {
        width: 100%;
        flex: 0 0 auto;
        gap: 5px;
      }

      .navigation a {
        height: 42px;
        padding: 5px 3px;
        font-size: 10px;
      }

      .main {
        width: calc(100% - 28px);
        margin: 30px auto 45px;
      }

      .page-title {
        font-size: 29px;
      }

      .news-item {
        padding: 20px;
      }

      .news-heading {
        font-size: 18px;
      }

      .news-description {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header class="header">

    <div class="header-top">
      <img
        class="logo"
        src="./icon.png"
        alt="波急電鉄ロゴ"
      >

      <div class="brand-text">
        <h1 class="brand-title">波急サーバー</h1>
        <div class="brand-subtitle">NAMIKYU RAILWAY</div>
      </div>
    </div>

    <nav class="navigation">
      <a href="./index.html">ホーム</a>
      <a href="./news.html">お知らせ</a>
      <a href="./join.html">サーバー参加</a>
      <a href="./status.html">在線位置</a>
      <a href="./staff.html">運営メンバー</a>
    </nav>

  </header>

  <!-- メインコンテンツ -->
  <main class="main">

    <h2 class="page-title">お知らせ</h2>
    <div class="page-subtitle">NEWS</div>
    <div class="title-line"></div>

    <section
      class="news-list"
      id="newsList"
      aria-label="お知らせ一覧"
    ></section>

  </main>

  <script>
    /*
      ====================================
      お知らせ設定

      新しいお知らせは、この配列の先頭に追加してください。

      date     : 日付
      category : カテゴリー
      title    : タイトル
      content  : 本文

      ====================================
    */

    const newsData = [

      {
        date: "2026年11月20日",
        category: "お知らせ",
        title: "新波急ホームページの製作を開始いたしました。",
        content:
          "本日旧サイト管理者のかえる重工氏退職に伴い、当新サイトの製作・掲載を開始しました。\n 今後のホームページはこちらへ完全移行いたします。改めて新サイトよろしくお願いします。"
      },
      {
        date: "2026年11月17日",
        category: "お知らせ",
        title: "運営メンバーの一部脱退と休職について",
        content:
          "前回のお知らせで記載している通り波急サーバーの運営方針改革により、一部の運営メンバーの体制を変更することになりました。\n退職・脱退:ryoryokun120,hitachi expless,kaerusunrise\n休職:rossiyuki66\n今後ともよろしくお願いします。"
      },
            {
        date: "2026年11月17日",
        category: "お知らせ",
        title: "運営メンバーの再構築と運営方針改革について",
        content:
          "以前から度々問題となっていた波急の運営方針ついてですが、運営の一部再編や\n新運営ガイドラインの制定等で対策をいたしました。ご迷惑をおかけし申し訳ございませんでした。今後の運営に努めて参ります。"
      }

      // 新しいお知らせは、この下ではなく上に追加すると便利です。

    ];

    /*
      ====================================
      お知らせ表示処理
      ====================================
    */

    const newsList = document.getElementById("newsList");

    function displayNews() {

      newsList.replaceChildren();

      if (newsData.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "現在、お知らせはありません。";
        newsList.appendChild(empty);
        return;
      }

      newsData.forEach((news) => {

        const article = document.createElement("article");
        article.className = "news-item";

        const information = document.createElement("div");
        information.className = "news-information";

        const date = document.createElement("span");
        date.className = "news-date";
        date.textContent = news.date;

        const category = document.createElement("span");
        category.className = "news-category";
        category.textContent = news.category;

        const heading = document.createElement("h3");
        heading.className = "news-heading";
        heading.textContent = news.title;

        const description = document.createElement("p");
        description.className = "news-description";
        description.textContent = news.content;

        information.appendChild(date);
        information.appendChild(category);

        article.appendChild(information);
        article.appendChild(heading);
        article.appendChild(description);

        newsList.appendChild(article);

      });

    }

    displayNews();
  </script>

</body>
</html>
