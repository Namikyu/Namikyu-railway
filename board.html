
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142B49">
<link rel="icon" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<title>掲示板 | 波急公式サイト</title>
<style>
:root{color-scheme:light;--bg:#eef2f7;--panel:#fff;--side:#142b49;--text:#172b45;--sub:#718096;--border:#dce3ec;--blue:#2878c8;--input:#f5f7fa}
:root[data-theme=dark]{color-scheme:dark;--bg:#101923;--panel:#192635;--side:#101d2d;--text:#e8eef6;--sub:#9baabd;--border:#304052;--blue:#58a5ef;--input:#243446}
*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}
.app{display:flex;width:100%;height:100vh}.sidebar{width:270px;min-width:270px;background:var(--side);color:white;display:flex;flex-direction:column;padding:20px 14px;z-index:10}
.brand{display:flex;align-items:center;gap:11px;padding:5px 8px 22px;border-bottom:1px solid #ffffff29}.brand img{width:42px;height:42px;object-fit:contain}
.brand-name{font-size:19px;font-weight:bold}.brand-sub{font-size:11px;opacity:.7;margin-top:3px}
.category-title{margin:24px 8px 9px;font-size:12px;font-weight:bold;opacity:.7}.channel-list{display:flex;flex-direction:column;gap:5px}
.channel{padding:11px 12px;border:0;border-radius:7px;background:transparent;color:inherit;text-align:left}.channel:hover{background:#ffffff1a}.channel.active{background:#2878c8;font-weight:bold}
.sidebar-bottom{margin-top:auto;border-top:1px solid #ffffff29;padding:15px 8px 0}.user-area{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;min-width:38px;border-radius:50%;background:#2878c8;display:grid;place-items:center;color:white;font-weight:bold;overflow:hidden}
.avatar img,.post-avatar img{width:100%;height:100%;object-fit:cover}.user-info{min-width:0}.user-name{font-size:13px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-role{font-size:11px;opacity:.7;margin-top:3px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:68px;min-height:68px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px}
.menu-button{display:none;border:0;background:transparent;color:var(--text);font-size:23px}.page-title{font-size:18px;font-weight:bold}.topbar-right{margin-left:auto;display:flex;gap:8px}
.top-button{font-size:12px;color:var(--text);padding:8px 11px;border:1px solid var(--border);border-radius:20px;background:var(--input)}
.content{flex:1;min-height:0;display:flex;flex-direction:column}.channel-header{background:var(--panel);border-bottom:1px solid var(--border);padding:20px 26px}
.channel-heading{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:bold}.channel-description{margin-top:7px;font-size:13px;color:var(--sub)}
.messages{flex:1;overflow-y:auto;padding:25px}.empty{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--sub)}
.empty-icon{font-size:48px;margin-bottom:15px}.empty-title{font-size:18px;font-weight:bold;color:var(--text);margin-bottom:8px}
.post{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:17px;margin-bottom:15px}.post-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.post-avatar{width:34px;height:34px;min-width:34px;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;font-weight:bold;overflow:hidden}
.post-author{font-size:14px;font-weight:bold}.post-role{font-size:11px;color:var(--blue)}.post-date{font-size:11px;color:var(--sub);margin-left:auto}
.post-content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;margin:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}
.small-button{border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:6px;padding:6px 10px;font-size:12px}
.reply-list{border-top:1px solid var(--border);margin-top:13px;padding-top:10px}.reply{padding:9px 0;font-size:13px;line-height:1.7;border-bottom:1px solid var(--border)}
.reply-author{font-weight:bold}.reply-date{font-size:10px;color:var(--sub);margin-left:7px}.reply-form{display:flex;gap:7px;margin-top:10px}
.reply-form input{flex:1;min-width:0;padding:9px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--text)}
.composer-area{padding:15px 24px 22px;background:var(--panel);border-top:1px solid var(--border)}.composer-notice{font-size:12px;color:var(--sub);margin-bottom:10px}
.composer{display:flex;align-items:center;gap:10px;background:var(--input);border:1px solid var(--border);border-radius:9px;padding:10px 13px}
.composer textarea{flex:1;min-width:0;resize:none;max-height:110px;min-height:25px;border:0;outline:none;background:transparent;color:var(--text);font-size:14px}
.send-button{border:0;border-radius:7px;padding:9px 16px;background:var(--blue);color:white;font-weight:bold}
.modal{display:none;position:fixed;inset:0;z-index:100;background:#0009;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}
.modal-box{background:var(--panel);color:var(--text);width:100%;max-width:430px;max-height:90vh;overflow-y:auto;padding:25px;border-radius:14px}
.modal-box h2{margin:0 0 8px}.auth-description{font-size:13px;color:var(--sub);margin:0 0 20px;line-height:1.6}
.auth-label{display:block;font-size:13px;font-weight:bold;margin-bottom:14px}.auth-input{display:block;width:100%;padding:12px;margin-top:7px;border:1px solid var(--border);border-radius:7px;background:var(--input);color:var(--text)}
.auth-primary,.auth-google,.auth-close{width:100%;padding:12px;border-radius:7px}.auth-primary{background:#2878c8;color:white;border:0;font-weight:bold}
.auth-google{margin-top:10px;background:var(--input);color:var(--text);border:1px solid var(--border)}.auth-close{margin-top:8px;background:var(--input);color:var(--text);border:0}
.auth-error{color:#e34e58;font-size:13px;overflow-wrap:anywhere;line-height:1.7;white-space:pre-wrap}.auth-link{display:block;background:none;border:0;color:var(--blue);padding:12px 0}
.profile-preview{width:82px;height:82px;border-radius:50%;overflow:hidden;background:var(--blue);color:white;display:grid;place-items:center;font-size:30px;margin:8px auto 16px}
.profile-preview img{width:100%;height:100%;object-fit:cover}.overlay{display:none}
@media(max-width:700px){.sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s;width:280px}.sidebar.open{transform:translateX(0)}
.overlay.show{display:block;position:fixed;inset:0;background:#0007;z-index:5}.menu-button{display:block}.topbar{padding:0 12px}.channel-header{padding:17px}.messages{padding:13px}.composer-area{padding:12px}.top-button{font-size:11px;padding:7px 8px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><img src="./icon.png" alt="波急"><div><div class="brand-name">波急掲示板</div><div class="brand-sub">NAMIKYU COMMUNITY</div></div></div>
 <div class="category-title">掲示板カテゴリ</div>
 <div class="channel-list">
  <button class="channel active" data-channel="announcement" onclick="selectChannel('announcement')">📢 運営お知らせ</button>
  <button class="channel" data-channel="chat" onclick="selectChannel('chat')">💬 チャット</button>
 </div>
 <div class="sidebar-bottom"><div class="user-area"><div class="avatar" id="user-avatar">?</div><div class="user-info"><div class="user-name" id="user-name">未ログイン</div><div class="user-role" id="user-role">未ログイン</div></div></div></div>
</aside>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<main class="main">
 <header class="topbar"><button class="menu-button" onclick="toggleSidebar()">☰</button><div class="page-title">掲示板</div>
  <div class="topbar-right">
   <button class="top-button" id="theme-button" onclick="toggleTheme()">🌙 ダーク</button>
   <button class="top-button" id="profile-button" style="display:none" onclick="openProfile()">プロフィール</button>
   <button class="top-button" id="login-button" onclick="openLogin()">ログイン</button>
  </div>
 </header>
 <section class="content">
  <div class="channel-header"><div class="channel-heading"><span id="channel-icon">📢</span><span id="channel-name">運営お知らせ</span></div><div class="channel-description" id="channel-description">波急運営からのお知らせを掲載します。</div></div>
  <div class="messages" id="messages"><div class="empty"><div class="empty-icon">📭</div><div class="empty-title">ログインしてください</div></div></div>
  <div class="composer-area"><div class="composer-notice" id="composer-notice">投稿にはログインが必要です。</div>
   <div class="composer" id="composer"><textarea id="post-input" maxlength="5000" rows="1" placeholder="メッセージを入力..."></textarea><button class="send-button" id="send-button" onclick="sendPost()">送信</button></div>
  </div>
 </section>
</main>
</div>

<div class="modal" id="login-modal"><div class="modal-box">
 <h2 id="login-title">ログイン</h2><p class="auth-description" id="auth-description">登録済みのアカウントでログインします。</p>
 <label class="auth-label" id="name-label" style="display:none">表示名<input id="display-name" class="auth-input" maxlength="30" placeholder="掲示板で使う名前"></label>
 <label class="auth-label">メールアドレス<input id="email" class="auth-input" type="email" autocomplete="email"></label>
 <label class="auth-label">パスワード<input id="password" class="auth-input" type="password" autocomplete="current-password"></label>
 <button class="auth-primary" id="email-action-button" onclick="emailAction()">ログイン</button>
 <button class="auth-google" id="google-button" onclick="googleSignup()">Googleで新規登録</button>
 <button class="auth-google" id="google-setup-button" onclick="setupGooglePassword()">既存Googleアカウントの初回パスワード設定</button>
 <p class="auth-error" id="login-error"></p>
 <button class="auth-link" id="mode-button" onclick="toggleAuthMode()">新規登録はこちら</button>
 <button class="auth-close" onclick="closeLogin()">閉じる</button>
</div></div>

<div class="modal" id="profile-modal"><div class="modal-box">
 <h2>プロフィール設定</h2><p class="auth-description">表示名とアイコン画像を変更できます。</p>
 <div class="profile-preview" id="profile-preview">?</div>
 <label class="auth-label">アイコン画像<input class="auth-input" id="photo-file" type="file" accept="image/*"></label>
 <label class="auth-label">表示名<input class="auth-input" id="profile-name" maxlength="30" placeholder="表示名"></label>
 <p class="auth-error" id="profile-error"></p>
 <button class="auth-primary" id="profile-save" onclick="saveProfile()">変更を保存</button>
 <button class="auth-close" onclick="closeProfile()">閉じる</button>
</div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,browserLocalPersistence,setPersistence,createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,onAuthStateChanged,signOut,EmailAuthProvider,linkWithCredential,getAdditionalUserInfo,getIdTokenResult}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import{getFirestore,collection,addDoc,onSnapshot,doc,updateDoc,deleteDoc,getDocs,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyAw45Gj7Hl9mwOT-Tb1HL7VYxhkD2RDmZQ",
 authDomain:"namikyu-board.firebaseapp.com",
 projectId:"namikyu-board",
 storageBucket:"namikyu-board.firebasestorage.app",
 messagingSenderId:"597333464774",
 appId:"1:597333464774:web:773305ab5ad97b55d2a9c7",
 measurementId:"G-5EFRPTWRMJ"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});
const OWNER_UID="kv2lmeIrYrN3J7T4GWTaJau7MtY2";
const $=id=>document.getElementById(id);
let authMode="login",currentChannel=localStorage.getItem("board-channel")||"announcement";
let currentUser=null,currentProfile={},unsubscribePosts=null,cachedPosts=[],authFlow=false,newPhoto="";
const settings={
 announcement:{name:"運営お知らせ",icon:"📢",description:"波急運営からのお知らせを掲載します。"},
 chat:{name:"チャット",icon:"💬",description:"メンバー同士で自由に交流できる場所です。"}
};
const isOwner=()=>currentUser?.uid===OWNER_UID;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safePhoto=s=>typeof s==="string"&&s.startsWith("data:image/jpeg;base64,")?s:"";
const displayName=()=>currentProfile.displayName||currentUser?.displayName||currentUser?.email?.split("@")[0]||"メンバー";
const dateText=v=>v?.toDate?v.toDate().toLocaleString("ja-JP"):"送信直後";

function avatarHTML(name,photo,cls="post-avatar"){
 return `<div class="${cls}">${safePhoto(photo)?`<img src="${safePhoto(photo)}" alt="">`:esc(Array.from(name||"?")[0])}</div>`;
}
function applyTheme(){
 let t=localStorage.getItem("board-theme")||"light";
 document.documentElement.dataset.theme=t;
 $("theme-button").textContent=t==="dark"?"☀️ ホワイト":"🌙 ダーク";
}
function toggleTheme(){
 localStorage.setItem("board-theme",document.documentElement.dataset.theme==="dark"?"light":"dark");
 applyTheme();
}
function selectChannel(c){
 if(!settings[c])return;
 currentChannel=c;localStorage.setItem("board-channel",c);
 $("channel-name").textContent=settings[c].name;$("channel-icon").textContent=settings[c].icon;
 $("channel-description").textContent=settings[c].description;
 document.querySelectorAll(".channel").forEach(b=>b.classList.toggle("active",b.dataset.channel===c));
 updateComposer();renderPosts();closeSidebar();
}
function toggleSidebar(){$("sidebar").classList.toggle("open");$("overlay").classList.toggle("show")}
function closeSidebar(){$("sidebar").classList.remove("open");$("overlay").classList.remove("show")}
function openLogin(){
 if(currentUser){logout();return}
 $("login-modal").classList.add("open");$("login-error").textContent="";
}
function closeLogin(){$("login-modal").classList.remove("open")}
function toggleAuthMode(){authMode=authMode==="login"?"signup":"login";updateAuthMode()}
function updateAuthMode(){
 const s=authMode==="signup";
 $("login-title").textContent=s?"新規登録":"ログイン";
 $("auth-description").textContent=s?"メールまたはGoogleで新規登録できます。":"メールアドレスとパスワードでログインします。";
 $("email-action-button").textContent=s?"メールで新規登録":"ログイン";
 $("google-button").style.display=s?"block":"none";
 $("google-setup-button").style.display=s?"block":"none";
 $("mode-button").textContent=s?"ログインはこちら":"新規登録はこちら";
 $("name-label").style.display=s?"block":"none";
 $("password").autocomplete=s?"new-password":"current-password";
 $("login-error").textContent="";
}
function showError(e){
 const messages={
 "auth/invalid-email":"メールアドレスの形式が正しくありません。",
 "auth/email-already-in-use":"このメールアドレスは登録済みです。",
 "auth/weak-password":"パスワードは6文字以上にしてください。",
 "auth/invalid-credential":"メールアドレスまたはパスワードが違います。",
 "auth/account-exists-with-different-credential":"このメールアドレスは別の方法で登録済みです。",
 "auth/unauthorized-domain":"Firebaseの承認済みドメインを確認してください。",
 "auth/popup-blocked":"ブラウザでポップアップを許可してください。",
 "auth/popup-closed-by-user":"Google認証画面が閉じられました。",
 "auth/credential-already-in-use":"このメールアドレスは別のアカウントで使用されています。"
 };
 $("login-error").textContent=(messages[e.code]||e.message||"認証に失敗しました。")+"\n"+(e.code||"");
 console.error(e);
}
async function emailAction(){
 const email=$("email").value.trim(),pass=$("password").value,name=$("display-name").value.trim();
 try{
  $("login-error").textContent="";
  if(!email||!pass)throw Error("メールアドレスとパスワードを入力してください。");
  await setPersistence(auth,browserLocalPersistence);
  if(authMode==="signup"){
   if(!name)throw Error("表示名を入力してください。");
   if(pass.length<6)throw Error("パスワードは6文字以上にしてください。");
   const r=await createUserWithEmailAndPassword(auth,email,pass);
   await updateProfile(r.user,{displayName:name});
   await setDoc(doc(db,"profiles",r.user.uid),{displayName:name,photoData:"",updatedAt:serverTimestamp()});
  }else{
   await signInWithEmailAndPassword(auth,email,pass);
  }
  closeLogin();
 }catch(e){showError(e)}
}
async function googleSignup(){
 const pass=$("password").value,name=$("display-name").value.trim();
 try{
  if(!pass||pass.length<6)throw Error("パスワードを6文字以上で入力してください。");
  if(!name)throw Error("表示名を入力してください。");
  authFlow=true;await setPersistence(auth,browserLocalPersistence);
  const r=await signInWithPopup(auth,provider);
  if(!getAdditionalUserInfo(r)?.isNewUser){
   await signOut(auth);
   throw Error("このGoogleアカウントは既に登録されています。ログイン画面からメールアドレスとパスワードでログインしてください。");
  }
  await linkWithCredential(r.user,EmailAuthProvider.credential(r.user.email,pass));
  await updateProfile(r.user,{displayName:name});
  await setDoc(doc(db,"profiles",r.user.uid),{displayName:name,photoData:"",updatedAt:serverTimestamp()});
  await signOut(auth);
  await signInWithEmailAndPassword(auth,r.user.email,pass);
  closeLogin();
 }catch(e){showError(e)}
 finally{authFlow=false}
}
async function setupGooglePassword(){
 const pass=$("password").value;
 try{
  if(!pass||pass.length<6)throw Error("設定するパスワードを6文字以上で入力してください。");
  authFlow=true;await setPersistence(auth,browserLocalPersistence);
  const r=await signInWithPopup(auth,provider);
  if(r.user.providerData.some(p=>p.providerId==="password")){
   await signOut(auth);
   throw Error("このアカウントには既にパスワードが設定されています。ログイン画面からメールアドレスとパスワードでログインしてください。");
  }
  await linkWithCredential(r.user,EmailAuthProvider.credential(r.user.email,pass));
  await signOut(auth);
  $("login-error").textContent="パスワードを設定しました。ログイン画面に戻り、メールアドレスとパスワードでログインしてください。";
  authMode="login";updateAuthMode();
 }catch(e){showError(e)}
 finally{authFlow=false}
}
async function logout(){
 if(confirm("ログアウトしますか？"))await signOut(auth);
}
function updateUserArea(){
 const n=displayName(),photo=currentProfile.photoData;
 $("user-name").textContent=n;$("user-role").textContent=isOwner()?"オーナー":"メンバー";
 $("user-avatar").innerHTML=safePhoto(photo)?`<img src="${safePhoto(photo)}" alt="">`:esc(Array.from(n)[0]||"?");
 $("login-button").textContent="ログアウト";$("login-button").onclick=logout;
 $("profile-button").style.display="block";
}
function updateComposer(){
 const ok=!!currentUser&&(currentChannel==="chat"||isOwner());
 $("post-input").disabled=!ok;$("send-button").disabled=!ok;
 $("composer").style.display=ok?"flex":"none";
 $("composer-notice").textContent=!currentUser?"投稿にはログインが必要です。":
 currentChannel==="announcement"&&!isOwner()?"運営メンバーのみ投稿できます。":"Enterで送信、Shift+Enterで改行できます。";
}
function renderPosts(){
 const area=$("messages"),list=cachedPosts.filter(p=>p.data.channel===currentChannel);
 if(!currentUser){area.innerHTML='<div class="empty"><div class="empty-icon">🔒</div><div class="empty-title">ログインしてください</div></div>';return}
 if(!list.length){area.innerHTML='<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">まだ投稿はありません</div></div>';return}
 area.innerHTML=list.map(p=>{
  const d=p.data,manage=isOwner()||(d.authorUid===currentUser.uid&&d.channel==="chat");
  return `<article class="post"><div class="post-head">${avatarHTML(d.authorName,d.authorPhoto)}<span class="post-author">${esc(d.authorName)}</span><span class="post-role">${d.authorUid===OWNER_UID?"オーナー":"メンバー"}</span><span class="post-date">${dateText(d.createdAt)}</span></div><div class="post-content">${esc(d.content)}</div><div class="actions"><button class="small-button" onclick="loadReplies('${p.id}')">返信を見る</button>${manage?`<button class="small-button" onclick="editPost('${p.id}')">編集</button><button class="small-button" onclick="removePost('${p.id}')">削除</button>`:""}</div><div class="reply-list" id="replies-${p.id}"></div><div class="reply-form"><input id="reply-input-${p.id}" maxlength="3000" placeholder="返信を入力..." onkeydown="replyKey(event,'${p.id}')"><button class="small-button" onclick="sendReply('${p.id}')">返信</button></div></article>`;
 }).join("");
 list.forEach(p=>loadReplies(p.id));
}
function startPosts(){
 if(unsubscribePosts)unsubscribePosts();
 if(!currentUser){cachedPosts=[];renderPosts();return}
 unsubscribePosts=onSnapshot(collection(db,"posts"),s=>{
  cachedPosts=s.docs.map(d=>({id:d.id,data:d.data()}));
  cachedPosts.sort((a,b)=>(b.data.createdAt?.toMillis?.()||0)-(a.data.createdAt?.toMillis?.()||0));
  renderPosts();
 },e=>{$("messages").textContent="読み込みエラー："+e.message});
}
async function sendPost(){
 const input=$("post-input"),content=input.value.trim();
 if(!content||!currentUser)return;
 if(currentChannel==="announcement"&&!isOwner())return alert("運営メンバーのみ投稿できます。");
 try{
  await addDoc(collection(db,"posts"),{
   channel:currentChannel,content,authorUid:currentUser.uid,authorName:displayName(),
   authorPhoto:currentProfile.photoData||"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()
  });
  input.value="";
 }catch(e){alert("投稿できません："+e.message)}
}
async function loadReplies(id){
 const area=$("replies-"+id);if(!area||!currentUser)return;
 try{
  const s=await getDocs(collection(db,"posts",id,"replies"));
  area.innerHTML=s.docs.map(r=>{
   const d=r.data(),can=isOwner()||d.authorUid===currentUser.uid;
   return `<div class="reply"><span class="reply-author">${esc(d.authorName)}</span><span class="reply-date">${dateText(d.createdAt)}</span>${can?` <button class="small-button" onclick="removeReply('${id}','${r.id}')">削除</button>`:""}<div>${esc(d.content)}</div></div>`;
  }).join("")||'<div class="reply">まだ返信はありません。</div>';
 }catch(e){area.textContent="返信を読み込めません："+e.message}
}
async function sendReply(id){
 const input=$("reply-input-"+id),content=input?.value.trim();
 if(!content||!currentUser)return;
 try{
  await addDoc(collection(db,"posts",id,"replies"),{
   content,authorUid:currentUser.uid,authorName:displayName(),authorPhoto:currentProfile.photoData||"",createdAt:serverTimestamp()
  });
  input.value="";await loadReplies(id);
 }catch(e){alert("返信できません："+e.message)}
}
async function removeReply(postId,replyId){
 if(!confirm("この返信を削除しますか？"))return;
 try{await deleteDoc(doc(db,"posts",postId,"replies",replyId));await loadReplies(postId)}
 catch(e){alert("返信を削除できません："+e.message)}
}
async function editPost(id){
 const p=cachedPosts.find(x=>x.id===id);if(!p)return;
 const c=prompt("投稿内容を編集",p.data.content);
 if(c===null)return;if(!c.trim())return alert("本文を入力してください。");
 try{await updateDoc(doc(db,"posts",id),{content:c.trim(),updatedAt:serverTimestamp()})}
 catch(e){alert("編集できません："+e.message)}
}
async function removePost(id){
 if(!confirm("この投稿を削除しますか？"))return;
 try{await deleteDoc(doc(db,"posts",id))}
 catch(e){alert("削除できません："+e.message)}
}
function replyKey(e,id){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendReply(id)}}
function postKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendPost()}}

function openProfile(){
 if(!currentUser)return;
 newPhoto=currentProfile.photoData||"";
 $("profile-name").value=displayName();
 $("profile-error").textContent="";
 updateProfilePreview();
 $("profile-modal").classList.add("open");
}
function closeProfile(){$("profile-modal").classList.remove("open")}
function updateProfilePreview(){
 const n=$("profile-name").value.trim()||"?";
 $("profile-preview").innerHTML=safePhoto(newPhoto)?`<img src="${safePhoto(newPhoto)}" alt="">`:esc(Array.from(n)[0]);
}
async function imageToData(file){
 if(!file.type.startsWith("image/"))throw Error("画像ファイルを選択してください。");
 const bitmap=await createImageBitmap(file),scale=Math.min(1,256/Math.max(bitmap.width,bitmap.height));
 const canvas=document.createElement("canvas");
 canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
 canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();
 return canvas.toDataURL("image/jpeg",.72);
}
async function saveProfile(){
 const name=$("profile-name").value.trim();
 try{
  if(!name)throw Error("表示名を入力してください。");
  if(name.length>30)throw Error("表示名は30文字以内にしてください。");
  $("profile-save").disabled=true;
  await updateProfile(auth.currentUser,{displayName:name});
  await setDoc(doc(db,"profiles",currentUser.uid),{displayName:name,photoData:newPhoto||"",updatedAt:serverTimestamp()},{merge:true});
  currentProfile={displayName:name,photoData:newPhoto||""};
  updateUserArea();closeProfile();renderPosts();
 }catch(e){$("profile-error").textContent=e.message}
 finally{$("profile-save").disabled=false}
}
$("photo-file").addEventListener("change",async e=>{
 const file=e.target.files?.[0];if(!file)return;
 try{newPhoto=await imageToData(file);updateProfilePreview()}
 catch(err){$("profile-error").textContent=err.message}
});
$("profile-name").addEventListener("input",updateProfilePreview);

onAuthStateChanged(auth,async user=>{
 if(authFlow)return;
 if(user){
  try{
   const token=await getIdTokenResult(user,true);
   if(token.claims.firebase?.sign_in_provider!=="password"){
    await signOut(auth);
    currentUser=null;currentProfile={};
    $("login-error").textContent="メールアドレスとパスワードでログインしてください。";
    $("login-modal").classList.add("open");
    return;
   }
   currentUser=user;
   const p=await getDoc(doc(db,"profiles",user.uid));
   currentProfile=p.exists()?p.data():{};
   updateUserArea();
  }catch(e){
   console.error(e);await signOut(auth);currentUser=null;currentProfile={};
  }
 }else{
  currentUser=null;currentProfile={};
  $("user-name").textContent="未ログイン";$("user-role").textContent="未ログイン";
  $("user-avatar").textContent="?";$("login-button").textContent="ログイン";
  $("login-button").onclick=openLogin;$("profile-button").style.display="none";
 }
 updateComposer();startPosts();
});
$("post-input").addEventListener("keydown",postKey);

await setPersistence(auth,browserLocalPersistence);
applyTheme();updateAuthMode();
selectChannel(settings[currentChannel]?currentChannel:"announcement");
Object.assign(window,{
 selectChannel,toggleSidebar,closeSidebar,openLogin,closeLogin,toggleAuthMode,
 emailAction,googleSignup,setupGooglePassword,toggleTheme,sendPost,loadReplies,
 sendReply,replyKey,editPost,removePost,removeReply,logout,openProfile,
 closeProfile,saveProfile
});
</script>
</body>
