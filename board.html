<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142B49">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="./icon.png">
<title>掲示板 | 波急公式サイト</title>
<script>
try{document.documentElement.dataset.theme=localStorage.getItem("board-theme")||"light"}catch(e){}
</script>
<style>
:root{color-scheme:light;--bg:#f4f6fa;--panel:#fff;--side:#fff;--text:#172b45;--sub:#718096;--border:#e1e7ef;--blue:#2878c8;--blue2:#eaf3fc;--input:#f5f7fa;--danger:#d9485b;--shadow:0 8px 28px #142b4910;--focus:#2878c8}
:root[data-theme=dark]{color-scheme:dark;--bg:#0d1520;--panel:#172333;--side:#111e2e;--text:#e8eef6;--sub:#a5b2c3;--border:#2b3a4d;--blue:#65adf3;--blue2:#1d3852;--input:#223247;--danger:#ff7180;--shadow:0 8px 28px #0003;--focus:#8bc5ff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,"Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}
button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--focus) 55%,transparent);outline-offset:2px}
.app{display:flex;width:100%;height:100dvh}
.sidebar{width:264px;min-width:264px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:5px 8px 22px;border-bottom:1px solid var(--border)}
.brand img{width:42px;height:42px;object-fit:contain}.brand-name{font-size:19px;font-weight:800;letter-spacing:.01em}.brand-sub{font-size:10px;color:var(--sub);margin-top:3px;letter-spacing:.1em}
.category-title{margin:24px 8px 9px;font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.08em}
.channel-list{display:flex;flex-direction:column;gap:5px}
.channel{padding:12px 13px;border:0;border-radius:10px;background:transparent;color:var(--text);text-align:left;font-size:14px;font-weight:650;transition:background .16s,color .16s}
.channel:hover{background:var(--input)}.channel.active{background:var(--blue2);color:var(--blue)}
.sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding:14px 5px 0}
.profile-click{border:0;background:none;padding:0;color:inherit;display:inline-flex;align-items:center;gap:9px;text-align:left;min-width:0}
.user-area{width:100%}.avatar{width:40px;height:40px;min-width:40px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:white;font-weight:800;overflow:hidden}
.avatar img,.post-avatar img,.reply-avatar img{width:100%;height:100%;object-fit:cover}
.user-info{min-width:0}.user-name{font-size:13px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-role{font-size:11px;color:var(--sub);margin-top:3px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:66px;min-height:66px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 clamp(12px,2vw,28px);gap:13px}
.menu-button{display:none;border:0;background:transparent;color:var(--text);font-size:23px;padding:7px}
.page-title{font-size:17px;font-weight:800;letter-spacing:.01em}.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.top-button{font-size:12px;font-weight:650;color:var(--text);padding:9px 13px;border:1px solid var(--border);border-radius:10px;background:var(--input);transition:transform .15s,background .15s}
.top-button:hover,.small-button:hover,.attach-button:hover{background:var(--blue2)}.top-button:active,.send-button:active{transform:scale(.97)}
.home-button{background:var(--blue);color:#fff;border-color:var(--blue)}
.content{flex:1;min-height:0;display:flex;flex-direction:column;max-width:1180px;width:100%;margin:0 auto}
.channel-header{background:var(--panel);border-bottom:1px solid var(--border);padding:22px clamp(16px,3vw,34px)}
.channel-heading{font-size:21px;font-weight:850}.channel-description{margin-top:6px;font-size:13px;color:var(--sub);line-height:1.6}
.messages{flex:1;overflow-y:auto;padding:22px clamp(12px,3vw,34px);overscroll-behavior:contain;scrollbar-gutter:stable}
.empty{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--sub);gap:8px}
.empty-icon{font-size:38px}.empty-title{font-size:17px;font-weight:800;color:var(--text)}
.post{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;margin:0 auto 14px;max-width:850px;box-shadow:var(--shadow);animation:appear .22s ease both}
.post-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.post-avatar,.reply-avatar{width:38px;height:38px;min-width:38px;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;font-weight:800;overflow:hidden}
.post-author{font-size:13px;font-weight:800}.post-author:hover{text-decoration:underline}.post-role{font-size:10px;font-weight:800;padding:4px 8px;border-radius:20px;background:var(--input);color:var(--sub)}
.role-owner{background:#fff1bd;color:#916000}.role-developer{background:#eee1ff;color:#7540b5}.role-moderator{background:#ffe1ee;color:#bd3974}
.post-date{font-size:11px;color:var(--sub);margin-left:auto}.post-content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;margin:15px 0 12px;font-size:14px}
.post-image{display:block;max-width:min(100%,680px);max-height:480px;object-fit:contain;border-radius:12px;margin:12px 0;border:1px solid var(--border);background:var(--input)}
.actions{display:flex;gap:7px;flex-wrap:wrap;padding-top:5px}.small-button{border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:650;transition:background .15s}
.small-button.danger{color:var(--danger)}.reply-list{border-top:1px solid var(--border);margin-top:15px;padding-top:5px}
.reply{padding:11px 0;font-size:13px;line-height:1.7;border-bottom:1px solid var(--border)}.reply:last-child{border-bottom:0}
.reply-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.reply-avatar{width:29px;height:29px;min-width:29px;font-size:12px}.reply-author{font-size:12px;font-weight:800}.reply-date{font-size:10px;color:var(--sub)}
.reply-content{margin:5px 0 0 37px;white-space:pre-wrap;overflow-wrap:anywhere}
.reply-form{display:flex;gap:8px;margin-top:12px}.reply-form input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--input);color:var(--text);font-size:13px}
.no-replies{font-size:12px;color:var(--sub);padding:10px 0}
.composer-area{padding:13px clamp(12px,3vw,34px) 18px;background:var(--panel);border-top:1px solid var(--border)}
.composer-inner{max-width:850px;margin:0 auto}.composer-notice{font-size:11px;color:var(--sub);margin-bottom:8px}
.composer{display:flex;align-items:flex-end;gap:9px;background:var(--input);border:1px solid var(--border);border-radius:14px;padding:10px}
.composer textarea{flex:1;min-width:0;resize:none;max-height:150px;min-height:28px;border:0;outline:none;background:transparent;color:var(--text);font-size:14px;padding:6px;line-height:1.6}
.send-button{border:0;border-radius:10px;padding:10px 17px;background:var(--blue);color:white;font-weight:800;white-space:nowrap}
.attach-button{border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:var(--panel);color:var(--text);font-size:12px;white-space:nowrap}
.attachment-preview{display:none;align-items:center;gap:10px;margin:8px 0;padding:8px;background:var(--input);border-radius:10px;font-size:12px}
.attachment-preview img{width:55px;height:55px;object-fit:cover;border-radius:7px}.attachment-preview button{margin-left:auto}
.modal{display:none;position:fixed;inset:0;z-index:100;background:#07111dcc;backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex;animation:fade .15s ease}.modal-box{background:var(--panel);color:var(--text);width:100%;max-width:460px;max-height:90dvh;overflow-y:auto;padding:24px;border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 80px #0004;animation:rise .18s ease}
.modal-box h2{margin:0 0 8px;font-size:20px}.auth-description{font-size:13px;color:var(--sub);margin:0 0 18px;line-height:1.7}
.auth-label{display:block;font-size:13px;font-weight:750;margin-bottom:13px}.auth-input{display:block;width:100%;padding:12px;margin-top:7px;border:1px solid var(--border);border-radius:10px;background:var(--input);color:var(--text)}
.auth-primary,.auth-google,.auth-close{width:100%;padding:12px;border-radius:10px;font-weight:750}
.auth-primary{background:var(--blue);color:white;border:0}.auth-google{margin-top:9px;background:var(--input);color:var(--text);border:1px solid var(--border)}.auth-close{margin-top:8px;background:var(--input);color:var(--text);border:0}
.auth-error{color:var(--danger);font-size:13px;overflow-wrap:anywhere;line-height:1.6;white-space:pre-wrap}.auth-link{display:block;background:none;border:0;color:var(--blue);padding:12px 0}
.profile-preview{width:90px;height:90px;border-radius:50%;overflow:hidden;background:var(--blue);color:white;display:grid;place-items:center;font-size:30px;margin:10px auto 16px}
.profile-preview img{width:100%;height:100%;object-fit:cover}.profile-role-view{text-align:center;margin:0 0 16px}
.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.dialog-actions button{min-width:92px}
.toast-region{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--text);color:var(--panel);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:min(360px,calc(100vw - 36px));animation:rise .18s ease}
.loading-line{height:3px;background:var(--blue);position:absolute;top:0;left:0;animation:loading 1.2s ease-in-out infinite}
.overlay{display:none}
@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes loading{0%{width:0;left:0}50%{width:65%;left:18%}100%{width:0;left:100%}}
@media(max-width:760px){
 .sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-105%);transition:transform .2s ease;width:285px;min-width:285px;box-shadow:var(--shadow)}
 .sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#0008;z-index:20}
 .menu-button{display:block}.topbar{height:60px;min-height:60px;padding:0 9px;gap:8px}.page-title{font-size:15px}
 .topbar-right{gap:5px}.top-button{font-size:11px;padding:8px 9px}.channel-header{padding:16px}.channel-heading{font-size:18px}
 .messages{padding:12px}.post{padding:14px;border-radius:13px}.composer-area{padding:10px}.composer{gap:6px;padding:7px}.attach-button{padding:9px 8px}.send-button{padding:10px 12px}
 .post-date{width:100%;margin-left:47px}.modal-box{padding:20px}
}
@media(max-width:390px){.top-button{padding:7px;font-size:10px}.home-button .wide-label{display:none}.composer textarea{font-size:13px}.attach-button{font-size:0}.attach-button::first-letter{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
 <aside class="sidebar" id="sidebar">
  <div class="brand"><img src="./icon.png" alt="波急"><div><div class="brand-name">波急掲示板</div><div class="brand-sub">NAMIKYU COMMUNITY</div></div></div>
  <div class="category-title">コミュニティ</div>
  <div class="channel-list">
   <button class="channel active" data-channel="announcement" onclick="selectChannel('announcement')">📢　運営お知らせ</button>
   <button class="channel" data-channel="chat" onclick="selectChannel('chat')">💬　チャット</button>
  </div>
  <div class="sidebar-bottom"><button class="profile-click user-area" onclick="openProfile()"><div class="avatar" id="user-avatar">?</div><div class="user-info"><div class="user-name" id="user-name">未ログイン</div><div class="user-role" id="user-role">未ログイン</div></div></button></div>
 </aside>
 <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
 <main class="main">
  <header class="topbar">
   <button class="menu-button" onclick="toggleSidebar()" aria-label="メニューを開く">☰</button><div class="page-title">波急コミュニティ</div>
   <div class="topbar-right">
    <button class="top-button home-button" onclick="location.href='./index.html'" aria-label="ホームへ戻る">⌂ <span class="wide-label">ホーム</span></button>
    <button class="top-button" id="theme-button" onclick="toggleTheme()">🌙 ダーク</button>
    <button class="top-button" id="profile-button" style="display:none" onclick="openProfile()">プロフィール</button>
    <button class="top-button" id="login-button" onclick="openLogin()">ログイン</button>
   </div>
  </header>
  <section class="content">
   <div class="channel-header"><div class="channel-heading"><span id="channel-icon">📢</span> <span id="channel-name">運営お知らせ</span></div><div class="channel-description" id="channel-description">波急運営からのお知らせを掲載します。</div></div>
   <div class="messages" id="messages" aria-live="polite"><div class="empty"><div class="empty-icon">🔒</div><div class="empty-title">ログインしてください</div></div></div>
   <div class="composer-area"><div class="composer-inner"><div class="composer-notice" id="composer-notice">投稿にはログインが必要です。</div>
    <div class="attachment-preview" id="attachment-preview"><img id="attachment-thumb" alt="添付画像のプレビュー"><span id="attachment-name">画像を添付</span><button class="small-button" onclick="clearAttachment()">外す</button></div>
    <div class="composer" id="composer">
     <input id="post-image" type="file" accept="image/*" hidden>
     <button class="attach-button" onclick="document.getElementById('post-image').click()" aria-label="画像を添付">📷 画像</button>
     <textarea id="post-input" maxlength="5000" rows="1" placeholder="メッセージを入力..." aria-label="投稿内容"></textarea>
     <button class="send-button" id="send-button" onclick="sendPost()">送信</button>
    </div>
   </div></div>
  </section>
 </main>
</div>

<div class="modal" id="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-title"><div class="modal-box">
 <h2 id="login-title">ログイン</h2><p class="auth-description" id="auth-description">登録済みのアカウントでログインします。</p>
 <label class="auth-label" id="name-label" style="display:none">表示名<input id="display-name" class="auth-input" maxlength="30" placeholder="掲示板で使う名前"></label>
 <label class="auth-label">メールアドレス<input id="email" class="auth-input" type="email" autocomplete="email"></label>
 <label class="auth-label">パスワード<input id="password" class="auth-input" type="password" autocomplete="current-password"></label>
 <button class="auth-primary" id="email-action-button" onclick="emailAction()">ログイン</button>
 <button class="auth-google" id="google-button" onclick="googleSignup()">Googleで新規登録</button>
 <button class="auth-google" id="google-setup-button" onclick="setupGooglePassword()">Googleアカウントの初回パスワード設定</button>
 <p class="auth-error" id="login-error" role="alert"></p><button class="auth-link" id="forgot-password-link" onclick="openPasswordReset()">パスワードを忘れた場合</button><button class="auth-link" id="mode-button" onclick="toggleAuthMode()">新規登録はこちら</button>
 <button class="auth-close" onclick="closeLogin()">閉じる</button>
</div></div>

<div class="modal" id="password-reset-modal" role="dialog" aria-modal="true" aria-labelledby="password-reset-title"><div class="modal-box">
 <h2 id="password-reset-title">パスワード再設定</h2>
 <p class="auth-description">登録したメールアドレスを入力してください。Firebaseから再設定用リンクを送信します。</p>
 <label class="auth-label">メールアドレス<input class="auth-input" id="reset-email" type="email" autocomplete="email" placeholder="登録したメールアドレス"></label>
 <p class="auth-error" id="reset-error" role="alert"></p>
 <button class="auth-primary" id="reset-send-button" onclick="sendPasswordResetLink()">再設定メールを送信</button>
 <button class="auth-close" onclick="closePasswordReset()">戻る</button>
</div></div>

<div class="modal" id="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profile-title"><div class="modal-box">
 <h2 id="profile-title">プロフィール</h2><div class="profile-preview" id="profile-preview">?</div><div class="profile-role-view" id="profile-role-view"></div>
 <div id="profile-edit-fields">
  <label class="auth-label">アイコン画像<input class="auth-input" id="photo-file" type="file" accept="image/*"></label>
  <label class="auth-label">表示名<input class="auth-input" id="profile-name" maxlength="30" placeholder="表示名"></label>
 </div>
 <p class="auth-error" id="profile-error" role="alert"></p><button class="auth-primary" id="profile-save" onclick="saveProfile()">変更を保存</button>
 <button class="auth-close" onclick="closeProfile()">閉じる</button>
</div></div>

<div class="modal" id="action-modal" role="dialog" aria-modal="true" aria-labelledby="action-title"><div class="modal-box">
 <h2 id="action-title">確認</h2><p class="auth-description" id="action-description"></p>
 <div id="action-editor" style="display:none"><textarea id="action-text" class="auth-input" rows="6" maxlength="5000" style="resize:vertical"></textarea></div>
 <p class="auth-error" id="action-error" role="alert"></p>
 <div class="dialog-actions"><button class="small-button" onclick="closeAction()">キャンセル</button><button class="auth-primary" id="action-confirm" style="width:auto;min-width:100px" onclick="runAction()">実行する</button></div>
</div></div>
<div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

<script type="module">
// 以前の通知版で登録された通知専用Service Workerがあれば解除します。
if ("serviceWorker" in navigator) {
 navigator.serviceWorker.getRegistrations().then(registrations => {
  registrations.filter(r => [r.active?.scriptURL,r.waiting?.scriptURL,r.installing?.scriptURL].some(u => u && u.endsWith("/firebase-messaging-sw.js"))).forEach(r => r.unregister());
 }).catch(() => {});
}

import{getAuth,GoogleAuthProvider,signInWithPopup,browserLocalPersistence,setPersistence,createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,onAuthStateChanged,signOut,EmailAuthProvider,linkWithCredential,getAdditionalUserInfo,getIdTokenResult,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import{getFirestore,collection,addDoc,onSnapshot,doc,updateDoc,deleteDoc,getDocs,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAw45Gj7Hl9mwOT-Tb1HL7VYxhkD2RDmZQ",authDomain:"namikyu-board.firebaseapp.com",projectId:"namikyu-board",storageBucket:"namikyu-board.firebasestorage.app",messagingSenderId:"597333464774",appId:"1:597333464774:web:773305ab5ad97b55d2a9c7",measurementId:"G-5EFRPTWRMJ"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});
const OWNER_UID="kv2lmeIrYrN3J7T4GWTaJau7MtY2";
const $=id=>document.getElementById(id);
let authMode="login",currentChannel=localStorage.getItem("board-channel")||"announcement";
let currentUser=null,currentProfile={},roles={},unsubscribePosts=null,cachedPosts=[],authFlow=false;
let pendingImage="",profileImage="",replyUnsubs=new Map(),replyCache=new Map(),actionTask=null;
const settings={announcement:{name:"運営お知らせ",icon:"📢",description:"波急運営からのお知らせを掲載します。"},chat:{name:"チャット",icon:"💬",description:"メンバー同士で自由に交流できる場所です。"}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeImage=s=>typeof s==="string"&&s.startsWith("data:image/jpeg;base64,")&&s.length<700000?s:"";

const dateText=v=>{let d=v?.toDate?.();if(!d)return"送信直後";let now=Date.now(),diff=now-d.getTime();if(diff<60000)return"たった今";if(diff<3600000)return`${Math.floor(diff/60000)}分前`;if(diff<86400000)return`${Math.floor(diff/3600000)}時間前`;return d.toLocaleString("ja-JP",{year:"numeric",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})};
function avatar(name,photo,cls="post-avatar"){return `<div class="${cls}">${safeImage(photo)?`<img src="${safeImage(photo)}" alt="">`:esc(Array.from(name||"?")[0])}</div>`}
function profileLink(uid,name,photo,cls="post-avatar"){return `<button class="profile-click" onclick="viewProfile('${esc(uid)}')">${avatar(name,photo,cls)}<span class="post-author">${esc(name||"メンバー")}</span></button>`}
function toast(message){let el=document.createElement("div");el.className="toast";el.textContent=message;$("toast-region").append(el);setTimeout(()=>el.remove(),3500)}
function applyTheme(){let t=document.documentElement.dataset.theme||"light";$("theme-button").textContent=t==="dark"?"☀️ ホワイト":"🌙 ダーク"}
function toggleTheme(){let t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;localStorage.setItem("board-theme",t);applyTheme()}
function selectChannel(c){if(!settings[c])return;currentChannel=c;localStorage.setItem("board-channel",c);$("channel-name").textContent=settings[c].name;$("channel-icon").textContent=settings[c].icon;$("channel-description").textContent=settings[c].description;document.querySelectorAll(".channel").forEach(b=>b.classList.toggle("active",b.dataset.channel===c));updateComposer();renderPosts();closeSidebar()}
function toggleSidebar(){$("sidebar").classList.toggle("open");$("overlay").classList.toggle("show")}
function closeSidebar(){$("sidebar").classList.remove("open");$("overlay").classList.remove("show")}
function openLogin(){if(currentUser){openAction("ログアウトしますか？","ログアウトすると、再度ログインが必要になります。", "ログアウト",async()=>signOut(auth));return}$("login-modal").classList.add("open");$("login-error").textContent=""}
function closeLogin(){$("login-modal").classList.remove("open")}
function openPasswordReset(){if(authMode!=="login")return;$("reset-email").value=$("email").value.trim();$("reset-error").textContent="";$("password-reset-modal").classList.add("open");setTimeout(()=>$("reset-email").focus(),50)}
function closePasswordReset(){$("password-reset-modal").classList.remove("open")}
async function sendPasswordResetLink(){let email=$("reset-email").value.trim(),button=$("reset-send-button");$("reset-error").textContent="";if(!email){$("reset-error").textContent="登録したメールアドレスを入力してください。";return}button.disabled=true;try{auth.languageCode="ja";await sendPasswordResetEmail(auth,email);$("reset-error").style.color="var(--blue)";$("reset-error").textContent="再設定メールを送信しました。受信トレイと迷惑メールフォルダを確認してください。メール内のリンクから新しいパスワードを設定できます。";button.textContent="送信しました"}catch(e){const messages={"auth/invalid-email":"メールアドレスの形式が正しくありません。","auth/user-not-found":"このメールアドレスのアカウントが見つかりません。","auth/too-many-requests":"短時間に何度も送信されています。しばらく待ってから再試行してください。","auth/network-request-failed":"通信に失敗しました。ネットワークを確認してください。"};$("reset-error").style.color="var(--danger)";$("reset-error").textContent=messages[e.code]||e.message||"メールを送信できませんでした。";console.error(e)}finally{button.disabled=false}}
function toggleAuthMode(){authMode=authMode==="login"?"signup":"login";updateAuthMode()}
function updateAuthMode(){let s=authMode==="signup";$("forgot-password-link").style.display=s?"none":"block";$("login-title").textContent=s?"新規登録":"ログイン";$("auth-description").textContent=s?"メールまたはGoogleで新規登録できます。":"登録済みのメールアドレスとパスワードでログインします。";$("email-action-button").textContent=s?"メールで新規登録":"ログイン";$("google-button").style.display=s?"block":"none";$("google-setup-button").style.display=s?"block":"none";$("mode-button").textContent=s?"ログインはこちら":"新規登録はこちら";$("name-label").style.display=s?"block":"none";$("password").autocomplete=s?"new-password":"current-password";$("login-error").textContent=""}
function showError(e){const m={"auth/invalid-email":"メールアドレスの形式が正しくありません。","auth/email-already-in-use":"このメールアドレスは登録済みです。","auth/weak-password":"パスワードは6文字以上にしてください。","auth/invalid-credential":"メールアドレスまたはパスワードが違います。","auth/account-exists-with-different-credential":"このメールアドレスは別の方法で登録済みです。","auth/unauthorized-domain":"Firebaseの承認済みドメインを確認してください。","auth/popup-blocked":"ブラウザでポップアップを許可してください。","auth/popup-closed-by-user":"Google認証画面が閉じられました。","auth/credential-already-in-use":"このメールアドレスは別のアカウントで使用されています。"};$("login-error").textContent=(m[e.code]||e.message||"認証に失敗しました。")+"\n"+(e.code||"");console.error(e)}
async function emailAction(){let email=$("email").value.trim(),pass=$("password").value,name=$("display-name").value.trim();try{$("login-error").textContent="";if(!email||!pass)throw Error("メールアドレスとパスワードを入力してください。");if(authMode==="signup"){if(!name)throw Error("表示名を入力してください。");if(pass.length<6)throw Error("パスワードは6文字以上にしてください。");let r=await createUserWithEmailAndPassword(auth,email,pass);await updateProfile(r.user,{displayName:name});await setDoc(doc(db,"profiles",r.user.uid),{displayName:name,photoData:"",updatedAt:serverTimestamp()})}else await signInWithEmailAndPassword(auth,email,pass);closeLogin()}catch(e){showError(e)}}
async function googleSignup(){let pass=$("password").value,name=$("display-name").value.trim();try{if(pass.length<6)throw Error("パスワードを6文字以上で入力してください。");if(!name)throw Error("表示名を入力してください。");authFlow=true;await setPersistence(auth,browserLocalPersistence);let r=await signInWithPopup(auth,provider);if(!getAdditionalUserInfo(r)?.isNewUser){await signOut(auth);throw Error("このGoogleアカウントは既に登録されています。メールアドレスとパスワードでログインしてください。")}await linkWithCredential(r.user,EmailAuthProvider.credential(r.user.email,pass));await updateProfile(r.user,{displayName:name});await setDoc(doc(db,"profiles",r.user.uid),{displayName:name,photoData:"",updatedAt:serverTimestamp()});await signOut(auth);await signInWithEmailAndPassword(auth,r.user.email,pass);closeLogin()}catch(e){showError(e)}finally{authFlow=false;await syncUser(auth.currentUser)}}
async function setupGooglePassword(){let pass=$("password").value;try{if(pass.length<6)throw Error("設定するパスワードを6文字以上で入力してください。");authFlow=true;await setPersistence(auth,browserLocalPersistence);let r=await signInWithPopup(auth,provider);if(r.user.providerData.some(p=>p.providerId==="password")){await signOut(auth);throw Error("このアカウントには既にパスワードが設定されています。ログイン画面からメールアドレスとパスワードでログインしてください。")}await linkWithCredential(r.user,EmailAuthProvider.credential(r.user.email,pass));await signOut(auth);$("login-error").textContent="パスワードを設定しました。メールアドレスとパスワードでログインしてください。";authMode="login";updateAuthMode()}catch(e){showError(e)}finally{authFlow=false;await syncUser(auth.currentUser)}}
function updateUserArea(){let n=nameOf(),photo=currentProfile.photoData;$("user-name").textContent=n;$("user-role").textContent=roleName(currentUser.uid);$("user-avatar").innerHTML=safeImage(photo)?`<img src="${safeImage(photo)}" alt="">`:esc(Array.from(n)[0]||"?");$("login-button").textContent="ログアウト";$("login-button").onclick=openLogin;$("profile-button").style.display="block"}
function updateComposer(){let ok=!!currentUser&&(currentChannel==="chat"||isStaff());$("post-input").disabled=!ok;$("send-button").disabled=!ok;$("composer").style.display=ok?"flex":"none";$("composer-notice").textContent=!currentUser?"投稿するにはログインしてください。":currentChannel==="announcement"&&!isStaff()?"運営メンバーのみ投稿できます。":"画像は1枚まで（圧縮後450KB以内）。Enterで送信、Shift+Enterで改行。"}
function cleanupReplies(){for(let u of replyUnsubs.values())u();replyUnsubs.clear();replyCache.clear()}
function renderPosts(){let area=$("messages"),list=cachedPosts.filter(p=>p.data.channel===currentChannel);if(!currentUser){area.innerHTML='<div class="empty"><div class="empty-icon">🔒</div><div class="empty-title">ログインしてください</div><div>ログインすると掲示板を利用できます。</div></div>';return}if(!list.length){area.innerHTML='<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">まだ投稿はありません</div><div>最初の投稿をしてみましょう。</div></div>';return}
let existing=new Set(list.map(p=>p.id));for(let [id,unsub]of replyUnsubs){if(!existing.has(id)){unsub();replyUnsubs.delete(id);replyCache.delete(id)}}
area.innerHTML=list.map(p=>{let d=p.data,manage=canManage(d),img=safeImage(d.imageData);return `<article class="post" id="post-${p.id}"><div class="post-head">${profileLink(d.authorUid,d.authorName,d.authorPhoto)}<span class="post-role ${roleClass(d.authorUid)}">${roleName(d.authorUid)}</span><span class="post-date" title="${esc(d.createdAt?.toDate?.().toLocaleString("ja-JP")||"")}">${dateText(d.createdAt)}</span></div><div class="post-content">${esc(d.content)}</div>${img?`<img class="post-image" src="${img}" alt="投稿画像" loading="lazy">`:""}<div class="actions">${manage?`<button class="small-button" onclick="editPost('${p.id}')">編集</button><button class="small-button danger" onclick="removePost('${p.id}')">削除</button>`:""}</div><div class="reply-list" id="replies-${p.id}"><div class="no-replies">返信を読み込み中...</div></div><div class="reply-form"><input id="reply-input-${p.id}" maxlength="3000" placeholder="返信を書く..." aria-label="返信を書く" onkeydown="replyKey(event,'${p.id}')"><button class="small-button" onclick="sendReply('${p.id}')">返信</button></div></article>`}).join("");
list.forEach(p=>startReplies(p.id))}
function startPosts(){if(unsubscribePosts)unsubscribePosts();cleanupReplies();if(!currentUser){cachedPosts=[];renderPosts();return}unsubscribePosts=onSnapshot(collection(db,"posts"),s=>{cachedPosts=s.docs.map(d=>({id:d.id,data:d.data()}));cachedPosts.sort((a,b)=>(b.data.createdAt?.toMillis?.()||0)-(a.data.createdAt?.toMillis?.()||0));renderPosts()},e=>{$("messages").textContent="読み込みエラー："+e.message})}
function startReplies(id){if(replyUnsubs.has(id))return;let ref=collection(db,"posts",id,"replies");let unsub=onSnapshot(ref,s=>{let rows=s.docs.map(d=>({id:d.id,data:d.data()}));rows.sort((a,b)=>(a.data.createdAt?.toMillis?.()||0)-(b.data.createdAt?.toMillis?.()||0));replyCache.set(id,rows);renderReplies(id)},e=>{let el=$("replies-"+id);if(el)el.textContent="返信を読み込めません："+e.message});replyUnsubs.set(id,unsub)}
function renderReplies(id){let area=$("replies-"+id);if(!area)return;let rows=replyCache.get(id)||[];area.innerHTML=rows.map(r=>{let d=r.data,can=isStaff()||d.authorUid===currentUser?.uid;return `<div class="reply"><div class="reply-head">${profileLink(d.authorUid,d.authorName,d.authorPhoto,"reply-avatar")}<span class="reply-date">${dateText(d.createdAt)}</span>${can?`<button class="small-button danger" onclick="removeReply('${id}','${r.id}')">削除</button>`:""}</div><div class="reply-content">${esc(d.content)}</div></div>`}).join("")||'<div class="no-replies">まだ返信はありません。</div>'}
async function sendPost(){let input=$("post-input"),content=input.value.trim();if(!content&&!pendingImage)return;if(!currentUser)return;if(currentChannel==="announcement"&&!isStaff())return toast("運営メンバーのみ投稿できます。");let btn=$("send-button");btn.disabled=true;try{let created=await addDoc(collection(db,"posts"),{channel:currentChannel,content,authorUid:currentUser.uid,authorName:nameOf(),authorPhoto:currentProfile.photoData||"",imageData:pendingImage||"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});input.value="";input.style.height="auto";clearAttachment();toast("投稿しました。")}catch(e){toast("投稿できません："+e.message)}finally{updateComposer()}}
async function sendReply(id){let input=$("reply-input-"+id),content=input?.value.trim();if(!content||!currentUser)return;let button=input.parentElement.querySelector("button");button.disabled=true;try{let created=await addDoc(collection(db,"posts",id,"replies"),{content,authorUid:currentUser.uid,authorName:nameOf(),authorPhoto:currentProfile.photoData||"",createdAt:serverTimestamp()});input.value="";toast("返信しました。")}catch(e){toast("返信できません："+e.message)}finally{button.disabled=false}}
function openAction(title,description,confirmText,task,editorValue=null){$("action-title").textContent=title;$("action-description").textContent=description;$("action-confirm").textContent=confirmText;$("action-error").textContent="";$("action-editor").style.display=editorValue===null?"none":"block";$("action-text").value=editorValue??"";actionTask=task;$("action-modal").classList.add("open");if(editorValue!==null)setTimeout(()=>$("action-text").focus(),50)}
function closeAction(){$("action-modal").classList.remove("open");actionTask=null}
async function runAction(){if(!actionTask)return;let task=actionTask,button=$("action-confirm");button.disabled=true;$("action-error").textContent="";try{await task($("action-text").value);closeAction()}catch(e){$("action-error").textContent=e.message||"処理に失敗しました。"}finally{button.disabled=false}}
function editPost(id){let p=cachedPosts.find(x=>x.id===id);if(!p)return;openAction("投稿を編集","内容を確認して保存してください。","保存",async value=>{let c=value.trim();if(!c&&!p.data.imageData)throw Error("本文または画像が必要です。");await updateDoc(doc(db,"posts",id),{content:c,updatedAt:serverTimestamp()});toast("投稿を更新しました。")},p.data.content||"")}
function removePost(id){openAction("投稿を削除","この投稿を削除します。投稿に付いた返信も表示されなくなります。","削除する",async()=>{await deleteDoc(doc(db,"posts",id));toast("投稿を削除しました。")})}
function removeReply(postId,replyId){openAction("返信を削除","この返信を削除してもよろしいですか？","削除する",async()=>{await deleteDoc(doc(db,"posts",postId,"replies",replyId));toast("返信を削除しました。")})}
function replyKey(e,id){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendReply(id)}}
function postKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendPost()}}
async function imageData(file,maxBytes,maxSide){if(!file.type.startsWith("image/"))throw Error("画像ファイルを選択してください。");if(file.size>10*1024*1024)throw Error("元画像は10MB以下にしてください。");let bmp=await createImageBitmap(file),scale=Math.min(1,maxSide/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(bmp.width*scale));c.height=Math.max(1,Math.round(bmp.height*scale));c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);bmp.close();for(let q of [.82,.72,.62,.52,.42]){let data=c.toDataURL("image/jpeg",q),bytes=Math.ceil((data.length-data.indexOf(",")-1)*.75);if(bytes<=maxBytes)return data}throw Error("画像を圧縮しても容量制限を超えています。別の画像を選んでください。")}
async function choosePostImage(e){let f=e.target.files?.[0];if(!f)return;try{pendingImage=await imageData(f,450*1024,1280);$("attachment-thumb").src=pendingImage;$("attachment-name").textContent=f.name;$("attachment-preview").style.display="flex"}catch(err){toast(err.message)}e.target.value=""}
function clearAttachment(){pendingImage="";$("attachment-preview").style.display="none";$("attachment-thumb").removeAttribute("src")}

function openProfile(){if(!currentUser)return;profileImage=currentProfile.photoData||"";$("profile-title").textContent="プロフィール設定";$("profile-edit-fields").style.display="block";$("profile-name").value=nameOf();$("profile-save").style.display="block";$("profile-error").textContent="";updateProfilePreview();setProfileRole(currentUser.uid);$("profile-modal").classList.add("open")}
async function viewProfile(uid){if(!currentUser||!uid)return;if(uid===currentUser.uid)return openProfile();try{let s=await getDoc(doc(db,"profiles",uid)),p=s.exists()?s.data():{};profileImage=p.photoData||"";$("profile-title").textContent="プロフィール";$("profile-edit-fields").style.display="none";$("profile-save").style.display="none";$("profile-error").textContent="";$("profile-preview").innerHTML=safeImage(profileImage)?`<img src="${safeImage(profileImage)}" alt="">`:esc(Array.from(p.displayName||"メンバー")[0]);$("profile-name").value=p.displayName||"メンバー";setProfileRole(uid);$("profile-modal").classList.add("open")}catch(e){toast("プロフィールを読み込めません："+e.message)}}
function setProfileRole(uid){$("profile-role-view").innerHTML=`<span class="post-role ${roleClass(uid)}">${esc(roleName(uid))}</span>`}
function closeProfile(){$("profile-modal").classList.remove("open")}
function updateProfilePreview(){let n=$("profile-name").value.trim()||"?";$("profile-preview").innerHTML=safeImage(profileImage)?`<img src="${safeImage(profileImage)}" alt="">`:esc(Array.from(n)[0])}
async function saveProfile(){let name=$("profile-name").value.trim();try{if(!name)throw Error("表示名を入力してください。");if(name.length>30)throw Error("表示名は30文字以内にしてください。");$("profile-save").disabled=true;await updateProfile(auth.currentUser,{displayName:name});await setDoc(doc(db,"profiles",currentUser.uid),{displayName:name,photoData:profileImage||"",updatedAt:serverTimestamp()},{merge:true});currentProfile={displayName:name,photoData:profileImage||""};updateUserArea();closeProfile();renderPosts();toast("プロフィールを更新しました。")}catch(e){$("profile-error").textContent=e.message}finally{$("profile-save").disabled=false}}
async function syncUser(user){if(!user){currentUser=null;currentProfile={};roles={};if(unsubscribePosts)unsubscribePosts();cleanupReplies();$("user-name").textContent="未ログイン";$("user-role").textContent="未ログイン";$("user-avatar").textContent="?";$("login-button").textContent="ログイン";$("login-button").onclick=openLogin;$("profile-button").style.display="none";updateComposer();startPosts();return}
try{let token=await getIdTokenResult(user);if(token.claims.firebase?.sign_in_provider!=="password"){await signOut(auth);$("login-error").textContent="メールアドレスとパスワードでログインしてください。";$("login-modal").classList.add("open");return}
currentUser=user;let [p,r]=await Promise.all([getDoc(doc(db,"profiles",user.uid)),getDocs(collection(db,"staffRoles"))]);currentProfile=p.exists()?p.data():{};roles={};r.forEach(x=>roles[x.id]=x.data());updateUserArea();updateComposer();startPosts()
}catch(e){console.error(e);$("messages").textContent="アカウント情報を読み込めません："+e.message}}
$("post-input").addEventListener("keydown",postKey);
$("post-input").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,150)+"px"});
$("post-image").addEventListener("change",choosePostImage);
$("photo-file").addEventListener("change",async e=>{let f=e.target.files?.[0];if(!f)return;try{profileImage=await imageData(f,120*1024,256);updateProfilePreview()}catch(err){$("profile-error").textContent=err.message}e.target.value=""});
$("profile-name").addEventListener("input",updateProfilePreview);
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m){if(m.id==="action-modal")closeAction();else m.classList.remove("open")}}));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSidebar();document.querySelectorAll(".modal.open").forEach(m=>m.classList.remove("open"));actionTask=null}});
await setPersistence(auth,browserLocalPersistence);
applyTheme();updateAuthMode();selectChannel(settings[currentChannel]?currentChannel:"announcement");
onAuthStateChanged(auth,u=>{if(!authFlow)syncUser(u)});
Object.assign(window,{selectChannel,toggleSidebar,closeSidebar,openLogin,closeLogin,openPasswordReset,closePasswordReset,sendPasswordResetLink,toggleAuthMode,emailAction,googleSignup,setupGooglePassword,toggleTheme,sendPost,sendReply,replyKey,editPost,removePost,removeReply,openProfile,viewProfile,closeProfile,saveProfile,clearAttachment,closeAction,runAction});
</script>
</body>
</html>
