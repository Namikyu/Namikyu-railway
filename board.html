<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142B49">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="./icon.png">
<title>掲示板 | 波急公式サイト</title>
<script>
try{document.documentElement.dataset.theme=localStorage.getItem("board-theme")||"light"}catch(e){}
</script>
<style>
:root{color-scheme:light;--bg:#f4f6fa;--panel:#fff;--side:#fff;--text:#172b45;--sub:#718096;--border:#e1e7ef;--blue:#2878c8;--blue2:#eaf3fc;--input:#f5f7fa;--danger:#d9485b;--shadow:0 8px 28px #142b4910;--focus:#2878c8}
:root[data-theme=dark]{color-scheme:dark;--bg:#0d1520;--panel:#172333;--side:#111e2e;--text:#e8eef6;--sub:#a5b2c3;--border:#2b3a4d;--blue:#65adf3;--blue2:#1d3852;--input:#223247;--danger:#ff7180;--shadow:0 8px 28px #0003;--focus:#8bc5ff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,"Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}
body.auth-pending .app{visibility:hidden}
.auth-loading{display:none}
body.auth-pending .auth-loading{display:flex;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-size:14px;font-weight:700}
.auth-loading-inner{display:flex;align-items:center;gap:12px;padding:18px 22px;border:1px solid var(--border);border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.auth-loading-dot{width:9px;height:9px;border-radius:50%;background:var(--blue);animation:authPulse 1s ease-in-out infinite alternate}
@keyframes authPulse{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--focus) 55%,transparent);outline-offset:2px}
.app{display:flex;width:100%;height:100dvh}
.sidebar{width:264px;min-width:264px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:5px 8px 22px;border-bottom:1px solid var(--border)}
.brand img{width:42px;height:42px;object-fit:contain}.brand-name{font-size:19px;font-weight:800;letter-spacing:.01em}.brand-sub{font-size:10px;color:var(--sub);margin-top:3px;letter-spacing:.1em}
.category-title{margin:24px 8px 9px;font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.08em}
.channel-list{display:flex;flex-direction:column;gap:5px}
.channel{padding:12px 13px;border:0;border-radius:10px;background:transparent;color:var(--text);text-align:left;font-size:14px;font-weight:650;transition:background .16s,color .16s}
.channel:hover{background:var(--input)}.channel.active{background:var(--blue2);color:var(--blue)}
.sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding:14px 5px 0}
.profile-click{border:0;background:none;padding:0;color:inherit;display:inline-flex;align-items:center;gap:9px;text-align:left;min-width:0}
.user-area{width:100%}.avatar{width:40px;height:40px;min-width:40px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:white;font-weight:800;overflow:hidden}
.avatar img,.post-avatar img,.reply-avatar img{width:100%;height:100%;object-fit:cover}
.user-info{min-width:0}.user-name{font-size:13px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-role{font-size:11px;color:var(--sub);margin-top:3px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:66px;min-height:66px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 clamp(12px,2vw,28px);gap:13px}
.menu-button{display:none;border:0;background:transparent;color:var(--text);font-size:23px;padding:7px}
.page-title{font-size:17px;font-weight:800;letter-spacing:.01em}.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.top-button{font-size:12px;font-weight:650;color:var(--text);padding:9px 13px;border:1px solid var(--border);border-radius:10px;background:var(--input);transition:transform .15s,background .15s}
.top-button:hover,.small-button:hover,.attach-button:hover{background:var(--blue2)}.top-button:active,.send-button:active{transform:scale(.97)}
.home-button{background:var(--blue);color:#fff;border-color:var(--blue)}
.content{flex:1;min-height:0;display:flex;flex-direction:column;max-width:1180px;width:100%;margin:0 auto}
.channel-header{background:var(--panel);border-bottom:1px solid var(--border);padding:22px clamp(16px,3vw,34px)}
.channel-heading{font-size:21px;font-weight:850}.channel-description{margin-top:6px;font-size:13px;color:var(--sub);line-height:1.6}
.messages{flex:1;overflow-y:auto;padding:22px clamp(12px,3vw,34px);overscroll-behavior:contain;scrollbar-gutter:stable}
.empty{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--sub);gap:8px}
.empty-icon{font-size:38px}.empty-title{font-size:17px;font-weight:800;color:var(--text)}
.post{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;margin:0 auto 14px;max-width:850px;box-shadow:var(--shadow)}
.post-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.post-avatar,.reply-avatar{width:38px;height:38px;min-width:38px;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;font-weight:800;overflow:hidden}
.post-author{font-size:13px;font-weight:800}.post-author:hover{text-decoration:underline}.post-role{font-size:10px;font-weight:800;padding:4px 8px;border-radius:20px;background:var(--input);color:var(--sub)}
.role-owner{background:#fff1bd;color:#916000}.role-developer{background:#eee1ff;color:#7540b5}.role-moderator{background:#ffe1ee;color:#bd3974}
.post-date{font-size:11px;color:var(--sub);margin-left:auto}.post-content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;margin:15px 0 12px;font-size:14px}
.post-image{display:block;max-width:min(100%,680px);max-height:480px;object-fit:contain;border-radius:12px;margin:12px 0;border:1px solid var(--border);background:var(--input)}
.actions{display:flex;gap:7px;flex-wrap:wrap;padding-top:5px}.small-button{border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:650;transition:background .15s}
.small-button.danger{color:var(--danger)}.reply-list{border-top:1px solid var(--border);margin-top:15px;padding-top:5px}
.reply{padding:11px 0;font-size:13px;line-height:1.7;border-bottom:1px solid var(--border)}.reply:last-child{border-bottom:0}
.reply-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.reply-avatar{width:29px;height:29px;min-width:29px;font-size:12px}.reply-author{font-size:12px;font-weight:800}.reply-date{font-size:10px;color:var(--sub)}
.reply-content{margin:5px 0 0 37px;white-space:pre-wrap;overflow-wrap:anywhere}
.reply-form{display:flex;gap:8px;margin-top:12px}.reply-form input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--input);color:var(--text);font-size:13px}
.no-replies{font-size:12px;color:var(--sub);padding:10px 0}
.composer-area{padding:13px clamp(12px,3vw,34px) 18px;background:var(--panel);border-top:1px solid var(--border)}
.composer-inner{max-width:850px;margin:0 auto}.composer-notice{font-size:11px;color:var(--sub);margin-bottom:8px}
.composer{display:flex;align-items:flex-end;gap:9px;background:var(--input);border:1px solid var(--border);border-radius:14px;padding:10px}
.composer textarea{flex:1;min-width:0;resize:none;max-height:150px;min-height:28px;border:0;outline:none;background:transparent;color:var(--text);font-size:14px;padding:6px;line-height:1.6}
.send-button{border:0;border-radius:10px;padding:10px 17px;background:var(--blue);color:white;font-weight:800;white-space:nowrap}
.attach-button{border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:var(--panel);color:var(--text);font-size:12px;white-space:nowrap}
.attachment-preview{display:none;align-items:center;gap:10px;margin:8px 0;padding:8px;background:var(--input);border-radius:10px;font-size:12px}
.attachment-preview img{width:55px;height:55px;object-fit:cover;border-radius:7px}.attachment-preview button{margin-left:auto}

/* 利用ルール */
.rules-page{max-width:850px;margin:0 auto 18px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:clamp(18px,3vw,28px);box-shadow:var(--shadow);line-height:1.85}
.rules-page h2{font-size:19px;margin:0 0 8px}
.rules-page h3{font-size:15px;margin:22px 0 7px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.rules-page p,.rules-page li{font-size:13px}
.rules-page ul,.rules-page ol{padding-left:1.5em}
.rules-page li{margin:5px 0}
.rules-note{color:var(--sub);font-size:12px}
.modal{display:none;position:fixed;inset:0;z-index:100;background:#07111dcc;backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex;animation:fade .15s ease}.modal-box{background:var(--panel);color:var(--text);width:100%;max-width:460px;max-height:90dvh;overflow-y:auto;padding:24px;border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 80px #0004;animation:rise .18s ease}
.modal-box h2{margin:0 0 8px;font-size:20px}.auth-description{font-size:13px;color:var(--sub);margin:0 0 18px;line-height:1.7}
.auth-label{display:block;font-size:13px;font-weight:750;margin-bottom:13px}.auth-input{display:block;width:100%;padding:12px;margin-top:7px;border:1px solid var(--border);border-radius:10px;background:var(--input);color:var(--text)}
.auth-primary,.auth-google,.auth-close{width:100%;padding:12px;border-radius:10px;font-weight:750}
.auth-primary{background:var(--blue);color:white;border:0}.auth-google{margin-top:9px;background:var(--input);color:var(--text);border:1px solid var(--border)}.auth-close{margin-top:8px;background:var(--input);color:var(--text);border:0}
.auth-error{color:var(--danger);font-size:13px;overflow-wrap:anywhere;line-height:1.6;white-space:pre-wrap}.auth-link{display:block;background:none;border:0;color:var(--blue);padding:12px 0}
.profile-preview{width:90px;height:90px;border-radius:50%;overflow:hidden;background:var(--blue);color:white;display:grid;place-items:center;font-size:30px;margin:10px auto 16px}
.profile-preview img{width:100%;height:100%;object-fit:cover}.profile-role-view{text-align:center;margin:0 0 16px}
.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.dialog-actions button{min-width:92px}
.toast-region{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--text);color:var(--panel);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:min(360px,calc(100vw - 36px));animation:rise .18s ease}
.loading-line{height:3px;background:var(--blue);position:absolute;top:0;left:0;animation:loading 1.2s ease-in-out infinite}
.overlay{display:none}
@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes loading{0%{width:0;left:0}50%{width:65%;left:18%}100%{width:0;left:100%}}

/* 追加UI：検索・ユーザー一覧・オンライン・メンション */
.top-search{width:min(30vw,260px);min-width:120px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--input);color:var(--text);font-size:12px;transition:border-color .18s,box-shadow .18s}
.top-search:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 15%,transparent);outline:0}
.online-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px color-mix(in srgb,#22c55e 15%,transparent);vertical-align:middle;margin-right:5px}
.offline-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#94a3b8;vertical-align:middle;margin-right:5px}
.user-list{display:grid;gap:8px}.member-row{display:flex;align-items:center;gap:11px;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--input);transition:background .16s,transform .16s}.member-row:hover{background:var(--blue2);transform:translateY(-1px)}.member-meta{min-width:0;flex:1}.member-name{font-weight:800;font-size:13px}.member-status{font-size:11px;color:var(--sub);margin-top:3px}.member-role{font-size:10px;color:var(--sub);margin-left:auto}
.modal-box.wide{max-width:620px}.search-empty{padding:28px;text-align:center;color:var(--sub)}
.mention-menu{position:fixed;z-index:180;display:none;min-width:210px;max-width:min(320px,90vw);max-height:240px;overflow:auto;padding:6px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 40px #0003}.mention-option{display:flex;align-items:center;gap:9px;width:100%;padding:8px;border:0;border-radius:8px;background:transparent;color:var(--text);text-align:left}.mention-option:hover,.mention-option:focus{background:var(--blue2);outline:0}.mention-link{border:0;padding:0;background:transparent;color:var(--blue);font-weight:800;text-decoration:none}.mention-link:hover{text-decoration:underline}.post-content .mention-link,.reply-content .mention-link{font-size:inherit}
.post{will-change:transform,opacity;transition:box-shadow .18s,border-color .18s}.post:hover{border-color:color-mix(in srgb,var(--blue) 28%,var(--border));box-shadow:0 10px 30px #142b4918}
.send-button,.small-button,.top-button,.channel,.member-row{transition:background .16s,color .16s,border-color .16s,transform .16s,box-shadow .16s}
.send-button:disabled{opacity:.6}.post-enter{animation:postEnter .24s cubic-bezier(.2,.75,.25,1) both}.post-leave{opacity:0;transform:translateY(-5px) scale(.99);transition:opacity .14s,transform .14s}
@keyframes postEnter{from{opacity:0;transform:translateY(9px) scale(.992)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:760px){.top-search{width:34vw;min-width:90px;padding:8px}.topbar-right{gap:4px}.user-list{gap:6px}}
@media(prefers-reduced-motion:reduce){.post-enter{animation:none}.post,.member-row{will-change:auto}}

@media(max-width:760px){
 .sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-105%);transition:transform .2s ease;width:285px;min-width:285px;box-shadow:var(--shadow)}
 .sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#0008;z-index:20}
 .menu-button{display:block}.topbar{height:60px;min-height:60px;padding:0 9px;gap:8px}.page-title{font-size:15px}
 .topbar-right{gap:5px}.top-button{font-size:11px;padding:8px 9px}.channel-header{padding:16px}.channel-heading{font-size:18px}
 .messages{padding:12px}.post{padding:14px;border-radius:13px}.composer-area{padding:10px}.composer{gap:6px;padding:7px}.attach-button{padding:9px 8px}.send-button{padding:10px 12px}
 .post-date{width:100%;margin-left:47px}.modal-box{padding:20px}
}
@media(max-width:390px){.top-button{padding:7px;font-size:10px}.home-button .wide-label{display:none}.composer textarea{font-size:13px}.attach-button{font-size:0}.attach-button::first-letter{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body class="auth-pending">
<div class="auth-loading" role="status" aria-live="polite"><div class="auth-loading-inner"><span class="auth-loading-dot"></span><span>ログイン状態を確認しています...</span></div></div>
<div class="app">
 <aside class="sidebar" id="sidebar">
  <div class="brand"><img src="./icon.png" alt="波急"><div><div class="brand-name">波急掲示板</div><div class="brand-sub">NAMIKYU COMMUNITY</div></div></div>
  <div class="category-title">コミュニティ</div>
  <div class="channel-list">
   <button class="channel active" data-page="announcement" data-channel="announcement" onclick="selectChannel('announcement')">📢　運営お知らせ</button>
   <button class="channel" data-page="chat" data-channel="chat" onclick="selectChannel('chat')">💬　チャット</button>
   <button class="channel" data-page="rules" onclick="showRules()">📜　ルール</button>
  </div>
  <div class="sidebar-bottom"><button class="profile-click user-area" onclick="openProfile()"><div class="avatar" id="user-avatar">?</div><div class="user-info"><div class="user-name" id="user-name">未ログイン</div><div class="user-role" id="user-role">未ログイン</div></div></button></div>
 </aside>
 <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
 <main class="main">
  <header class="topbar">
   <button class="menu-button" onclick="toggleSidebar()" aria-label="メニューを開く">☰</button><div class="page-title">波急コミュニティ</div>
   <div class="topbar-right">
    <input class="top-search" id="global-search" type="search" placeholder="投稿を検索..." aria-label="投稿を検索">
    <button class="top-button" id="users-button" onclick="openUsers()">メンバー</button>
    <button class="top-button home-button" onclick="location.href='./index.html'" aria-label="ホームへ戻る">⌂ <span class="wide-label">ホーム</span></button>
    <button class="top-button" id="theme-button" onclick="toggleTheme()">🌙 ダーク</button>
    <button class="top-button" id="profile-button" style="display:none" onclick="openProfile()">プロフィール</button>
    <button class="top-button" id="login-button" onclick="openLogin()">ログイン</button>
   </div>
  </header>
  <section class="content">
   <div class="channel-header"><div class="channel-heading"><span id="channel-icon">📢</span> <span id="channel-name">運営お知らせ</span></div><div class="channel-description" id="channel-description">波急運営からのお知らせを掲載します。</div></div>
   <div class="messages" id="messages" aria-live="polite"><div class="empty"><div class="empty-icon">🔒</div><div class="empty-title">ログインしてください</div></div></div>
   <div class="composer-area" id="composer-area"><div class="composer-inner"><div class="composer-notice" id="composer-notice">投稿にはログインが必要です。</div>
    <div class="attachment-preview" id="attachment-preview"><img id="attachment-thumb" alt="添付画像のプレビュー"><span id="attachment-name">画像を添付</span><button class="small-button" onclick="clearAttachment()">外す</button></div>
    <div class="composer" id="composer">
     <input id="post-image" type="file" accept="image/*" hidden>
     <button class="attach-button" onclick="document.getElementById('post-image').click()" aria-label="画像を添付">📷 画像</button>
     <textarea id="post-input" maxlength="5000" rows="1" placeholder="メッセージを入力..." aria-label="投稿内容"></textarea>
     <button class="send-button" id="send-button" onclick="sendPost()">送信</button>
    </div>
   </div></div>
  </section>
 </main>
</div>

<div class="modal" id="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-title"><div class="modal-box">
 <h2 id="login-title">ログイン</h2><p class="auth-description" id="auth-description">登録済みのアカウントでログインします。</p>
 <label class="auth-label" id="name-label" style="display:none">表示名<input id="display-name" class="auth-input" maxlength="30" placeholder="掲示板で使う名前"></label>
 <label class="auth-label">メールアドレス<input id="email" class="auth-input" type="email" autocomplete="email"></label>
 <label class="auth-label">パスワード<input id="password" class="auth-input" type="password" autocomplete="current-password"></label>
 <button class="auth-primary" id="email-action-button" onclick="emailAction()">ログイン</button>
 <button class="auth-google" id="google-button" onclick="googleSignup()">Googleで新規登録</button>
 <button class="auth-google" id="google-setup-button" onclick="setupGooglePassword()">Googleアカウントの初回パスワード設定</button>
 <p class="auth-error" id="login-error" role="alert"></p><button class="auth-link" id="mode-button" onclick="toggleAuthMode()">新規登録はこちら</button>
 <button class="auth-close" onclick="closeLogin()">閉じる</button>
</div></div>

<div class="modal" id="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profile-title"><div class="modal-box">
 <h2 id="profile-title">プロフィール</h2><div class="profile-preview" id="profile-preview">?</div><div class="profile-role-view" id="profile-role-view"></div>
 <div id="profile-edit-fields">
  <label class="auth-label">アイコン画像<input class="auth-input" id="photo-file" type="file" accept="image/*"></label>
  <label class="auth-label">表示名<input class="auth-input" id="profile-name" maxlength="30" placeholder="表示名"></label>
 </div>
 <p class="auth-error" id="profile-error" role="alert"></p><button class="auth-primary" id="profile-save" onclick="saveProfile()">変更を保存</button>
 <button class="auth-close" onclick="closeProfile()">閉じる</button>
</div></div>

<div class="modal" id="action-modal" role="dialog" aria-modal="true" aria-labelledby="action-title"><div class="modal-box">
 <h2 id="action-title">確認</h2><p class="auth-description" id="action-description"></p>
 <div id="action-editor" style="display:none"><textarea id="action-text" class="auth-input" rows="6" maxlength="5000" style="resize:vertical"></textarea></div>
 <p class="auth-error" id="action-error" role="alert"></p>
 <div class="dialog-actions"><button class="small-button" onclick="closeAction()">キャンセル</button><button class="auth-primary" id="action-confirm" style="width:auto;min-width:100px" onclick="runAction()">実行する</button></div>
</div></div>

function startPresence(){if(presenceTimer)clearInterval(presenceTimer);if(unsubscribePresence)unsubscribePresence();if(!currentUser)return;writePresence();presenceTimer=setInterval(writePresence,30000);unsubscribePresence=onSnapshot(collection(db,"presence"),snap=>{presenceCache={};snap.forEach(d=>presenceCache[d.id]=d.data());if($("users-modal").classList.contains("open"))renderUsers()},()=>{});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")writePresence()})}
function mentionInput(input){let v=input.value,pos=input.selectionStart||0,before=v.slice(0,pos),m=before.match(/(?:^|\s)@([\p{L}\p{N}_-]*)$/u);if(!m){hideMentions();return}let term=m[1].toLocaleLowerCase("ja-JP"),matches=userCache.filter(u=>mentionKey(u.name).startsWith(mentionKey(term))).slice(0,7);if(!matches.length){hideMentions();return}mentionTarget={input,start:pos-m[1].length-1,end:pos};let menu=$("mention-menu"),r=input.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(r.left,innerWidth-330))+"px";menu.style.top=Math.max(8,r.top- matches.length*44-10)+"px";menu.innerHTML=matches.map(u=>`<button class="mention-option" type="button" onclick="insertMention('${esc(u.uid)}')">${avatar(u.name,u.photo,"reply-avatar")}<span>${esc(u.name)}</span></button>`).join("");menu.style.display="block"}
function hideMentions(){$("mention-menu").style.display="none";mentionTarget=null}
function insertMention(uid){if(!mentionTarget)return;let u=userCache.find(x=>x.uid===uid),t=mentionTarget;if(!u)return;let key=String(u.name).replace(/\s+/g,"");let before=t.input.value.slice(0,t.start),after=t.input.value.slice(t.end);t.input.value=before+"@"+key+" "+after;t.input.focus();let pos=(before+"@"+key+" ").length;t.input.setSelectionRange(pos,pos);hideMentions()}
function startPosts(){if(unsubscribePosts)unsubscribePosts();cleanupReplies();if(!currentUser){cachedPosts=[];renderPosts();return}unsubscribePosts=onSnapshot(collection(db,"posts"),s=>{cachedPosts=s.docs.map(d=>({id:d.id,data:d.data()}));cachedPosts.sort((a,b)=>(b.data.createdAt?.toMillis?.()||0)-(a.data.createdAt?.toMillis?.()||0));renderPosts()},e=>{$("messages").textContent="読み込みエラー："+e.message})}
function startReplies(id){if(replyUnsubs.has(id))return;let ref=collection(db,"posts",id,"replies");let unsub=onSnapshot(ref,s=>{let rows=s.docs.map(d=>({id:d.id,data:d.data()}));rows.sort((a,b)=>(a.data.createdAt?.toMillis?.()||0)-(b.data.createdAt?.toMillis?.()||0));replyCache.set(id,rows);replyLoaded.add(id);renderReplies(id)},e=>{let el=$("replies-"+id);if(el)el.textContent="返信を読み込めません："+e.message});replyUnsubs.set(id,unsub)}
function renderReplies(id){
 const area=$("replies-"+id);if(!area)return;
 const rows=replyCache.get(id)||[];
 if(!replyLoaded.has(id)){area.innerHTML="";return}
 if(!rows.length){if(area.children.length!==1||!area.firstElementChild?.classList.contains("no-replies"))area.innerHTML='<div class="no-replies">まだ返信はありません。</div>';return}
 if(area.firstElementChild?.classList.contains("no-replies"))area.innerHTML="";
 let cursor=area.firstElementChild;
 for(const r of rows){
  const d=r.data,can=isStaff()||d.authorUid===currentUser?.uid;
  const sig=JSON.stringify([d.content,d.authorName,d.authorPhoto,d.createdAt?.toMillis?.(),can,roleName(d.authorUid)]);
  let node=document.getElementById("reply-"+id+"-"+r.id);
  if(!node||node.dataset.sig!==sig){
   const html=`<div class="reply" id="reply-${id}-${r.id}" data-sig=""><div class="reply-head">${profileLink(d.authorUid,d.authorName,d.authorPhoto,"reply-avatar")}<span class="reply-date">${dateText(d.createdAt)}</span>${can?`<button class="small-button danger" onclick="removeReply('${id}','${r.id}')">削除</button>`:""}</div><div class="reply-content">${renderText(d.content)}</div></div>`;
   const t=document.createElement("template");t.innerHTML=html;const fresh=t.content.firstElementChild;fresh.dataset.sig=sig;
   if(node){const wasCursor=node===cursor;node.replaceWith(fresh);if(wasCursor)cursor=fresh;}
   else if(cursor)area.insertBefore(fresh,cursor);else area.appendChild(fresh);
   node=fresh;
  }
  if(cursor&&cursor.parentNode!==area)cursor=area.firstElementChild;
  if(node!==cursor)area.insertBefore(node,cursor);
  cursor=node.nextElementSibling;
 }
 const keep=new Set(rows.map(r=>"reply-"+id+"-"+r.id));
 for(const child of [...area.children])if(child.id&&!keep.has(child.id))child.remove();
}
async function sendPost(){let input=$("post-input"),content=input.value.trim();if(!content&&!pendingImage)return;if(!currentUser)return;if(currentChannel==="announcement"&&!isStaff())return toast("運営メンバーのみ投稿できます。");let btn=$("send-button");btn.disabled=true;btn.textContent="送信中…";try{let created=await addDoc(collection(db,"posts"),{channel:currentChannel,content,authorUid:currentUser.uid,authorName:nameOf(),authorPhoto:currentProfile.photoData||"",imageData:pendingImage||"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});input.value="";input.style.height="auto";clearAttachment();toast("投稿しました。")}catch(e){toast("投稿できません："+e.message)}finally{btn.textContent="送信";updateComposer()}}

async function imageData(file,maxBytes,maxSide){if(!file.type.startsWith("image/"))throw Error("画像ファイルを選択してください。");if(file.size>10*1024*1024)throw Error("元画像は10MB以下にしてください。");let bmp=await createImageBitmap(file),scale=Math.min(1,maxSide/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(bmp.width*scale));c.height=Math.max(1,Math.round(bmp.height*scale));c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);bmp.close();for(let q of [.82,.72,.62,.52,.42]){let data=c.toDataURL("image/jpeg",q),bytes=Math.ceil((data.length-data.indexOf(",")-1)*.75);if(bytes<=maxBytes)return data}throw Error("画像を圧縮しても容量制限を超えています。別の画像を選んでください。")}

function suspensionIsActive(data){if(!data||data.active!==true)return false;let until=data.until?.toDate?.()|| (data.until instanceof Date?data.until:null);return !!until&&until.getTime()>Date.now()}
function suspensionUntilText(data){let until=data?.until?.toDate?.()||(data?.until instanceof Date?data.until:null);return until?until.toLocaleString("ja-JP")+(" まで"):""}

async function confirmSuspend(){if(!isStaff()||!suspensionTargetUid)throw Error("操作権限がありません。");let message=$("suspend-message").value.trim();if(!message) return $("suspend-error").textContent="表示するメッセージを入力してください。";let hours=Number($("suspend-duration").value);if(![1,24,168,720].includes(hours))return $("suspend-error").textContent="凍結期間を選択してください。";let btn=$("suspend-confirm");btn.disabled=true;try{await setDoc(doc(db,"accountSuspensions",suspensionTargetUid),{active:true,message,until:new Date(Date.now()+hours*3600000),updatedAt:serverTimestamp(),updatedBy:currentUser.uid});toast("アカウントを一時凍結しました。");closeSuspendModal();if(viewedProfileUid===suspensionTargetUid)await viewProfile(suspensionTargetUid)}catch(e){$("suspend-error").textContent="凍結できません："+e.message}finally{btn.disabled=false}}

async function syncUser(user){
 const version=++authSyncVersion;
 if(!user){
  if(suspensionUnsub)suspensionUnsub();suspensionUnsub=null;
  currentUser=null;currentProfile={};roles={};
  if(presenceTimer)clearInterval(presenceTimer);presenceTimer=null;
  if(unsubscribePresence)unsubscribePresence();unsubscribePresence=null;
  if(unsubscribePosts)unsubscribePosts();unsubscribePosts=null;cleanupReplies();
  presenceCache={};cachedPosts=[];
  $("user-name").textContent="未ログイン";$("user-role").textContent="未ログイン";$("user-avatar").textContent="?";
  $("login-button").textContent="ログイン";$("login-button").onclick=openLogin;$("profile-button").style.display="none";
  updateComposer();renderPosts();return;
 }
 try{
  const token=await getIdTokenResult(user);
  if(version!==authSyncVersion)return;
  if(token.claims.firebase?.sign_in_provider!=="password"){
   await signOut(auth);
   if(version===authSyncVersion){$("login-error").textContent="メールアドレスとパスワードでログインしてください。";$("login-modal").classList.add("open");}
   return;
  }
  const suspensionSnap=await getDoc(doc(db,"accountSuspensions",user.uid));
  if(version!==authSyncVersion||auth.currentUser?.uid!==user.uid)return;
  if(suspensionSnap.exists()&&suspensionIsActive(suspensionSnap.data())){const data=suspensionSnap.data();await signOut(auth);showSuspendedNotice(data);return;}
  currentUser=user;currentProfile={};roles={};updateUserArea();updateComposer();
  const [p,r]=await Promise.all([getDoc(doc(db,"profiles",user.uid)),getDocs(collection(db,"staffRoles"))]);
  if(version!==authSyncVersion||auth.currentUser?.uid!==user.uid)return;
  currentProfile=p.exists()?p.data():{};roles={};r.forEach(x=>roles[x.id]=x.data());
  updateUserArea();updateComposer();startPosts();startPresence();loadUsers();
  if(suspensionUnsub)suspensionUnsub();
  suspensionUnsub=onSnapshot(doc(db,"accountSuspensions",user.uid),async snap=>{if(!snap.exists())return;let data=snap.data();if(suspensionIsActive(data)&&auth.currentUser?.uid===user.uid){await signOut(auth);showSuspendedNotice(data)}},e=>console.warn("suspension listener:",e.message));
 }catch(e){
  if(version!==authSyncVersion)return;
  console.error(e);$("messages").textContent="アカウント情報を読み込めません："+e.message;
 }
}
