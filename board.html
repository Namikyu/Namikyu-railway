
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142B49">
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<title>掲示板 | 波急公式サイト</title>
<style>
:root{color-scheme:light;--bg:#eef2f7;--panel:#fff;--sidebar:#142b49;--text:#172b45;--sub:#718096;--border:#dce3ec;--blue:#2878c8;--input:#f5f7fa}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101923;--panel:#192635;--sidebar:#101d2d;--text:#e8eef6;--sub:#9baabd;--border:#304052;--blue:#58a5ef;--input:#243446}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}
.app{display:flex;width:100%;height:100vh}
.sidebar{width:270px;min-width:270px;background:var(--sidebar);color:white;display:flex;flex-direction:column;padding:20px 14px;z-index:10}
.brand{display:flex;align-items:center;gap:11px;padding:5px 8px 22px;border-bottom:1px solid #ffffff29}
.brand img{width:42px;height:42px;object-fit:contain}
.brand-name{font-size:19px;font-weight:bold}.brand-sub{font-size:11px;opacity:.7;margin-top:3px}
.category-title{margin:24px 8px 9px;font-size:12px;font-weight:bold;opacity:.7}
.channel-list{display:flex;flex-direction:column;gap:5px}
.channel{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-radius:7px;background:transparent;color:inherit;text-align:left;font-size:14px}
.channel:hover{background:#ffffff1a}.channel.active{background:#2878c8;color:white;font-weight:bold}
.sidebar-bottom{margin-top:auto;border-top:1px solid #ffffff29;padding:15px 8px 0}
.user-area{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;min-width:38px;border-radius:50%;background:#2878c8;display:grid;place-items:center;color:white;font-weight:bold}
.user-info{min-width:0}.user-name{font-size:13px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-role{font-size:11px;opacity:.7;margin-top:3px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:68px;min-height:68px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px}
.menu-button{display:none;border:0;background:transparent;color:var(--text);font-size:23px}.page-title{font-size:18px;font-weight:bold}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.top-button{font-size:12px;color:var(--text);padding:8px 11px;border:1px solid var(--border);border-radius:20px;background:var(--input)}
.content{flex:1;min-height:0;display:flex;flex-direction:column}
.channel-header{background:var(--panel);border-bottom:1px solid var(--border);padding:20px 26px}
.channel-heading{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:bold}
.channel-description{margin-top:7px;font-size:13px;color:var(--sub)}
.messages{flex:1;overflow-y:auto;padding:25px}
.empty{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--sub)}
.empty-icon{font-size:48px;margin-bottom:15px}.empty-title{font-size:18px;font-weight:bold;color:var(--text);margin-bottom:8px}
.post{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:17px;margin-bottom:15px}
.post-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.post-avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;font-weight:bold}
.post-author{font-size:14px;font-weight:bold}.post-role{font-size:11px;color:var(--blue)}
.post-date{font-size:11px;color:var(--sub);margin-left:auto}
.post-content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;margin:14px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.small-button{border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:6px;padding:6px 10px;font-size:12px}
.reply-list{border-top:1px solid var(--border);margin-top:13px;padding-top:10px}
.reply{padding:9px 0;font-size:13px;line-height:1.7;border-bottom:1px solid var(--border)}
.reply-author{font-weight:bold}.reply-date{font-size:10px;color:var(--sub);margin-left:7px}
.reply-form{display:flex;gap:7px;margin-top:10px}.reply-form input{flex:1;min-width:0;padding:9px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--text)}
.composer-area{padding:15px 24px 22px;background:var(--panel);border-top:1px solid var(--border)}
.composer-notice{font-size:12px;color:var(--sub);margin-bottom:10px}
.composer{display:flex;align-items:center;gap:10px;background:var(--input);border:1px solid var(--border);border-radius:9px;padding:10px 13px}
.composer textarea{flex:1;min-width:0;resize:none;max-height:110px;min-height:25px;border:0;outline:none;background:transparent;color:var(--text);font-size:14px}
.send-button{border:0;border-radius:7px;padding:9px 16px;background:var(--blue);color:white;font-weight:bold}
.modal{display:none;position:fixed;inset:0;z-index:100;background:#0009;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}.modal-box{background:var(--panel);color:var(--text);width:100%;max-width:420px;max-height:90vh;overflow-y:auto;padding:25px;border-radius:14px}
.modal-box h2{margin:0 0 8px}.auth-description{font-size:13px;color:var(--sub);margin:0 0 20px;line-height:1.6}
.auth-label{display:block;font-size:13px;font-weight:bold;margin-bottom:14px}
.auth-input{display:block;width:100%;padding:12px;margin-top:7px;border:1px solid var(--border);border-radius:7px;background:var(--input);color:var(--text)}
.auth-primary,.auth-google,.auth-close{width:100%;padding:12px;border-radius:7px}
.auth-primary{background:#2878c8;color:white;border:0;font-weight:bold}
.auth-google{margin-top:10px;background:var(--input);color:var(--text);border:1px solid var(--border)}
.auth-close{margin-top:8px;background:var(--input);color:var(--text);border:0}
.auth-error{color:#e34e58;font-size:13px;overflow-wrap:anywhere;line-height:1.7;white-space:pre-wrap}
.auth-link{display:block;background:none;border:0;color:var(--blue);padding:12px 0}
@media(max-width:700px){.sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s;width:280px}
.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#0007;z-index:5}
.menu-button{display:block}.topbar{padding:0 12px}.channel-header{padding:17px}.messages{padding:13px}.composer-area{padding:12px}
.top-button{font-size:11px;padding:7px 8px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><img src="./icon.png" alt="波急"><div><div class="brand-name">波急掲示板</div><div class="brand-sub">NAMIKYU COMMUNITY</div></div></div>
 <div class="category-title">掲示板カテゴリ</div>
 <div class="channel-list">
  <button class="channel active" data-channel="announcement" onclick="selectChannel('announcement')">📢 運営お知らせ</button>
  <button class="channel" data-channel="chat" onclick="selectChannel('chat')">💬 チャット</button>
 </div>
 <div class="sidebar-bottom"><div class="user-area"><div class="avatar" id="user-avatar">?</div><div class="user-info"><div class="user-name" id="user-name">未ログイン</div><div class="user-role" id="user-role">未ログイン</div></div></div></div>
</aside>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<main class="main">
 <header class="topbar">
  <button class="menu-button" onclick="toggleSidebar()">☰</button><div class="page-title">掲示板</div>
  <div class="topbar-right">
   <button class="top-button" id="theme-button" onclick="toggleTheme()">🌙 ダーク</button>
   <button class="top-button" id="login-button" onclick="openLogin()">ログイン</button>
  </div>
 </header>
 <section class="content">
  <div class="channel-header"><div class="channel-heading"><span id="channel-icon">📢</span><span id="channel-name">運営お知らせ</span></div><div class="channel-description" id="channel-description">波急運営からのお知らせを掲載します。</div></div>
  <div class="messages" id="messages"><div class="empty"><div class="empty-icon">📭</div><div class="empty-title">ログインしてください</div></div></div>
  <div class="composer-area"><div class="composer-notice" id="composer-notice">投稿にはログインが必要です。</div>
   <div class="composer" id="composer"><textarea id="post-input" maxlength="5000" rows="1" placeholder="メッセージを入力..."></textarea><button class="send-button" id="send-button" onclick="sendPost()">送信</button></div>
  </div>
 </section>
</main>
</div>
<div class="modal" id="login-modal"><div class="modal-box">
 <h2 id="login-title">ログイン</h2><p class="auth-description" id="auth-description">登録済みのアカウントでログインします。</p>
 <label class="auth-label" id="name-label" style="display:none">表示名<input id="display-name" class="auth-input" maxlength="30" placeholder="掲示板で使う名前"></label>
 <label class="auth-label">メールアドレス<input id="email" class="auth-input" type="email" autocomplete="email"></label>
 <label class="auth-label">パスワード<input id="password" class="auth-input" type="password" autocomplete="current-password"></label>
 <button class="auth-primary" id="email-action-button" onclick="emailAction()">ログイン</button>
 <button class="auth-google" id="google-button" onclick="googleSignup()">Googleで新規登録</button>
 <button class="auth-google" id="google-setup-button" onclick="setupGooglePassword()">既存Googleアカウントにパスワード設定</button>
 <p class="auth-error" id="login-error"></p>
 <button class="auth-link" id="mode-button" onclick="toggleAuthMode()">新規登録はこちら</button>
 <button class="auth-close" onclick="closeLogin()">閉じる</button>
</div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,browserLocalPersistence,setPersistence,createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,onAuthStateChanged,signOut,EmailAuthProvider,linkWithCredential,getAdditionalUserInfo}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import{getFirestore,collection,addDoc,onSnapshot,doc,updateDoc,deleteDoc,getDocs,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAw45Gj7Hl9mwOT-Tb1HL7VYxhkD2RDmZQ",authDomain:"namikyu-board.firebaseapp.com",projectId:"namikyu-board",storageBucket:"namikyu-board.firebasestorage.app",messagingSenderId:"597333464774",appId:"1:597333464774:web:773305ab5ad97b55d2a9c7",measurementId:"G-5EFRPTWRMJ"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});
const OWNER_UID="kv2lmeIrYrN3J7T4GWTaJau7MtY2";
let authMode="login",currentChannel=localStorage.getItem("board-channel")||"announcement",currentUser=null,unsubscribePosts=null,cachedPosts=[];
const settings={announcement:{name:"運営お知らせ",icon:"📢",description:"波急運営からのお知らせを掲載します。"},chat:{name:"チャット",icon:"💬",description:"メンバー同士で自由に交流できる場所です。"}};
const $=id=>document.getElementById(id),isOwner=()=>currentUser?.uid===OWNER_UID;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateText=v=>v?.toDate?v.toDate().toLocaleString("ja-JP"):"送信直後";
function applyTheme(){let t=localStorage.getItem("board-theme")||"light";document.documentElement.dataset.theme=t;$("theme-button").textContent=t==="dark"?"☀️ ホワイト":"🌙 ダーク"}
function toggleTheme(){localStorage.setItem("board-theme",document.documentElement.dataset.theme==="dark"?"light":"dark");applyTheme()}
function selectChannel(c){if(!settings[c])return;currentChannel=c;localStorage.setItem("board-channel",c);$("channel-name").textContent=settings[c].name;$("channel-icon").textContent=settings[c].icon;$("channel-description").textContent=settings[c].description;document.querySelectorAll(".channel").forEach(b=>b.classList.toggle("active",b.dataset.channel===c));updateComposer();renderPosts();closeSidebar()}
function toggleSidebar(){$("sidebar").classList.toggle("open");$("overlay").classList.toggle("show")}
function closeSidebar(){$("sidebar").classList.remove("open");$("overlay").classList.remove("show")}
function openLogin(){if(currentUser){logout();return}$("login-modal").classList.add("open");$("login-error").textContent=""}
function closeLogin(){$("login-modal").classList.remove("open")}
function toggleAuthMode(){authMode=authMode==="login"?"signup":"login";updateAuthMode()}
function updateAuthMode(){let s=authMode==="signup";$("login-title").textContent=s?"新規登録":"ログイン";$("auth-description").textContent=s?"メール登録またはGoogle登録ができます。":"メールアドレスとパスワードでログインします。";$("email-action-button").textContent=s?"メールで新規登録":"ログイン";$("google-button").style.display=s?"block":"none";$("google-setup-button").style.display=s?"none":"block";$("mode-button").textContent=s?"ログインはこちら":"新規登録はこちら";$("name-label").style.display=s?"block":"none";$("password").autocomplete=s?"new-password":"current-password";$("login-error").textContent=""}
function showError(e){const m={"auth/invalid-email":"メールアドレスの形式が正しくありません。","auth/email-already-in-use":"このメールアドレスは登録済みです。","auth/weak-password":"パスワードは6文字以上にしてください。","auth/invalid-credential":"メールアドレスまたはパスワードが違います。","auth/account-exists-with-different-credential":"このメールアドレスは別の方法で登録済みです。","auth/unauthorized-domain":"Firebaseの承認済みドメインを確認してください。","auth/popup-blocked":"ブラウザでポップアップを許可してください。","auth/popup-closed-by-user":"Google認証画面が閉じられました。","auth/credential-already-in-use":"このメールアドレスは別のアカウントで使用されています。"};$("login-error").textContent=(m[e.code]||e.message||"認証に失敗しました。")+"\n"+(e.code||"");console.error(e)}
async function emailAction(){let email=$("email").value.trim(),pass=$("password").value,name=$("display-name").value.trim();try{$("login-error").textContent="";if(!email||!pass)throw Error("メールアドレスとパスワードを入力してください。");await setPersistence(auth,browserLocalPersistence);if(authMode==="signup"){if(!name)throw Error("表示名を入力してください。");let r=await createUserWithEmailAndPassword(auth,email,pass);await updateProfile(r.user,{displayName:name})}else await signInWithEmailAndPassword(auth,email,pass);closeLogin()}catch(e){showError(e)}}
async function googleSignup(){try{let pass=$("password").value,name=$("display-name").value.trim();if(!pass||pass.length<6)throw Error("Google登録後に使うパスワードを6文字以上で入力してください。");if(!name)throw Error("先に表示名を入力してください。");await setPersistence(auth,browserLocalPersistence);let r=await signInWithPopup(auth,provider);if(!getAdditionalUserInfo(r)?.isNewUser){await signOut(auth);throw Error("このGoogleアカウントは既に登録されています。ログイン画面から「既存Googleアカウントにパスワード設定」を選んでください。")}await linkWithCredential(r.user,EmailAuthProvider.credential(r.user.email,pass));await updateProfile(r.user,{displayName:name});closeLogin()}catch(e){showError(e)}}
async function setupGooglePassword(){try{let pass=$("password").value;if(!pass||pass.length<6)throw Error("設定するパスワードを6文字以上で入力してください。");await setPersistence(auth,browserLocalPersistence);let r=await signInWithPopup(auth,provider);if(r.user.providerData.some(p=>p.providerId==="password"))throw Error("このアカウントには既にパスワードが設定されています。メールアドレスとパスワードでログインしてください。");await linkWithCredential(r.user,EmailAuthProvider.credential(r.user.email,pass));closeLogin();alert("パスワードを設定しました。次回からメールアドレスとパスワードでログインできます。")}catch(e){showError(e)}}
async function logout(){if(confirm("ログアウトしますか？"))await signOut(auth)}
function updateComposer(){let ok=!!currentUser&&(currentChannel==="chat"||isOwner());$("post-input").disabled=!ok;$("send-button").disabled=!ok;$("composer").style.display=ok?"flex":"none";$("composer-notice").textContent=!currentUser?"投稿にはログインが必要です。":currentChannel==="announcement"&&!isOwner()?"運営メンバーのみ投稿できます。":"Enterで送信、Shift+Enterで改行できます。"}
function renderPosts(){let area=$("messages"),list=cachedPosts.filter(p=>p.data.channel===currentChannel);if(!currentUser){area.innerHTML='<div class="empty"><div class="empty-icon">🔒</div><div class="empty-title">ログインしてください</div></div>';return}if(!list.length){area.innerHTML='<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">まだ投稿はありません</div></div>';return}area.innerHTML=list.map(p=>{let d=p.data,manage=isOwner()||(d.authorUid===currentUser.uid&&d.channel==="chat");return `<article class="post"><div class="post-head"><div class="post-avatar">${esc((d.authorName||"?")[0])}</div><span class="post-author">${esc(d.authorName)}</span><span class="post-role">${d.authorUid===OWNER_UID?"オーナー":"メンバー"}</span><span class="post-date">${dateText(d.createdAt)}</span></div><div class="post-content">${esc(d.content)}</div><div class="actions"><button class="small-button" onclick="loadReplies('${p.id}')">返信を見る</button>${manage?`<button class="small-button" onclick="editPost('${p.id}')">編集</button><button class="small-button" onclick="removePost('${p.id}')">削除</button>`:""}</div><div class="reply-list" id="replies-${p.id}"></div><div class="reply-form"><input id="reply-input-${p.id}" maxlength="3000" placeholder="返信を入力..." onkeydown="replyKey(event,'${p.id}')"><button class="small-button" onclick="sendReply('${p.id}')">返信</button></div></article>`}).join("");list.forEach(p=>loadReplies(p.id))}
function startPosts(){if(unsubscribePosts)unsubscribePosts();if(!currentUser){cachedPosts=[];renderPosts();return}unsubscribePosts=onSnapshot(collection(db,"posts"),s=>{cachedPosts=s.docs.map(d=>({id:d.id,data:d.data()}));cachedPosts.sort((a,b)=>(b.data.createdAt?.toMillis?.()||0)-(a.data.createdAt?.toMillis?.()||0));renderPosts()},e=>{$("messages").textContent="読み込みエラー："+e.message})}
async function sendPost(){let input=$("post-input"),content=input.value.trim();if(!content||!currentUser)return;if(currentChannel==="announcement"&&!isOwner())return alert("運営メンバーのみ投稿できます。");try{await addDoc(collection(db,"posts"),{channel:currentChannel,content,authorUid:currentUser.uid,authorName:currentUser.displayName||currentUser.email?.split("@")[0]||"メンバー",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});input.value=""}catch(e){alert("投稿できません："+e.message)}}
async function loadReplies(id){let area=$("replies-"+id);if(!area||!currentUser)return;try{let s=await getDocs(collection(db,"posts",id,"replies"));area.innerHTML=s.docs.map(r=>{let d=r.data(),can=isOwner()||d.authorUid===currentUser.uid;return `<div class="reply"><span class="reply-author">${esc(d.authorName)}</span><span class="reply-date">${dateText(d.createdAt)}</span>${can?`<button class="small-button" onclick="removeReply('${id}','${r.id}')">返信を削除</button>`:""}<div>${esc(d.content)}</div></div>`}).join("")||'<div class="reply">まだ返信はありません。</div>'}catch(e){area.textContent="返信を読み込めません："+e.message}}
async function sendReply(id){let input=$("reply-input-"+id),content=input?.value.trim();if(!content||!currentUser)return;try{await addDoc(collection(db,"posts",id,"replies"),{content,authorUid:currentUser.uid,authorName:currentUser.displayName||currentUser.email?.split("@")[0]||"メンバー",createdAt:serverTimestamp()});input.value="";await loadReplies(id)}catch(e){alert("返信できません："+e.message)}}
async function removeReply(postId,replyId){if(!confirm("この返信を削除しますか？"))return;try{await deleteDoc(doc(db,"posts",postId,"replies",replyId));await loadReplies(postId)}catch(e){alert("返信を削除できません："+e.message)}}
async function editPost(id){let p=cachedPosts.find(x=>x.id===id);if(!p)return;let c=prompt("投稿内容を編集",p.data.content);if(c===null)return;if(!c.trim())return alert("本文を入力してください。");try{await updateDoc(doc(db,"posts",id),{content:c.trim(),updatedAt:serverTimestamp()})}catch(e){alert("編集できません："+e.message)}}
async function removePost(id){if(!confirm("この投稿を削除しますか？"))return;try{await deleteDoc(doc(db,"posts",id))}catch(e){alert("削除できません："+e.message)}}
function replyKey(e,id){if(e.key==="Enter"){e.preventDefault();sendReply(id)}}
function postKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendPost()}}
onAuthStateChanged(auth,u=>{currentUser=u;let b=$("login-button");if(u){let n=u.displayName||u.email?.split("@")[0]||"メンバー";b.textContent="ログアウト";b.onclick=logout;$("user-name").textContent=n;$("user-role").textContent=isOwner()?"オーナー":"メンバー";$("user-avatar").textContent=Array.from(n)[0]||"?"}else{b.textContent="ログイン";b.onclick=openLogin;$("user-name").textContent="未ログイン";$("user-role").textContent="未ログイン";$("user-avatar").textContent="?"}updateComposer();startPosts()});
$("post-input").addEventListener("keydown",postKey);
applyTheme();updateAuthMode();selectChannel(settings[currentChannel]?currentChannel:"announcement");
Object.assign(window,{selectChannel,toggleSidebar,closeSidebar,openLogin,closeLogin,toggleAuthMode,emailAction,googleSignup,setupGooglePassword,toggleTheme,sendPost,loadReplies,sendReply,replyKey,editPost,removePost,removeReply,logout});
</script>
</body>
</html>
