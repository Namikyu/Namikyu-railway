
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142B49">
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<title>掲示板 | 波急公式サイト</title>
<style>
:root{color-scheme:light;--bg:#eef2f7;--panel:#fff;--sidebar:#142b49;--text:#172b45;--sub:#718096;--border:#dce3ec;--blue:#2878c8;--input:#f5f7fa}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#101923;--panel:#192635;--sidebar:#101d2d;--text:#e8eef6;--sub:#9baabd;--border:#304052;--blue:#58a5ef;--input:#243446}}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}
.app{display:flex;width:100%;height:100vh}
.sidebar{width:270px;min-width:270px;background:var(--sidebar);color:white;display:flex;flex-direction:column;padding:20px 14px;z-index:10}
.brand{display:flex;align-items:center;gap:11px;padding:5px 8px 22px;border-bottom:1px solid #ffffff29}
.brand img{width:42px;height:42px;object-fit:contain}
.brand-name{font-size:19px;font-weight:bold}.brand-sub{font-size:11px;opacity:.7;margin-top:3px}
.category-title{margin:24px 8px 9px;font-size:12px;font-weight:bold;opacity:.7}
.channel-list{display:flex;flex-direction:column;gap:5px}
.channel{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-radius:7px;background:transparent;color:inherit;text-align:left;font-size:14px}
.channel:hover{background:#ffffff1a}.channel.active{background:#2878c8;color:white;font-weight:bold}
.channel-icon{width:20px;text-align:center;font-size:17px}
.sidebar-bottom{margin-top:auto;border-top:1px solid #ffffff29;padding:15px 8px 0}
.user-area{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;min-width:38px;border-radius:50%;background:#2878c8;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold}
.user-info{min-width:0}.user-name{font-size:13px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-role{font-size:11px;opacity:.7;margin-top:3px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:68px;min-height:68px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px}
.menu-button{display:none;border:0;background:transparent;color:var(--text);font-size:23px}
.page-title{font-size:18px;font-weight:bold}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.login-status,.notice-button{font-size:13px;color:var(--sub);padding:8px 12px;border:1px solid var(--border);border-radius:20px;background:transparent}
.content{flex:1;min-height:0;display:flex;flex-direction:column}
.channel-header{background:var(--panel);border-bottom:1px solid var(--border);padding:20px 26px}
.channel-heading{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:bold}
.channel-description{margin-top:7px;font-size:13px;color:var(--sub)}
.messages{flex:1;overflow-y:auto;padding:25px}
.empty{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--sub)}
.empty-icon{font-size:48px;margin-bottom:15px}
.empty-title{font-size:18px;font-weight:bold;color:var(--text);margin-bottom:8px}
.empty-description{font-size:13px;line-height:1.8}
.post{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:17px;margin-bottom:15px}
.post-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.post-avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;font-weight:bold}
.post-author{font-size:14px;font-weight:bold}
.post-role{font-size:11px;color:var(--blue)}
.post-date{font-size:11px;color:var(--sub);margin-left:auto}
.post-content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;margin:14px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.small-button{border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:6px;padding:6px 10px;font-size:12px}
.reply-list{border-top:1px solid var(--border);margin-top:13px;padding-top:10px}
.reply{padding:8px 0;font-size:13px;line-height:1.7;border-bottom:1px solid var(--border)}
.reply-author{font-weight:bold}.reply-date{font-size:10px;color:var(--sub);margin-left:7px}
.reply-form{display:flex;gap:7px;margin-top:10px}
.reply-form input{flex:1;min-width:0;padding:9px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--text)}
.composer-area{padding:15px 24px 22px;background:var(--panel);border-top:1px solid var(--border)}
.composer-notice{font-size:12px;color:var(--sub);margin-bottom:10px}
.composer{display:flex;align-items:center;gap:10px;background:var(--input);border:1px solid var(--border);border-radius:9px;padding:12px 15px}
.composer input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--text);font-size:14px}
.send-button{border:0;border-radius:7px;padding:9px 16px;background:var(--blue);color:white;font-weight:bold}
.modal{display:none;position:fixed;inset:0;z-index:100;background:#0009;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{background:var(--panel);color:var(--text);width:100%;max-width:420px;max-height:90vh;overflow-y:auto;padding:25px;border-radius:14px}
.modal-box h2{margin:0 0 8px}
.auth-description{font-size:13px;color:var(--sub);margin:0 0 20px;line-height:1.6}
.auth-label{display:block;font-size:13px;font-weight:bold;margin-bottom:14px}
.auth-input{display:block;width:100%;padding:12px;margin-top:7px;border:1px solid var(--border);border-radius:7px;background:var(--input);color:var(--text)}
.auth-primary,.auth-google,.auth-close{width:100%;padding:12px;border-radius:7px}
.auth-primary{background:#2878c8;color:white;border:0;font-weight:bold}
.auth-google{margin-top:10px;background:var(--input);color:var(--text);border:1px solid var(--border)}
.auth-close{margin-top:8px;background:var(--input);color:var(--text);border:0}
.auth-error{color:#e34e58;font-size:13px;overflow-wrap:anywhere;line-height:1.7;white-space:pre-wrap}
.auth-link{display:block;background:none;border:0;color:var(--blue);padding:12px 0}
@media(max-width:700px){
.sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s;width:280px}
.sidebar.open{transform:translateX(0)}
.overlay.show{display:block;position:fixed;inset:0;background:#0007;z-index:5}
.menu-button{display:block}.topbar{padding:0 14px}
.channel-header{padding:17px}.messages{padding:13px}
.composer-area{padding:12px}.login-status{font-size:11px;padding:7px 9px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><img src="./icon.png" alt="波急"><div><div class="brand-name">波急掲示板</div><div class="brand-sub">NAMIKYU COMMUNITY</div></div></div>
 <div class="category-title">掲示板カテゴリ</div>
 <div class="channel-list">
  <button class="channel active" data-channel="announcement" onclick="selectChannel('announcement')">📢 運営お知らせ</button>
  <button class="channel" data-channel="chat" onclick="selectChannel('chat')">💬 チャット</button>
 </div>
 <div class="sidebar-bottom"><div class="user-area"><div class="avatar" id="user-avatar">?</div><div class="user-info"><div class="user-name" id="user-name">未ログイン</div><div class="user-role" id="user-role">未ログイン</div></div></div></div>
</aside>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<main class="main">
 <header class="topbar">
  <button class="menu-button" onclick="toggleSidebar()">☰</button>
  <div class="page-title">掲示板</div>
  <div class="topbar-right"><button class="login-status" id="login-button" onclick="openLogin()">ログイン・新規登録</button></div>
 </header>
 <section class="content">
  <div class="channel-header">
   <div class="channel-heading"><span id="channel-icon">📢</span><span id="channel-name">運営お知らせ</span></div>
   <div class="channel-description" id="channel-description">波急運営からのお知らせを掲載します。</div>
  </div>
  <div class="messages" id="messages"><div class="empty"><div class="empty-icon">📭</div><div class="empty-title">まだ投稿はありません</div><div class="empty-description">ログインすると掲示板を利用できます。</div></div></div>
  <div class="composer-area"><div class="composer-notice" id="composer-notice">投稿にはログインが必要です。</div><div class="composer" id="composer"><input id="post-input" maxlength="5000" placeholder="メッセージを入力..." disabled><button class="send-button" id="send-button" onclick="sendPost()" disabled>送信</button></div></div>
 </section>
</main>
</div>

<div class="modal" id="login-modal"><div class="modal-box">
 <h2 id="login-title">ログイン</h2>
 <p class="auth-description" id="auth-description">登録済みのアカウントでログインします。</p>
 <label class="auth-label" id="name-label" style="display:none">表示名<input id="display-name" class="auth-input" maxlength="30" placeholder="掲示板で使う名前"></label>
 <label class="auth-label">メールアドレス<input id="email" class="auth-input" type="email" autocomplete="email"></label>
 <label class="auth-label">パスワード<input id="password" class="auth-input" type="password" autocomplete="current-password"></label>
 <button class="auth-primary" id="email-action-button" onclick="emailAction()">ログイン</button>
 <button class="auth-google" id="google-button" onclick="googleLogin()">Googleでログイン</button>
 <p class="auth-error" id="login-error"></p>
 <button class="auth-link" id="mode-button" onclick="toggleAuthMode()">新規登録はこちら</button>
 <button class="auth-close" onclick="closeLogin()">閉じる</button>
</div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,browserLocalPersistence,setPersistence,createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import{getFirestore,collection,addDoc,onSnapshot,doc,updateDoc,deleteDoc,getDocs,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyAw45Gj7Hl9mwOT-Tb1HL7VYxhkK2D2RDmZQ",
 authDomain:"namikyu-board.firebaseapp.com",
 projectId:"namikyu-board",
 storageBucket:"namikyu-board.firebasestorage.app",
 messagingSenderId:"597333464774",
 appId:"1:597333464774:web:773305ab5ad97b55d2a9c7",
 measurementId:"G-5EFRPTWRMJ"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const googleProvider=new GoogleAuthProvider();
googleProvider.setCustomParameters({prompt:"select_account"});

const OWNER_UID="kv2lmeIrYrN3J7T4GWTaJau7MtY2";
let authMode="login",currentChannel="announcement",currentUser=null,unsubscribePosts=null;

const settings={
 announcement:{name:"運営お知らせ",icon:"📢",description:"波急運営からのお知らせを掲載します。"},
 chat:{name:"チャット",icon:"💬",description:"メンバー同士で自由に交流できる場所です。"}
};

const $=id=>document.getElementById(id);
const isOwner=()=>currentUser?.uid===OWNER_UID;
const escapeHTML=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateText=value=>value?.toDate?value.toDate().toLocaleString("ja-JP"):"送信直後";

function selectChannel(channel){
 if(!settings[channel])return;
 currentChannel=channel;
 $("channel-name").textContent=settings[channel].name;
 $("channel-icon").textContent=settings[channel].icon;
 $("channel-description").textContent=settings[channel].description;
 document.querySelectorAll(".channel").forEach(b=>b.classList.toggle("active",b.dataset.channel===channel));
 updateComposer();renderPosts();closeSidebar();
}

function updateComposer(){
 const allowed=!!currentUser&&(currentChannel==="chat"||isOwner());
 $("post-input").disabled=!allowed;
 $("send-button").disabled=!allowed;
 $("composer").style.display=allowed?"flex":"none";
 $("composer-notice").textContent=!currentUser?"投稿にはログインが必要です。":currentChannel==="announcement"&&!isOwner()?"運営メンバーのみ投稿できます。":"メッセージを入力して送信できます。";
}

function toggleSidebar(){$("sidebar").classList.toggle("open");$("overlay").classList.toggle("show")}
function closeSidebar(){$("sidebar").classList.remove("open");$("overlay").classList.remove("show")}
function openLogin(){if(currentUser){logout();return}$("login-modal").classList.add("open");$("login-error").textContent=""}
function closeLogin(){$("login-modal").classList.remove("open")}
function toggleAuthMode(){authMode=authMode==="login"?"signup":"login";updateAuthMode()}

function updateAuthMode(){
 const signup=authMode==="signup";
 $("login-title").textContent=signup?"新規登録":"ログイン";
 $("auth-description").textContent=signup?"新しいアカウントを作成します。":"登録済みのアカウントでログインします。";
 $("email-action-button").textContent=signup?"アカウントを作成":"ログイン";
 $("google-button").textContent=signup?"Googleで新規登録":"Googleでログイン";
 $("mode-button").textContent=signup?"ログインはこちら":"新規登録はこちら";
 $("name-label").style.display=signup?"block":"none";
 $("password").autocomplete=signup?"new-password":"current-password";
 $("login-error").textContent="";
}

function showError(error){
 const messages={
 "auth/invalid-email":"メールアドレスの形式が正しくありません。",
 "auth/email-already-in-use":"このメールアドレスは登録済みです。",
 "auth/weak-password":"パスワードは6文字以上にしてください。",
 "auth/invalid-credential":"メールアドレスまたはパスワードが違います。",
 "auth/unauthorized-domain":"Firebaseの承認済みドメインを確認してください。",
 "auth/popup-blocked":"ブラウザでポップアップを許可してください。",
 "auth/popup-closed-by-user":"Googleログイン画面が閉じられました。",
 "auth/network-request-failed":"ネットワーク接続を確認してください。"
 };
 $("login-error").textContent=(messages[error.code]||error.message||"認証に失敗しました。")+"\n"+(error.code||"");
 console.error(error);
}

async function emailAction(){
 const email=$("email").value.trim(),password=$("password").value,name=$("display-name").value.trim();
 try{
  $("login-error").textContent="";
  if(!email||!password)throw Error("メールアドレスとパスワードを入力してください。");
  if(authMode==="signup"&&!name)throw Error("表示名を入力してください。");
  await setPersistence(auth,browserLocalPersistence);
  if(authMode==="signup"){
   const result=await createUserWithEmailAndPassword(auth,email,password);
   await updateProfile(result.user,{displayName:name});
  }else await signInWithEmailAndPassword(auth,email,password);
  closeLogin();
 }catch(e){showError(e)}
}

async function googleLogin(){
 try{
  await setPersistence(auth,browserLocalPersistence);
  await signInWithPopup(auth,googleProvider);
  closeLogin();
 }catch(e){showError(e)}
}

async function logout(){
 if(confirm("ログアウトしますか？"))await signOut(auth);
}

function renderPosts(posts=[]){
 const area=$("messages");
 const filtered=posts.filter(p=>p.data.channel===currentChannel);
 if(!currentUser){area.innerHTML='<div class="empty"><div class="empty-icon">🔒</div><div class="empty-title">ログインしてください</div></div>';return}
 if(!filtered.length){area.innerHTML='<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">まだ投稿はありません</div><div class="empty-description">最初の投稿をしてみましょう。</div></div>';return}
 area.innerHTML=filtered.map(p=>{
  const d=p.data,owner=isOwner(),mine=d.authorUid===currentUser.uid;
  const canManage=owner||(mine&&d.channel==="chat");
  return `<article class="post" id="post-${p.id}">
   <div class="post-head"><div class="post-avatar">${escapeHTML((d.authorName||"?")[0])}</div>
   <span class="post-author">${escapeHTML(d.authorName)}</span>
   <span class="post-role">${d.authorUid===OWNER_UID?"オーナー":"メンバー"}</span>
   <span class="post-date">${dateText(d.createdAt)}</span></div>
   <div class="post-content">${escapeHTML(d.content)}</div>
   <div class="actions">
    <button class="small-button" onclick="loadReplies('${p.id}')">返信を見る</button>
    ${canManage?`<button class="small-button" onclick="editPost('${p.id}')">編集</button><button class="small-button" onclick="removePost('${p.id}')">削除</button>`:""}
   </div>
   <div class="reply-list" id="replies-${p.id}"></div>
   <div class="reply-form"><input id="reply-input-${p.id}" maxlength="3000" placeholder="返信を入力..."><button class="small-button" onclick="sendReply('${p.id}')">返信</button></div>
  </article>`;
 }).join("");
 filtered.forEach(p=>loadReplies(p.id));
}

let cachedPosts=[];
function startPosts(){
 if(unsubscribePosts)unsubscribePosts();
 if(!currentUser){cachedPosts=[];renderPosts();return}
 unsubscribePosts=onSnapshot(collection(db,"posts"),snapshot=>{
  cachedPosts=snapshot.docs.map(d=>({id:d.id,data:d.data()}));
  cachedPosts.sort((a,b)=>(b.data.createdAt?.toMillis?.()||0)-(a.data.createdAt?.toMillis?.()||0));
  renderPosts(cachedPosts);
 },error=>{$("messages").textContent="投稿の読み込みに失敗しました："+error.message;console.error(error)});
}

async function sendPost(){
 const content=$("post-input").value.trim();
 if(!content||!currentUser)return;
 if(currentChannel==="announcement"&&!isOwner()){alert("運営メンバーのみ投稿できます。");return}
 try{
  await addDoc(collection(db,"posts"),{
   channel:currentChannel,content,
   authorUid:currentUser.uid,
   authorName:currentUser.displayName||currentUser.email?.split("@")[0]||"メンバー",
   createdAt:serverTimestamp(),updatedAt:serverTimestamp()
  });
  $("post-input").value="";
 }catch(e){alert("投稿できませんでした："+e.message);console.error(e)}
}

async function loadReplies(postId){
 const area=$("replies-"+postId);
 if(!area||!currentUser)return;
 try{
  const snap=await getDocs(collection(db,"posts",postId,"replies"));
  area.innerHTML=snap.docs.map(r=>{
   const d=r.data();
   return `<div class="reply"><span class="reply-author">${escapeHTML(d.authorName)}</span><span class="reply-date">${dateText(d.createdAt)}</span><div>${escapeHTML(d.content)}</div></div>`;
  }).join("")||'<div class="reply">まだ返信はありません。</div>';
 }catch(e){area.textContent="返信を読み込めませんでした。"}
}

async function sendReply(postId){
 const input=$("reply-input-"+postId),content=input?.value.trim();
 if(!content||!currentUser)return;
 try{
  await addDoc(collection(db,"posts",postId,"replies"),{
   content,authorUid:currentUser.uid,
   authorName:currentUser.displayName||currentUser.email?.split("@")[0]||"メンバー",
   createdAt:serverTimestamp()
  });
  input.value="";await loadReplies(postId);
 }catch(e){alert("返信できませんでした："+e.message);console.error(e)}
}

async function editPost(postId){
 const post=cachedPosts.find(p=>p.id===postId);
 if(!post)return;
 const content=prompt("投稿内容を編集",post.data.content);
 if(content===null)return;
 if(!content.trim())return alert("本文を入力してください。");
 try{
  await updateDoc(doc(db,"posts",postId),{content:content.trim(),updatedAt:serverTimestamp()});
 }catch(e){alert("編集できませんでした："+e.message);console.error(e)}
}

async function removePost(postId){
 if(!confirm("この投稿を削除しますか？"))return;
 try{await deleteDoc(doc(db,"posts",postId))}
 catch(e){alert("削除できませんでした："+e.message);console.error(e)}
}

onAuthStateChanged(auth,user=>{
 currentUser=user;
 const button=$("login-button");
 if(user){
  const name=user.displayName||user.email?.split("@")[0]||"メンバー";
  button.textContent="ログアウト";button.onclick=logout;
  $("user-name").textContent=name;
  $("user-role").textContent=isOwner()?"オーナー":"メンバー";
  $("user-avatar").textContent=Array.from(name)[0]||"?";
 }else{
  button.textContent="ログイン・新規登録";button.onclick=openLogin;
  $("user-name").textContent="未ログイン";
  $("user-role").textContent="未ログイン";
  $("user-avatar").textContent="?";
 }
 updateComposer();startPosts();
});

Object.assign(window,{selectChannel,toggleSidebar,closeSidebar,openLogin,closeLogin,toggleAuthMode,emailAction,googleLogin,sendPost,loadReplies,sendReply,editPost,removePost});
</script>
</body>
</html>
