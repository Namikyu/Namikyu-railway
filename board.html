
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142B49">
<link rel="icon" href="./icon.png">
<title>掲示板 | 波急公式サイト</title>
<script>
try{document.documentElement.dataset.theme=localStorage.getItem("board-theme")||"light"}catch(e){}
</script>
<style>
:root{color-scheme:light;--bg:#eef2f7;--panel:#fff;--side:#fff;--sideText:#172b45;--text:#172b45;--sub:#718096;--border:#dce3ec;--blue:#2878c8;--input:#f5f7fa;--shadow:0 5px 20px #142b4910}
:root[data-theme=dark]{color-scheme:dark;--bg:#101923;--panel:#192635;--side:#142235;--sideText:#e8eef6;--text:#e8eef6;--sub:#9baabd;--border:#304052;--blue:#58a5ef;--input:#243446;--shadow:0 5px 20px #0003}
*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;transition:background .15s,color .15s}
button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}
.app{display:flex;width:100%;height:100vh}.sidebar{width:260px;min-width:260px;background:var(--side);color:var(--sideText);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;z-index:10}
.brand{display:flex;align-items:center;gap:11px;padding:5px 8px 22px;border-bottom:1px solid var(--border)}.brand img{width:42px;height:42px;object-fit:contain}
.brand-name{font-size:19px;font-weight:bold}.brand-sub{font-size:11px;color:var(--sub);margin-top:3px}
.category-title{margin:24px 8px 9px;font-size:12px;font-weight:bold;color:var(--sub)}.channel-list{display:flex;flex-direction:column;gap:5px}
.channel{padding:12px;border:0;border-radius:8px;background:transparent;color:inherit;text-align:left;font-size:14px}.channel:hover{background:var(--input)}.channel.active{background:#2878c8;color:white;font-weight:bold}
.sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding:15px 5px 0}.user-area{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;min-width:40px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:white;font-weight:bold;overflow:hidden}
.avatar img,.post-avatar img,.reply-avatar img{width:100%;height:100%;object-fit:cover}
.user-info{min-width:0}.user-name{font-size:13px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-role{font-size:11px;color:var(--sub);margin-top:3px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:66px;min-height:66px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px}
.menu-button{display:none;border:0;background:transparent;color:var(--text);font-size:23px}.page-title{font-size:18px;font-weight:bold}.topbar-right{margin-left:auto;display:flex;gap:8px}
.top-button{font-size:12px;color:var(--text);padding:8px 12px;border:1px solid var(--border);border-radius:20px;background:var(--input)}
.content{flex:1;min-height:0;display:flex;flex-direction:column}.channel-header{background:var(--panel);border-bottom:1px solid var(--border);padding:20px 26px}
.channel-heading{font-size:20px;font-weight:bold}.channel-description{margin-top:7px;font-size:13px;color:var(--sub)}
.messages{flex:1;overflow-y:auto;padding:24px}.empty{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--sub)}
.empty-icon{font-size:44px;margin-bottom:14px}.empty-title{font-size:17px;font-weight:bold;color:var(--text);margin-bottom:8px}
.post{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:17px;margin-bottom:15px;box-shadow:var(--shadow)}
.post-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.profile-click{border:0;background:none;padding:0;color:inherit;display:inline-flex;align-items:center;gap:8px;text-align:left}
.post-avatar,.reply-avatar{width:36px;height:36px;min-width:36px;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;font-weight:bold;overflow:hidden}
.post-author{font-size:14px;font-weight:bold}.post-author:hover{text-decoration:underline}.post-role{font-size:11px;font-weight:bold;padding:3px 8px;border-radius:20px;background:var(--input);color:var(--sub)}
.role-owner{background:#fff1bd;color:#9b6800}.role-developer{background:#eee1ff;color:#7540b5}.role-moderator{background:#ffe1ee;color:#bd3974}
.post-date{font-size:11px;color:var(--sub);margin-left:auto}.post-content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;margin:14px 0}
.post-image{display:block;max-width:min(100%,680px);max-height:460px;object-fit:contain;border-radius:9px;margin:12px 0;border:1px solid var(--border);background:var(--input)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.small-button{border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:7px;padding:7px 11px;font-size:12px}
.reply-list{border-top:1px solid var(--border);margin-top:14px;padding-top:9px}.reply{padding:10px 0;font-size:13px;line-height:1.7;border-bottom:1px solid var(--border)}
.reply-head{display:flex;align-items:center;gap:8px}.reply-avatar{width:28px;height:28px;min-width:28px}.reply-author{font-weight:bold}.reply-date{font-size:10px;color:var(--sub)}.reply-content{margin:5px 0 0 36px;white-space:pre-wrap;overflow-wrap:anywhere}
.reply-form{display:flex;gap:7px;margin-top:11px}.reply-form input{flex:1;min-width:0;padding:10px;border:1px solid var(--border);border-radius:7px;background:var(--input);color:var(--text)}
.composer-area{padding:13px 22px 18px;background:var(--panel);border-top:1px solid var(--border)}.composer-notice{font-size:12px;color:var(--sub);margin-bottom:9px}
.composer{display:flex;align-items:flex-end;gap:9px;background:var(--input);border:1px solid var(--border);border-radius:10px;padding:10px}
.composer textarea{flex:1;min-width:0;resize:none;max-height:120px;min-height:25px;border:0;outline:none;background:transparent;color:var(--text);font-size:14px;padding:5px}
.send-button{border:0;border-radius:8px;padding:10px 17px;background:var(--blue);color:white;font-weight:bold}.attach-button{border:1px solid var(--border);border-radius:8px;padding:9px 11px;background:var(--panel);color:var(--text);font-size:13px}
.attachment-preview{display:none;align-items:center;gap:10px;margin:8px 0;padding:8px;background:var(--input);border-radius:8px;font-size:12px}
.attachment-preview img{width:55px;height:55px;object-fit:cover;border-radius:6px}.attachment-preview button{margin-left:auto}
.modal{display:none;position:fixed;inset:0;z-index:100;background:#0009;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}
.modal-box{background:var(--panel);color:var(--text);width:100%;max-width:440px;max-height:90vh;overflow-y:auto;padding:24px;border-radius:14px;box-shadow:var(--shadow)}
.modal-box h2{margin:0 0 8px;font-size:20px}.auth-description{font-size:13px;color:var(--sub);margin:0 0 18px;line-height:1.6}
.auth-label{display:block;font-size:13px;font-weight:bold;margin-bottom:13px}.auth-input{display:block;width:100%;padding:11px;margin-top:7px;border:1px solid var(--border);border-radius:8px;background:var(--input);color:var(--text)}
.auth-primary,.auth-google,.auth-close{width:100%;padding:12px;border-radius:8px}.auth-primary{background:#2878c8;color:white;border:0;font-weight:bold}
.auth-google{margin-top:9px;background:var(--input);color:var(--text);border:1px solid var(--border)}.auth-close{margin-top:8px;background:var(--input);color:var(--text);border:0}
.auth-error{color:#e34e58;font-size:13px;overflow-wrap:anywhere;line-height:1.6;white-space:pre-wrap}.auth-link{display:block;background:none;border:0;color:var(--blue);padding:12px 0}
.profile-preview{width:90px;height:90px;border-radius:50%;overflow:hidden;background:var(--blue);color:white;display:grid;place-items:center;font-size:30px;margin:10px auto 16px}
.profile-preview img{width:100%;height:100%;object-fit:cover}.profile-role-view{text-align:center;margin:0 0 16px}
.overlay{display:none}
@media(max-width:700px){.sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s;width:280px}.sidebar.open{transform:translateX(0)}
.overlay.show{display:block;position:fixed;inset:0;background:#0007;z-index:5}.menu-button{display:block}.topbar{padding:0 11px}.channel-header{padding:16px}.messages{padding:12px}.composer-area{padding:11px}.top-button{font-size:11px;padding:7px 9px}.post{padding:13px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><img src="./icon.png" alt="波急"><div><div class="brand-name">波急掲示板</div><div class="brand-sub">NAMIKYU COMMUNITY</div></div></div>
 <div class="category-title">掲示板カテゴリ</div>
 <div class="channel-list">
  <button class="channel active" data-channel="announcement" onclick="selectChannel('announcement')">📢 運営お知らせ</button>
  <button class="channel" data-channel="chat" onclick="selectChannel('chat')">💬 チャット</button>
 </div>
 <div class="sidebar-bottom"><button class="profile-click" onclick="openProfile()"><div class="avatar" id="user-avatar">?</div><div class="user-info"><div class="user-name" id="user-name">未ログイン</div><div class="user-role" id="user-role">未ログイン</div></div></button></div>
</aside>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<main class="main">
 <header class="topbar"><button class="menu-button" onclick="toggleSidebar()">☰</button><div class="page-title">掲示板</div>
  <div class="topbar-right">
   <button class="top-button" id="theme-button" onclick="toggleTheme()">🌙 ダーク</button>
   <button class="top-button" id="profile-button" style="display:none" onclick="openProfile()">プロフィール</button>
   <button class="top-button" id="login-button" onclick="openLogin()">ログイン</button>
  </div>
 </header>
 <section class="content">
  <div class="channel-header"><div class="channel-heading"><span id="channel-icon">📢</span> <span id="channel-name">運営お知らせ</span></div><div class="channel-description" id="channel-description">波急運営からのお知らせを掲載します。</div></div>
  <div class="messages" id="messages"><div class="empty"><div class="empty-icon">🔒</div><div class="empty-title">ログインしてください</div></div></div>
  <div class="composer-area"><div class="composer-notice" id="composer-notice">投稿にはログインが必要です。</div>
   <div class="attachment-preview" id="attachment-preview"><img id="attachment-thumb" alt=""><span id="attachment-name">画像を添付</span><button class="small-button" onclick="clearAttachment()">画像を外す</button></div>
   <div class="composer" id="composer">
    <input id="post-image" type="file" accept="image/*" hidden>
    <button class="attach-button" onclick="document.getElementById('post-image').click()">📷 画像</button>
    <textarea id="post-input" maxlength="5000" rows="1" placeholder="メッセージを入力..."></textarea>
    <button class="send-button" id="send-button" onclick="sendPost()">送信</button>
   </div>
  </div>
 </section>
</main>
</div>

<div class="modal" id="login-modal"><div class="modal-box">
 <h2 id="login-title">ログイン</h2><p class="auth-description" id="auth-description">登録済みのアカウントでログインします。</p>
 <label class="auth-label" id="name-label" style="display:none">表示名<input id="display-name" class="auth-input" maxlength="30" placeholder="掲示板で使う名前"></label>
 <label class="auth-label">メールアドレス<input id="email" class="auth-input" type="email" autocomplete="email"></label>
 <label class="auth-label">パスワード<input id="password" class="auth-input" type="password" autocomplete="current-password"></label>
 <button class="auth-primary" id="email-action-button" onclick="emailAction()">ログイン</button>
 <button class="auth-google" id="google-button" onclick="googleSignup()">Googleで新規登録</button>
 <button class="auth-google" id="google-setup-button" onclick="setupGooglePassword()">Googleアカウントの初回パスワード設定</button>
 <p class="auth-error" id="login-error"></p>
 <button class="auth-link" id="mode-button" onclick="toggleAuthMode()">新規登録はこちら</button>
 <button class="auth-close" onclick="closeLogin()">閉じる</button>
</div></div>

<div class="modal" id="profile-modal"><div class="modal-box">
 <h2 id="profile-title">プロフィール</h2>
 <div class="profile-preview" id="profile-preview">?</div>
 <div class="profile-role-view" id="profile-role-view"></div>
 <div id="profile-edit-fields">
  <label class="auth-label">アイコン画像<input class="auth-input" id="photo-file" type="file" accept="image/*"></label>
  <label class="auth-label">表示名<input class="auth-input" id="profile-name" maxlength="30" placeholder="表示名"></label>
 </div>
 <p class="auth-error" id="profile-error"></p>
 <button class="auth-primary" id="profile-save" onclick="saveProfile()">変更を保存</button>
 <button class="auth-close" onclick="closeProfile()">閉じる</button>
</div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,browserLocalPersistence,setPersistence,createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,onAuthStateChanged,signOut,EmailAuthProvider,linkWithCredential,getAdditionalUserInfo,getIdTokenResult}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import{getFirestore,collection,addDoc,onSnapshot,doc,updateDoc,deleteDoc,getDocs,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAw45Gj7Hl9mwOT-Tb1HL7VYxhkD2RDmZQ",authDomain:"namikyu-board.firebaseapp.com",projectId:"namikyu-board",storageBucket:"namikyu-board.firebasestorage.app",messagingSenderId:"597333464774",appId:"1:597333464774:web:773305ab5ad97b55d2a9c7",measurementId:"G-5EFRPTWRMJ"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});
const OWNER_UID="kv2lmeIrYrN3J7T4GWTaJau7MtY2";
const $=id=>document.getElementById(id);
let authMode="login",currentChannel=localStorage.getItem("board-channel")||"announcement";
let currentUser=null,currentProfile={},roles={},unsubscribePosts=null,cachedPosts=[],authFlow=false;
let pendingImage="",profileImage="",profileViewUid=null;
const settings={announcement:{name:"運営お知らせ",icon:"📢",description:"波急運営からのお知らせを掲載します。"},chat:{name:"チャット",icon:"💬",description:"メンバー同士で自由に交流できる場所です。"}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeImage=s=>typeof s==="string"&&s.startsWith("data:image/jpeg;base64,")&&s.length<700000?s:"";
const roleOf=uid=>uid===OWNER_UID?{role:"owner",status:"active"}:(roles[uid]||{});
const activeRole=uid=>{let r=roleOf(uid);return r.status==="active"?r.role:"member"};
const roleName=uid=>({owner:"オーナー",developer:"デベロッパー",moderator:"モデレーター"}[activeRole(uid)]||"メンバー");
const roleClass=uid=>({owner:"role-owner",developer:"role-developer",moderator:"role-moderator"}[activeRole(uid)]||"");
const isStaff=()=>["owner","developer","moderator"].includes(activeRole(currentUser?.uid));
const isOwner=()=>activeRole(currentUser?.uid)==="owner";
const canManage=(p)=>isStaff()||(p.authorUid===currentUser?.uid&&p.channel==="chat");
const nameOf=()=>currentProfile.displayName||currentUser?.displayName||currentUser?.email?.split("@")[0]||"メンバー";
const dateText=v=>v?.toDate?v.toDate().toLocaleString("ja-JP"):"送信直後";
function avatar(name,photo,cls="post-avatar"){return `<div class="${cls}">${safeImage(photo)?`<img src="${safeImage(photo)}" alt="">`:esc(Array.from(name||"?")[0])}</div>`}
function profileLink(uid,name,photo,cls="post-avatar"){return `<button class="profile-click" onclick="viewProfile('${esc(uid)}')">${avatar(name,photo,cls)}<span class="post-author">${esc(name||"メンバー")}</span></button>`}

function applyTheme(){let t=document.documentElement.dataset.theme||"light";$("theme-button").textContent=t==="dark"?"☀️ ホワイト":"🌙 ダーク"}
function toggleTheme(){let t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;localStorage.setItem("board-theme",t);applyTheme()}
function selectChannel(c){if(!settings[c])return;currentChannel=c;localStorage.setItem("board-channel",c);$("channel-name").textContent=settings[c].name;$("channel-icon").textContent=settings[c].icon;$("channel-description").textContent=settings[c].description;document.querySelectorAll(".channel").forEach(b=>b.classList.toggle("active",b.dataset.channel===c));updateComposer();renderPosts();closeSidebar()}
function toggleSidebar(){$("sidebar").classList.toggle("open");$("overlay").classList.toggle("show")}
function closeSidebar(){$("sidebar").classList.remove("open");$("overlay").classList.remove("show")}
function openLogin(){if(currentUser){logout();return}$("login-modal").classList.add("open");$("login-error").textContent=""}
function closeLogin(){$("login-modal").classList.remove("open")}
function toggleAuthMode(){authMode=authMode==="login"?"signup":"login";updateAuthMode()}
function updateAuthMode(){let s=authMode==="signup";$("login-title").textContent=s?"新規登録":"ログイン";$("auth-description").textContent=s?"メールまたはGoogleで新規登録できます。":"メールアドレスとパスワードでログインします。";$("email-action-button").textContent=s?"メールで新規登録":"ログイン";$("google-button").style.display=s?"block":"none";$("google-setup-button").style.display=s?"block":"none";$("mode-button").textContent=s?"ログインはこちら":"新規登録はこちら";$("name-label").style.display=s?"block":"none";$("password").autocomplete=s?"new-password":"current-password";$("login-error").textContent=""}
function showError(e){const m={"auth/invalid-email":"メールアドレスの形式が正しくありません。","auth/email-already-in-use":"このメールアドレスは登録済みです。","auth/weak-password":"パスワードは6文字以上にしてください。","auth/invalid-credential":"メールアドレスまたはパスワードが違います。","auth/account-exists-with-different-credential":"このメールアドレスは別の方法で登録済みです。","auth/unauthorized-domain":"Firebaseの承認済みドメインを確認してください。","auth/popup-blocked":"ブラウザでポップアップを許可してください。","auth/popup-closed-by-user":"Google認証画面が閉じられました。","auth/credential-already-in-use":"このメールアドレスは別のアカウントで使用されています。"};$("login-error").textContent=(m[e.code]||e.message||"認証に失敗しました。")+"\n"+(e.code||"");console.error(e)}
async function emailAction(){let email=$("email").value.trim(),pass=$("password").value,name=$("display-name").value.trim();try{$("login-error").textContent="";if(!email||!pass)throw Error("メールアドレスとパスワードを入力してください。");if(authMode==="signup"){if(!name)throw Error("表示名を入力してください。");if(pass.length<6)throw Error("パスワードは6文字以上にしてください。");let r=await createUserWithEmailAndPassword(auth,email,pass);await updateProfile(r.user,{displayName:name});await setDoc(doc(db,"profiles",r.user.uid),{displayName:name,photoData:"",updatedAt:serverTimestamp()})}else await signInWithEmailAndPassword(auth,email,pass);closeLogin()}catch(e){showError(e)}}
async function googleSignup(){let pass=$("password").value,name=$("display-name").value.trim();try{if(pass.length<6)throw Error("パスワードを6文字以上で入力してください。");if(!name)throw Error("表示名を入力してください。");authFlow=true;await setPersistence(auth,browserLocalPersistence);let r=await signInWithPopup(auth,provider);if(!getAdditionalUserInfo(r)?.isNewUser){await signOut(auth);throw Error("このGoogleアカウントは既に登録されています。メールアドレスとパスワードでログインしてください。")}await linkWithCredential(r.user,EmailAuthProvider.credential(r.user.email,pass));await updateProfile(r.user,{displayName:name});await setDoc(doc(db,"profiles",r.user.uid),{displayName:name,photoData:"",updatedAt:serverTimestamp()});await signOut(auth);await signInWithEmailAndPassword(auth,r.user.email,pass);closeLogin()}catch(e){showError(e)}finally{authFlow=false;await syncUser(auth.currentUser)}}
async function setupGooglePassword(){let pass=$("password").value;try{if(pass.length<6)throw Error("設定するパスワードを6文字以上で入力してください。");authFlow=true;await setPersistence(auth,browserLocalPersistence);let r=await signInWithPopup(auth,provider);if(r.user.providerData.some(p=>p.providerId==="password")){await signOut(auth);throw Error("このアカウントには既にパスワードが設定されています。ログイン画面からメールアドレスとパスワードでログインしてください。")}await linkWithCredential(r.user,EmailAuthProvider.credential(r.user.email,pass));await signOut(auth);$("login-error").textContent="パスワードを設定しました。メールアドレスとパスワードでログインしてください。";authMode="login";updateAuthMode()}catch(e){showError(e)}finally{authFlow=false;await syncUser(auth.currentUser)}}
async function logout(){if(confirm("ログアウトしますか？"))await signOut(auth)}
function updateUserArea(){let n=nameOf(),photo=currentProfile.photoData;$("user-name").textContent=n;$("user-role").textContent=roleName(currentUser.uid);$("user-avatar").innerHTML=safeImage(photo)?`<img src="${safeImage(photo)}" alt="">`:esc(Array.from(n)[0]||"?");$("login-button").textContent="ログアウト";$("login-button").onclick=logout;$("profile-button").style.display="block"}
function updateComposer(){let ok=!!currentUser&&(currentChannel==="chat"||isStaff());$("post-input").disabled=!ok;$("send-button").disabled=!ok;$("composer").style.display=ok?"flex":"none";$("composer-notice").textContent=!currentUser?"投稿にはログインが必要です。":currentChannel==="announcement"&&!isStaff()?"運営メンバーのみ投稿できます。":"📷 画像は1枚まで・圧縮後450KB以内。Enterで送信、Shift+Enterで改行。"}
function renderPosts(){let area=$("messages"),list=cachedPosts.filter(p=>p.data.channel===currentChannel);if(!currentUser){area.innerHTML='<div class="empty"><div class="empty-icon">🔒</div><div class="empty-title">ログインしてください</div></div>';return}if(!list.length){area.innerHTML='<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">まだ投稿はありません</div><div>最初の投稿をしてみましょう。</div></div>';return}
area.innerHTML=list.map(p=>{let d=p.data,manage=canManage(d),img=safeImage(d.imageData);return `<article class="post"><div class="post-head">${profileLink(d.authorUid,d.authorName,d.authorPhoto)}<span class="post-role ${roleClass(d.authorUid)}">${roleName(d.authorUid)}</span><span class="post-date">${dateText(d.createdAt)}</span></div><div class="post-content">${esc(d.content)}</div>${img?`<img class="post-image" src="${img}" alt="投稿画像" loading="lazy">`:""}<div class="actions"><button class="small-button" onclick="loadReplies('${p.id}')">返信を見る</button>${manage?`<button class="small-button" onclick="editPost('${p.id}')">編集</button><button class="small-button" onclick="removePost('${p.id}')">削除</button>`:""}</div><div class="reply-list" id="replies-${p.id}"></div><div class="reply-form"><input id="reply-input-${p.id}" maxlength="3000" placeholder="返信を書く..." onkeydown="replyKey(event,'${p.id}')"><button class="small-button" onclick="sendReply('${p.id}')">返信</button></div></article>`}).join("");list.forEach(p=>loadReplies(p.id))}
function startPosts(){if(unsubscribePosts)unsubscribePosts();if(!currentUser){cachedPosts=[];renderPosts();return}unsubscribePosts=onSnapshot(collection(db,"posts"),s=>{cachedPosts=s.docs.map(d=>({id:d.id,data:d.data()}));cachedPosts.sort((a,b)=>(b.data.createdAt?.toMillis?.()||0)-(a.data.createdAt?.toMillis?.()||0));renderPosts()},e=>{$("messages").textContent="読み込みエラー："+e.message})}
async function sendPost(){let input=$("post-input"),content=input.value.trim();if(!content&&!pendingImage)return;if(!currentUser)return;if(currentChannel==="announcement"&&!isStaff())return alert("運営メンバーのみ投稿できます。");try{await addDoc(collection(db,"posts"),{channel:currentChannel,content,authorUid:currentUser.uid,authorName:nameOf(),authorPhoto:currentProfile.photoData||"",imageData:pendingImage||"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});input.value="";clearAttachment()}catch(e){alert("投稿できません："+e.message)}}
async function loadReplies(id){let area=$("replies-"+id);if(!area||!currentUser)return;try{let s=await getDocs(collection(db,"posts",id,"replies"));area.innerHTML=s.docs.map(r=>{let d=r.data(),can=isStaff()||d.authorUid===currentUser.uid;return `<div class="reply"><div class="reply-head">${profileLink(d.authorUid,d.authorName,d.authorPhoto,"reply-avatar")}<span class="reply-date">${dateText(d.createdAt)}</span>${can?`<button class="small-button" onclick="removeReply('${id}','${r.id}')">削除</button>`:""}</div><div class="reply-content">${esc(d.content)}</div></div>`}).join("")||'<div class="reply">まだ返信はありません。</div>'}catch(e){area.textContent="返信を読み込めません："+e.message}}
async function sendReply(id){let input=$("reply-input-"+id),content=input?.value.trim();if(!content||!currentUser)return;try{await addDoc(collection(db,"posts",id,"replies"),{content,authorUid:currentUser.uid,authorName:nameOf(),authorPhoto:currentProfile.photoData||"",createdAt:serverTimestamp()});input.value="";await loadReplies(id)}catch(e){alert("返信できません："+e.message)}}
async function removeReply(postId,replyId){if(!confirm("この返信を削除しますか？"))return;try{await deleteDoc(doc(db,"posts",postId,"replies",replyId));await loadReplies(postId)}catch(e){alert("削除できません："+e.message)}}
async function editPost(id){let p=cachedPosts.find(x=>x.id===id);if(!p)return;let c=prompt("投稿内容を編集",p.data.content);if(c===null)return;if(!c.trim()&&!p.data.imageData)return alert("本文または画像が必要です。");try{await updateDoc(doc(db,"posts",id),{content:c.trim(),updatedAt:serverTimestamp()})}catch(e){alert("編集できません："+e.message)}}
async function removePost(id){if(!confirm("この投稿を削除しますか？"))return;try{await deleteDoc(doc(db,"posts",id))}catch(e){alert("削除できません："+e.message)}}
function replyKey(e,id){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendReply(id)}}
function postKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendPost()}}
async function imageData(file,maxBytes,maxSide){if(!file.type.startsWith("image/"))throw Error("画像ファイルを選択してください。");if(file.size>10*1024*1024)throw Error("元画像は10MB以下にしてください。");let bmp=await createImageBitmap(file),scale=Math.min(1,maxSide/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(bmp.width*scale));c.height=Math.max(1,Math.round(bmp.height*scale));c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);bmp.close();for(let q of [.82,.72,.62,.52,.42]){let data=c.toDataURL("image/jpeg",q),bytes=Math.ceil((data.length-data.indexOf(",")-1)*.75);if(bytes<=maxBytes)return data}throw Error("画像を圧縮しても容量制限を超えています。別の画像を選んでください。")}
async function choosePostImage(e){let f=e.target.files?.[0];if(!f)return;try{pendingImage=await imageData(f,450*1024,1280);$("attachment-thumb").src=pendingImage;$("attachment-name").textContent=f.name;$("attachment-preview").style.display="flex"}catch(err){alert(err.message)}e.target.value=""}
function clearAttachment(){pendingImage="";$("attachment-preview").style.display="none";$("attachment-thumb").removeAttribute("src")}
function openProfile(){if(!currentUser)return;profileViewUid=currentUser.uid;profileImage=currentProfile.photoData||"";$("profile-title").textContent="プロフィール設定";$("profile-edit-fields").style.display="block";$("profile-name").value=nameOf();$("profile-save").style.display="block";$("profile-error").textContent="";updateProfilePreview();setProfileRole(currentUser.uid);$("profile-modal").classList.add("open")}
async function viewProfile(uid){if(!currentUser||!uid)return;if(uid===currentUser.uid)return openProfile();try{let s=await getDoc(doc(db,"profiles",uid)),p=s.exists()?s.data():{};profileViewUid=uid;profileImage=p.photoData||"";$("profile-title").textContent="プロフィール";$("profile-edit-fields").style.display="none";$("profile-save").style.display="none";$("profile-error").textContent="";$("profile-preview").innerHTML=safeImage(profileImage)?`<img src="${safeImage(profileImage)}" alt="">`:esc(Array.from(p.displayName||"メンバー")[0]);$("profile-name").value=p.displayName||"メンバー";setProfileRole(uid);$("profile-modal").classList.add("open")}catch(e){alert("プロフィールを読み込めません："+e.message)}}
function setProfileRole(uid){let r=roleName(uid),cl=roleClass(uid);$("profile-role-view").innerHTML=`<span class="post-role ${cl}">${esc(r)}</span>`}
function closeProfile(){$("profile-modal").classList.remove("open")}
function updateProfilePreview(){let n=$("profile-name").value.trim()||"?";$("profile-preview").innerHTML=safeImage(profileImage)?`<img src="${safeImage(profileImage)}" alt="">`:esc(Array.from(n)[0])}
async function saveProfile(){let name=$("profile-name").value.trim();try{if(!name)throw Error("表示名を入力してください。");if(name.length>30)throw Error("表示名は30文字以内にしてください。");$("profile-save").disabled=true;await updateProfile(auth.currentUser,{displayName:name});await setDoc(doc(db,"profiles",currentUser.uid),{displayName:name,photoData:profileImage||"",updatedAt:serverTimestamp()},{merge:true});currentProfile={displayName:name,photoData:profileImage||""};updateUserArea();closeProfile();renderPosts()}catch(e){$("profile-error").textContent=e.message}finally{$("profile-save").disabled=false}}
async function syncUser(user){if(!user){currentUser=null;currentProfile={};roles={};if(unsubscribePosts)unsubscribePosts();$("user-name").textContent="未ログイン";$("user-role").textContent="未ログイン";$("user-avatar").textContent="?";$("login-button").textContent="ログイン";$("login-button").onclick=openLogin;$("profile-button").style.display="none";updateComposer();startPosts();return}
try{let token=await getIdTokenResult(user);if(token.claims.firebase?.sign_in_provider!=="password"){await signOut(auth);$("login-error").textContent="メールアドレスとパスワードでログインしてください。";$("login-modal").classList.add("open");return}
currentUser=user;let [p,r]=await Promise.all([getDoc(doc(db,"profiles",user.uid)),getDocs(collection(db,"staffRoles"))]);currentProfile=p.exists()?p.data():{};roles={};r.forEach(x=>roles[x.id]=x.data());updateUserArea();updateComposer();startPosts()
}catch(e){console.error(e);$("messages").textContent="アカウント情報を読み込めません："+e.message}}
onAuthStateChanged(auth,u=>{if(!authFlow)syncUser(u)});
$("post-input").addEventListener("keydown",postKey);$("post-image").addEventListener("change",choosePostImage);$("photo-file").addEventListener("change",async e=>{let f=e.target.files?.[0];if(!f)return;try{profileImage=await imageData(f,120*1024,256);updateProfilePreview()}catch(err){$("profile-error").textContent=err.message}e.target.value=""});$("profile-name").addEventListener("input",updateProfilePreview);
await setPersistence(auth,browserLocalPersistence);applyTheme();updateAuthMode();selectChannel(settings[currentChannel]?currentChannel:"announcement");
Object.assign(window,{selectChannel,toggleSidebar,closeSidebar,openLogin,closeLogin,toggleAuthMode,emailAction,googleSignup,setupGooglePassword,toggleTheme,sendPost,loadReplies,sendReply,replyKey,editPost,removePost,removeReply,logout,openProfile,viewProfile,closeProfile,saveProfile,clearAttachment});
</script>
</body>
